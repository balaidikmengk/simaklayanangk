                                                tile('SMA', fmt(sma.sudah), [
                                                                ['Dari total SMA', fmt(sma.total)],
                                                                ['Persentase', fmtPersen(persen(sma.sudah, sma.total))]
                                                ]) +
                                                tile('SMK', fmt(smk.sudah), [
                                                                ['Dari total SMK', fmt(smk.total)],
                                                                ['Persentase', fmtPersen(persen(smk.sudah, smk.total))]
                                                ]) +
                                                (level ? tile('Sudah registrasi SIDIA', fmt(sidia.sudah), [
                                                                ['Dari total sekolah', fmt(data.total)],
                                                                ['Persentase', fmtPersen(persen(sidia.sudah, data.total))]
                                                ]) : '') +

                                '<h3 class="sub-title">' + (level ? 'Berdasarkan level' : 'Berdasarkan tingkat') + '</h3>' +
                                '<div class="tiles">' +
                                                tingkat.map(function(t) {
                                                                return tile(escapeHtml(t.judul || ('Adiwiyata ' + t.nama)), fmt(t.jumlah), [
                                                                                ['SMA', fmt(t.SMA)],
                                                                                ['SMK', fmt(t.SMK)]
                                                                ]);
                                                }).join('') +
                                '</div>' +

                                '<h3 class="sub-title">Daftar sekolah</h3>' +
                                '<div class="toolbar">' +
                                                '<div class="grow"><label class="field-label" for="searchAdiwiyata">Pencarian</label>' +
                                                                '<div class="search-wrap">' + ic('search') +
                                                                                '<input type="text" id="searchAdiwiyata" class="input" autocomplete="off" ' +
                                                                                                'placeholder="' + (level ? 'Cari nama sekolah' : 'Cari nama sekolah atau NPSN') + '" oninput="filterAdiwiyata()"></div></div>' +
                                                filterStatus +
                                                '<div class="fixed"><label class="field-label" for="filterTingkatAdiwiyata">' + (level ? 'Level' : 'Tingkat') + '</label>' +
                                                                '<select id="filterTingkatAdiwiyata" class="select" onchange="filterAdiwiyata()">' +
                                                                                '<option value="">' + (level ? 'Semua level' : 'Semua tingkat') + '</option>' + opsiTingkat +
                                                                '</select></div>' +
                                                '<div class="fixed"><label class="field-label" for="filterJenjangAdiwiyata">Jenjang</label>' +
                                                                '<select id="filterJenjangAdiwiyata" class="select" onchange="filterAdiwiyata()">' +
                                                                                '<option value="">Semua jenjang</option><option value="SMA">SMA</option><option value="SMK">SMK</option>' +
                                                                '</select></div>' +

                                '<div class="table-wrap" style="max-height:480px;overflow-y:auto"><table class="table table-wide"><thead><tr>' + kolomTabel +
                                                '</tr></thead><tbody id="adiwiyataBody"></tbody></table></div>' +
                                '<p class="result-info" style="margin:14px 0 0">Sumber data: ' +
                                                '<a href="' + ADIWIYATA_SUMBER_URL + '" target="_blank" rel="noopener noreferrer">Dashboard Adiwiyata DIY (adiwiyatadashboard.netlify.app)</a>' +
                                                (data.keterangan ? '. ' + escapeHtml(data.keterangan) : '.') + '</p>');

                filterAdiwiyata();
}

function badgeLevelAdiwiyata(s) {
                if (s.level === null || s.level === undefined || s.level === '') return badgeStatus(s.status);
                return '<span class="badge badge-' + s.status + '">Level ' + escapeHtml(String(s.level)) + '</span> ' +
                                '<span style="font-weight:600">' + escapeHtml(s.levelNama || '') + '</span>';
}

function filterAdiwiyata() {
                const body = document.getElementById('adiwiyataBody');
                if (!body) return;
                const level = window.modeAdiwiyata === 'level';
                const keyword = document.getElementById('searchAdiwiyata').value.toLowerCase().trim();
                const status = document.getElementById('filterStatusAdiwiyata').value;
                const tingkat = document.getElementById('filterTingkatAdiwiyata').value;
                const jenjang = document.getElementById('filterJenjangAdiwiyata').value;
                const all = window.dataAdiwiyata || [];

                const hasil = all.filter(function(s) {
                                const teks = [s.nama, s.npsn].join(' ').toLowerCase();
                                return teks.indexOf(keyword) > -1 &&
                                                (!status || (level ? s.sidia === status : s.status === status)) &&
                                                (!tingkat || s.tingkat === tingkat) &&
                                                (!jenjang || s.jenjang === jenjang);
                });

                const kolom = level ? 7 : 7;
                if (hasil.length === 0) {
                                body.innerHTML = '<tr><td colspan="' + kolom + '" class="c" style="padding:28px;color:var(--muted)">' +
                                                'Tidak ada sekolah yang cocok. Coba kata kunci atau filter lain.</td></tr>';
                } else {
                                body.innerHTML = hasil.map(function(s, index) {
                                                if (level) {
                                                                return '<tr>' +
                                                                                '<td class="num">' + (index + 1) + '</td>' +
                                                                                '<td class="strong">' + escapeHtml(s.nama || '-') + '</td>' +
                                                                                '<td class="nowrap">' + escapeHtml((s.jenjang || '-') + (s.statusSekolah ? ' ' + s.statusSekolah : '')) + '</td>' +
                                                                                '<td>' + badgeLevelAdiwiyata(s) + '</td>' +
                                                                                '<td class="c">' + escapeHtml(s.tahun || '-') + '</td>' +
                                                                                '<td>' + escapeHtml(s.keterangan || '-') + '</td>' +
                                                                                '<td class="c">' + (s.sidia
                                                                                                ? '<span class="badge badge-' + (/^sudah/i.test(s.sidia) ? 'sudah' : 'belum') + '">' + escapeHtml(s.sidia) + '</span>'
                                                                                                : '-') + '</td>' +
                                                                '</tr>';
                                                }
                                                return '<tr>' +
                                                                '<td class="num">' + (index + 1) + '</td>' +
                                                                '<td class="strong">' + escapeHtml(s.nama || '-') + '</td>' +
                                                                '<td class="nowrap">' + escapeHtml(s.npsn || '-') + '</td>' +
                                                                '<td>' + escapeHtml(s.jenjang || '-') + '</td>' +
                                                                '<td class="c">' + badgeStatus(s.status) + '</td>' +
                                                                '<td>' + (s.tingkat ? '<b>' + escapeHtml(s.tingkat) + '</b>' : '-') + '</td>' +
                                                                '<td class="c">' + escapeHtml(s.tahun || '-') + '</td>' +
                                                '</tr>';
                                }).join('');
                }

                const info = document.getElementById('adiwiyataInfo');
                if (info) info.textContent = 'Menampilkan ' + hasil.length + ' dari ' + all.length + ' sekolah';
}

/* =====================================================
                        UNDUH DAFTAR SEKOLAH ADIWIYATA (Excel)
                        Seluruh sekolah (tidak terpengaruh pencarian dan filter di layar), ditambah rekap dan info sumber.
===================================================== */
const ADIWIYATA_NAMA_LEVEL = ['Belum Adiwiyata', 'Registrasi SIDIA', 'Adiwiyata DIY', 'Adiwiyata Nasional', 'Adiwiyata Mandiri'];

function unduhDaftarAdiwiyata() {
                if (window.dataAdiwiyata && window.dataAdiwiyata.length > 0) {
                                buatExcelAdiwiyata(window.dataAdiwiyata);
                                return;
                }
                showToast('Menyiapkan daftar sekolah Adiwiyata...');
                google.script.run
                                .withSuccessHandler(function(data) {
                                                window.dataAdiwiyata = (data && data.sekolah) || [];
                                                window.ketAdiwiyata = (data && data.keterangan) || '';
                                                buatExcelAdiwiyata(window.dataAdiwiyata);
                                })
                                .withFailureHandler(function(error) {
                                                console.error('Gagal menyiapkan daftar Adiwiyata:', error);
                                                showToast('Daftar sekolah Adiwiyata belum bisa disiapkan. Coba lagi sebentar.');
                                })
                                .getRekapAdiwiyata();
}

function susunDaftarAdiwiyata(data) {
                // Format baru (level 0 sampai 4) dikenali dari adanya isian level; format lama memakai status dan tingkat.
                const level = data.some(function(s) { return s.level !== null && s.level !== undefined && s.level !== ''; });
                const teks = function(v) { return String(v === null || v === undefined ? '' : v).trim(); };
                const jenjangStatus = function(s) { return (teks(s.jenjang) + (s.statusSekolah ? ' ' + teks(s.statusSekolah) : '')).trim(); };

                let baris, rekap;
                if (level) {
                                baris = [['No', 'Nama Sekolah', 'NPSN', 'Jenjang', 'Level', 'Nama Level', 'Tahun', 'Keterangan', 'Status SIDIA']];
                                data.forEach(function(s, i) {
                                                baris.push([i + 1, teks(s.nama), teks(s.npsn), jenjangStatus(s), Number(s.level), teks(s.levelNama), teks(s.tahun), teks(s.keterangan), teks(s.sidia)]);
                                });
                                rekap = [['Level', 'SMA', 'SMK', 'Jumlah']];
                                const total = { SMA: 0, SMK: 0 };
                                [4, 3, 2, 1, 0].forEach(function(lv) {
                                                const sma = data.filter(function(s) { return Number(s.level) === lv && s.jenjang === 'SMA'; }).length;
                                                const smk = data.filter(function(s) { return Number(s.level) === lv && s.jenjang === 'SMK'; }).length;
                                                total.SMA += sma; total.SMK += smk;
                                                rekap.push(['Level ' + lv + ' - ' + ADIWIYATA_NAMA_LEVEL[lv], sma, smk, sma + smk]);
                                });
                                rekap.push(['TOTAL', total.SMA, total.SMK, total.SMA + total.SMK]);
                } else {
                                baris = [['No', 'Nama Sekolah', 'NPSN', 'Jenjang', 'Status', 'Tingkat', 'Tahun']];
                                const namaStatus = { sudah: 'Sudah', proses: 'Proses', belum: 'Belum' };
                                data.forEach(function(s, i) {
                                                baris.push([i + 1, teks(s.nama), teks(s.npsn), teks(s.jenjang), namaStatus[s.status] || teks(s.status), teks(s.tingkat), teks(s.tahun)]);
                                });
                                rekap = [['Status', 'SMA', 'SMK', 'Jumlah']];
                                const total = { SMA: 0, SMK: 0 };
                                ['sudah', 'proses', 'belum'].forEach(function(st) {
                                                const sma = data.filter(function(s) { return s.status === st && s.jenjang === 'SMA'; }).length;
                                                const smk = data.filter(function(s) { return s.status === st && s.jenjang === 'SMK'; }).length;
                                                total.SMA += sma; total.SMK += smk;
                                                if (st !== 'proses' || sma + smk > 0) rekap.push([namaStatus[st], sma, smk, sma + smk]);
                                });
                                rekap.push(['TOTAL', total.SMA, total.SMK, total.SMA + total.SMK]);
                }
                return { baris: baris, rekap: rekap, jumlah: data.length, level: level };
}

function buatExcelAdiwiyata(data) {
                if (!data || data.length === 0) {
                                showToast('Belum ada data Adiwiyata untuk diunduh.');
                                return;
                }
                const t = susunDaftarAdiwiyata(data);
                const namaFile = namaFileUnduh('Daftar Sekolah Adiwiyata');
                const info = [
                                [NAMA_SITUS_UNDUH],
                                ['Bagian', 'Sekolah Adiwiyata'],
                                ['Jumlah', t.jumlah + ' sekolah'],
                                ['Sumber data', 'Dashboard Adiwiyata DIY (' + ADIWIYATA_SUMBER_TEKS + ')']
                ];
                if (window.ketAdiwiyata) info.push(['Keterangan', window.ketAdiwiyata]);
                info.push(['Diunduh', tanggalIndonesia()]);

                muatXlsx(function() {
                                const wb = XLSX.utils.book_new();
                                const ws = XLSX.utils.aoa_to_sheet(t.baris);
                                ws['!cols'] = t.level
                                                ? [{ wch: 5 }, { wch: 46 }, { wch: 11 }, { wch: 14 }, { wch: 7 }, { wch: 20 }, { wch: 8 }, { wch: 36 }, { wch: 18 }]
                                                : [{ wch: 5 }, { wch: 46 }, { wch: 11 }, { wch: 9 }, { wch: 9 }, { wch: 14 }, { wch: 8 }];
                                XLSX.utils.book_append_sheet(wb, ws, 'Daftar Sekolah');
                                const wr = XLSX.utils.aoa_to_sheet(t.rekap);
                                wr['!cols'] = [{ wch: 30 }, { wch: 8 }, { wch: 8 }, { wch: 10 }];
                                XLSX.utils.book_append_sheet(wb, wr, 'Rekap');
                                const wi = XLSX.utils.aoa_to_sheet(info);
                                wi['!cols'] = [{ wch: 14 }, { wch: 70 }];
                                XLSX.utils.book_append_sheet(wb, wi, 'Info');
                                XLSX.writeFile(wb, namaFile + '.xlsx');
                }, function() {
                                showToast('Pustaka Excel gagal dimuat, data diunduh sebagai CSV.');
                                unduhCsv({
                                                judul: 'Daftar Sekolah Adiwiyata',
                                                ringkasan: t.rekap,
                                                tabel: [{ nama: 'Daftar Sekolah', baris: t.baris }]
                                }, namaFile);
                });
}

/* =====================================================
                        PETA SEBARAN SEKOLAH (Leaflet, dimuat saat dibuka)
===================================================== */
const LEAFLET_CSS = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css';
const LEAFLET_JS = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js';
const PETA_WARNA = { SMA: '#123b5d', SMK: '#e9b44c' };
window.petaState = { loading: false, map: null, layer: null, data: [], tanpaKoordinat: 0 };

function onSerbaAccordionOpen(id) {
                if (id !== 'accordionPeta') return;
                const st = window.petaState;
                const wadah = document.getElementById('petaMap');

                // Peta masih menempel di halaman: cukup sesuaikan ukuran setelah akordion dibuka lagi.
                if (st.map && wadah && st.map.getContainer() === wadah) {
                                setTimeout(function() { st.map.invalidateSize(); }, 60);
                                return;
                }

                // Halaman Serba Informasi digambar ulang (mis. setelah membuka detail sekolah lalu kembali),
                // sehingga peta lama terlepas dari halaman. Bangun ulang dari data yang sudah dimuat.
                if (st.map) {
                                try { st.map.remove(); } catch (e) {}
                                st.map = null;
                                st.layer = null;
                }
                if (window.L && st.data && st.data.length > 0) {
                                buildPetaSekolah();
                                return;
                }
                initPetaSekolah();
}

function loadLeaflet(onReady, onError) {
                if (window.L) { onReady(); return; }
                if (!document.getElementById('leafletCss')) {
                                const link = document.createElement('link');
                                link.id = 'leafletCss';
                                link.rel = 'stylesheet';
                                link.href = LEAFLET_CSS;
                                document.head.appendChild(link);
                }
                const script = document.createElement('script');
                script.src = LEAFLET_JS;
                script.onload = onReady;
                script.onerror = onError;
                document.head.appendChild(script);
}

function initPetaSekolah() {
                const st = window.petaState;
                if (st.loading) return;
                st.loading = true;
                setHtml('petaContainer', memuat('Memuat peta...'));

                let leafletSiap = false;
                let dataSiap = false;
                let gagal = false;

                function selesai() {
                                if (gagal || !leafletSiap || !dataSiap) return;
                                st.loading = false;
                                buildPetaSekolah();
                }
                function error(pesan) {
                                if (gagal) return;
                                gagal = true;
                                st.loading = false;
                                setHtml('petaContainer', errorState('Peta belum bisa dimuat', pesan));
                }

                loadLeaflet(
                                function() { leafletSiap = true; selesai(); },
                                function() { error('Pustaka peta (Leaflet) gagal dimuat. Periksa koneksi internet lalu buka kembali bagian ini.'); }
                );

                google.script.run
                                .withSuccessHandler(function(data) {
                                                const hasil = [];
                                                let tanpa = 0;
                                                (data || []).forEach(function(s) {
                                                                const lat = toKoordinat(s.lat !== undefined ? s.lat : (s.lintang !== undefined ? s.lintang : s.latitude));
                                                                const lng = toKoordinat(s.lng !== undefined ? s.lng : (s.bujur !== undefined ? s.bujur : s.longitude));
                                                                if (lat === null || lng === null || lat < -90 || lat > 90 || lng < -180 || lng > 180) { tanpa++; return; }
                                                                hasil.push({
                                                                                id: s.id,
                                                                                nama: s.nama || s.nama_satuan_pendidikan || '-',
                                                                                npsn: s.npsn || '',
                                                                                jenjang: String(s.jenjang || '').trim().toUpperCase(),
                                                                                status_sekolah: s.status_sekolah || s.status || '',
                                                                                alamat: s.alamat || '',
                                                                                lat: lat,
                                                                                lng: lng
                                                                });
                                                });
                                                st.data = hasil;
                                                st.tanpaKoordinat = tanpa;
                                                dataSiap = true;
                                                selesai();
                                })
                                .withFailureHandler(function(err) {
                                                console.error('Gagal memuat data peta:', err);
                                                error('Pastikan fungsi getPetaSekolah sudah ada di Apps Script.');
                                })
                                .getPetaSekolah();
}

function toKoordinat(value) {
                if (value === null || value === undefined || value === '') return null;
                const n = Number(String(value).trim().replace(',', '.'));
                return isFinite(n) ? n : null;
}

function buildPetaSekolah() {
                const st = window.petaState;
                if (st.data.length === 0) {
                                setHtml('petaContainer', emptyState('Belum ada koordinat sekolah',
                                                'Isi kolom lintang dan bujur pada data sekolah agar titik tampil di peta.'));
                                return;
                }

                if (st.map) {
                                try { st.map.remove(); } catch (e) {}
                                st.map = null;
                                st.layer = null;
                }

                setHtml('petaContainer',
                                '<div class="toolbar">' +
                                                '<div class="fixed"><label class="field-label" for="petaJenjang">Jenjang</label>' +
                                                                '<select id="petaJenjang" class="select" onchange="filterPeta()">' +
                                                                                '<option value="">Semua jenjang</option><option value="SMA">SMA</option><option value="SMK">SMK</option>' +
                                                                '</select></div>' +
                                                '<div class="fixed"><label class="field-label" for="petaStatus">Status</label>' +
                                                                '<select id="petaStatus" class="select" onchange="filterPeta()">' +
                                                                                '<option value="">Semua status</option><option value="negeri">Negeri</option><option value="swasta">Swasta</option>' +
                                                                '</select></div>' +
                                '</div>' +
                                '<div class="map-legend">' +
                                                '<span><i style="background:' + PETA_WARNA.SMA + '"></i>SMA</span>' +
                                                '<span><i style="background:' + PETA_WARNA.SMK + '"></i>SMK</span>' +
                                '</div>' +
                                '<p class="result-info" id="petaInfo"></p>' +
                                '<div id="petaMap" class="map-box"></div>');

                st.map = L.map('petaMap', { scrollWheelZoom: false }).setView([-7.96, 110.6], 10);
                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                                maxZoom: 19,
                                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
                }).addTo(st.map);
                st.layer = L.layerGroup().addTo(st.map);

                // Setiap kali kotak peta berubah ukuran (mis. akordion dibuka setelah ditutup), hitung ulang ukuran peta.
                if (window.ResizeObserver) {
                                const peta = st.map;
                                new ResizeObserver(function() {
                                                if (window.petaState.map === peta) peta.invalidateSize();
                                }).observe(document.getElementById('petaMap'));
                }

                filterPeta(true);
                setTimeout(function() { st.map.invalidateSize(); }, 60);
}

function filterPeta(fit) {
                const st = window.petaState;
                if (!st.map || !st.layer) return;
                const jenjang = document.getElementById('petaJenjang').value;
                const status = document.getElementById('petaStatus').value;

                const hasil = st.data.filter(function(s) {
                                return (!jenjang || s.jenjang === jenjang) &&
                                                (!status || String(s.status_sekolah).trim().toLowerCase() === status);
                });

                st.layer.clearLayers();
                const titik = [];
                hasil.forEach(function(s) {
                                const marker = L.circleMarker([s.lat, s.lng], {
                                                radius: 7,
                                                weight: 1.5,
                                                color: '#ffffff',
                                                fillColor: PETA_WARNA[s.jenjang] || '#5b6b7b',
                                                fillOpacity: 0.95
                                });
                                marker.bindTooltip(escapeHtml(s.nama));
                                marker.bindPopup(
                                                '<div class="map-pop"><strong>' + escapeHtml(s.nama) + '</strong>' +
                                                '<p>' + escapeHtml(s.jenjang || '-') + (s.status_sekolah ? ' &middot; ' + escapeHtml(s.status_sekolah) : '') +
                                                                (s.npsn ? ' &middot; NPSN ' + escapeHtml(s.npsn) : '') + '</p>' +
                                                (s.alamat ? '<p>' + escapeHtml(s.alamat) + '</p>' : '') +
                                                (s.id !== undefined && s.id !== ''
                                                                ? '<button type="button" class="btn btn-ghost btn-sm" data-id="' + escapeHtml(s.id) + '" ' +
                                                                                'onclick="showDetailSekolah(this.dataset.id)">Lihat detail</button>'
                                                                : '') +
                                                '</div>');
                                marker.addTo(st.layer);
                                titik.push([s.lat, s.lng]);
                });

                if (titik.length > 0 && fit !== false) {
                                st.map.fitBounds(titik, { padding: [30, 30], maxZoom: 13 });
                }

                const info = document.getElementById('petaInfo');
                if (info) {
                                info.textContent = 'Menampilkan ' + hasil.length + ' sekolah di peta' +
                                                (st.tanpaKoordinat > 0 ? ' (' + st.tanpaKoordinat + ' sekolah belum memiliki koordinat)' : '');
                }
}

function renderRekapPTK(data) {
                if (!data || !data.total || data.total.total === 0) {
                                setHtml('rekapPTKContainer', emptyState('Belum ada data PTK', 'Impor data ke sheet PTK terlebih dahulu.'));
                                return;
                }

                const t = data.total;
                const sk = data.status_kepegawaian;
                const pd = data.pendidikan;

                setHtml('rekapPTKContainer',
                                '<div class="tiles">' +
                                                tile('Total PTK', fmt(t.total), [
                                                                ['Pendidik (guru dan kepala sekolah)', fmt(t.pendidik)],
                                                                ['Tenaga kependidikan', fmt(t.tenaga)]
                                                ]) +
                                                tile('Jenis kelamin', fmt(data.jenis_kelamin.laki_laki + data.jenis_kelamin.perempuan), [
                                                                ['Laki-laki', fmt(data.jenis_kelamin.laki_laki)],
                                                                ['Perempuan', fmt(data.jenis_kelamin.perempuan)]
                                                ]) +
                                                tile('Status kepegawaian', fmt(t.total), [
                                                                ['PNS / CPNS', fmt(sk.pns)],

const GRUP_TAMBAHAN = [['sma_negeri', 'SMA Negeri'], ['sma_swasta', 'SMA Swasta'], ['smk_negeri', 'SMK Negeri'], ['smk_swasta', 'SMK Swasta']];

// Kelompok usia: 13 tahun ke bawah digabung, 14 sampai 20 per tahun, 21 tahun ke atas digabung.
function kelompokUsia(usia) {
                const hasil = [{ label: '13 tahun ke bawah', l: 0, p: 0 }];
                for (let u = 14; u <= 20; u++) hasil.push({ label: u + ' tahun', l: 0, p: 0 });
                hasil.push({ label: '21 tahun ke atas', l: 0, p: 0 });
                usia.forEach(function(x, u) {
                                const k = u <= 13 ? 0 : (u >= 21 ? 8 : u - 13);
                                hasil[k].l += x.l; hasil[k].p += x.p;
                });
                return hasil;
}

function tabelUsiaHtml(usia, totalPD) {
                const k = kelompokUsia(usia).filter(function(x, i) { return (x.l + x.p) > 0 || (i > 0 && i < 8); });
                const jml = k.reduce(function(t, x) { return t + x.l + x.p; }, 0);
                const L = k.reduce(function(t, x) { return t + x.l; }, 0);
                const P = k.reduce(function(t, x) { return t + x.p; }, 0);
                const pct = function(n) { return jml > 0 ? (n / jml * 100).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + '%' : '0%'; };
                return '<div class="table-wrap"><table class="table"><thead><tr><th>Usia</th><th class="c">Laki-laki</th><th class="c">Perempuan</th><th class="c">Jumlah</th><th class="c">Persentase</th></tr></thead><tbody>' +
                                k.map(function(x) {
                                                return '<tr><td class="strong">' + x.label + '</td><td class="c">' + fmt(x.l) + '</td><td class="c">' + fmt(x.p) + '</td><td class="c"><b>' + fmt(x.l + x.p) + '</b></td><td class="c">' + pct(x.l + x.p) + '</td></tr>';
                                }).join('') +
                                '<tr class="total"><td>Total</td><td class="c">' + fmt(L) + '</td><td class="c">' + fmt(P) + '</td><td class="c">' + fmt(jml) + '</td><td class="c">100%</td></tr>' +
                                '</tbody></table></div>';
}

function unduhTambahanPerSekolah() {

                if (!d || !d.sekolah || !d.sekolah.length) { showToast('Data tambahan per sekolah belum tersedia.'); return; }
                pastikanDataSekolah(function() {
                                const sekolah = urutkanSesuaiDaftarSekolah(d.sekolah);
                                const awal = function(x, i) { return [i + 1, x.nama, x.jenjang, x.status]; };

                                const dinamika = [['No', 'Nama Sekolah', 'Jenjang', 'Status', 'Jumlah Peserta Didik', 'Baru', 'Mengulang', 'Lulus', 'Putus Sekolah']];
                                sekolah.forEach(function(x, i) { dinamika.push(awal(x, i).concat([x.pd.j, x.baru, x.mengulang, x.lulus, x.putus])); });
                                dinamika.push(['', 'Total', '', '', d.total.pd.j, d.total.baru, d.total.mengulang, d.total.lulus, d.total.putus]);
                                // 2. Sebaran usia (Laki-laki / Perempuan per kelompok usia)

                                const k1 = ['No', 'Nama Sekolah', 'Jenjang', 'Status'], k2 = ['', '', '', ''], gabung = [];
                                for (let c = 0; c < 4; c++) gabung.push({ s: { r: 0, c: c }, e: { r: 1, c: c } });
                                label.forEach(function(t, i) {
                                                k1.push(t, '', ''); k2.push('Laki-laki', 'Perempuan', 'Jumlah');
                                                gabung.push({ s: { r: 0, c: 4 + i * 3 }, e: { r: 0, c: 6 + i * 3 } });
                                });
                                const nilaiUsia = function(usia) {
                                                let h = [];
                                                kelompokUsia(usia).forEach(function(x) { h = h.concat([x.l, x.p, x.l + x.p]); });
                                                return h;
                                };
                                const usiaAoa = [k1, k2];
                                sekolah.forEach(function(x, i) { usiaAoa.push(awal(x, i).concat(nilaiUsia(x.usia))); });
                                usiaAoa.push(['', 'Total', '', ''].concat(nilaiUsia(d.total.usia)));
                                // 3. Berkebutuhan khusus
                                const kat = d.pdbk_kategori || [];
                                const pdbk = [['No', 'Nama Sekolah', 'Jenjang', 'Status'].concat(kat.map(function(k) { return k.label; }), ['Jumlah'])];
                                sekolah.forEach(function(x, i) { pdbk.push(awal(x, i).concat(kat.map(function(k) { return x.pdbk[k.kunci]; }), [x.pdbk_total])); });

                                const namaFile = namaFileUnduh(judul);
                                const lebar = function(n) { const a = [{ wch: 5 }, { wch: 46 }, { wch: 10 }, { wch: 10 }]; for (let i = 4; i < n; i++) a.push({ wch: 13 }); return a; };
                                muatXlsx(function() {
                                                const wb = XLSX.utils.book_new();
                                                const tambah = function(aoa, nama, merges) {
                                                                const ws = XLSX.utils.aoa_to_sheet(aoa);
                                                                if (merges) ws['!merges'] = merges;
                                                                ws['!cols'] = lebar(aoa[0].length);
                                                                XLSX.utils.book_append_sheet(wb, ws, nama);

                                                tambah(dinamika, 'Dinamika PD');
                                                tambah(usiaAoa, 'Sebaran Usia', gabung);

                                                XLSX.writeFile(wb, namaFile + '.xlsx');

                                                unduhCsv({ judul: judul, ringkasan: [], tabel: [{ nama: 'Dinamika PD', baris: dinamika }, { nama: 'Sebaran Usia', baris: usiaAoa }, { nama: 'Berkebutuhan Khusus', baris: pdbk }] }, namaFile);

const PDF_JS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
const PDF_AUTOTABLE_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js';

function sekolahTersaring() {
                const el = function(id) { return document.getElementById(id); };
                const keyword = el('searchSekolah') ? el('searchSekolah').value.toLowerCase().trim() : '';
                const jenjang = el('filterJenjang') ? el('filterJenjang').value : '';
                const status = el('filterStatusSekolah') ? el('filterStatusSekolah').value : '';
                const kapanewon = el('filterKapanewonSekolah') ? el('filterKapanewonSekolah').value : '';
                return (window.dataSekolah || []).filter(function(item) {
                                const teks = [item.nama_satuan_pendidikan, item.npsn, item.jenjang, item.status, item.alamat, item.kapanewon].join(' ').toLowerCase();
                                return teks.indexOf(keyword) > -1 &&
                                                (!jenjang || String(item.jenjang || '').trim().toLowerCase() === jenjang) &&
                                                (!status || String(item.status || '').trim().toLowerCase() === status) &&
                                                (!kapanewon || String(item.kapanewon || '').trim() === kapanewon);
                });
}

function infoFilterSekolah() {
                const el = function(id) { return document.getElementById(id); };
                const kata = el('searchSekolah') ? el('searchSekolah').value.trim() : '';
                const jenjang = el('filterJenjang') ? el('filterJenjang').value : '';
                const status = el('filterStatusSekolah') ? el('filterStatusSekolah').value : '';
                const kapanewon = el('filterKapanewonSekolah') ? el('filterKapanewonSekolah').value : '';
                const bagian = [];
                if (jenjang) bagian.push('Jenjang ' + jenjang.toUpperCase());
                if (kapanewon) bagian.push('Kapanewon ' + kapanewon);
                if (status) bagian.push('Status ' + status.charAt(0).toUpperCase() + status.slice(1));
                if (kata) bagian.push('Kata kunci "' + kata + '"');
                return { teks: bagian.length ? 'Filter: ' + bagian.join(', ') : 'Semua sekolah', sufiks: [jenjang, status, kapanewon, kata ? 'pencarian' : ''].filter(Boolean).join(' ') };
}

function barisUnduhSekolah(daftar) {
                return daftar.map(function(s, i) {
                                return [i + 1, String(s.nama_satuan_pendidikan || '').trim(),
                                                String(s.npsn === null || s.npsn === undefined ? '' : s.npsn).trim(),
                                                String(s.jenjang || '').trim(), String(s.status || '').trim(),
                                                String(s.akreditasi || '').trim(), String(s.alamat || '').trim(),
                                                String(s.kapanewon || '').trim()];
                });
}

const KOLOM_SEKOLAH = ['No', 'Nama Satuan Pendidikan', 'NPSN', 'Jenjang', 'Status', 'Akreditasi', 'Alamat', 'Kapanewon'];

function siapUnduhSekolah() {
                if (!window.dataSekolah || window.dataSekolah.length === 0) { showToast('Data sekolah belum siap, coba lagi sebentar.'); return null; }
                const daftar = sekolahTersaring();
                if (daftar.length === 0) { showToast('Tidak ada sekolah yang cocok untuk diunduh.'); return null; }
                const f = infoFilterSekolah();
                return { daftar: daftar, baris: barisUnduhSekolah(daftar), filter: f.teks, nama: namaFileUnduh('Daftar Sekolah' + (f.sufiks ? ' ' + f.sufiks : '')) };
}

function unduhExcelSekolah() {
                const u = siapUnduhSekolah();
                if (!u) return;
                const tabel = [KOLOM_SEKOLAH].concat(u.baris);
                muatXlsx(function() {
                                const wb = XLSX.utils.book_new();
                                const ws = XLSX.utils.aoa_to_sheet(tabel);
                                ws['!cols'] = [{ wch: 5 }, { wch: 46 }, { wch: 11 }, { wch: 9 }, { wch: 9 }, { wch: 11 }, { wch: 60 }, { wch: 22 }];
                                XLSX.utils.book_append_sheet(wb, ws, 'Daftar Sekolah');
                                XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
                                                [NAMA_SITUS_UNDUH], ['Bagian', 'Daftar Sekolah'], ['Filter', u.filter],
                                                ['Jumlah', u.daftar.length + ' dari ' + window.dataSekolah.length + ' sekolah'], ['Diunduh', tanggalIndonesia()]
                                ]), 'Info');
                                XLSX.writeFile(wb, u.nama + '.xlsx');
                }, function() {
                                showToast('Pustaka Excel gagal dimuat, data diunduh sebagai CSV.');
                                unduhCsv({ judul: 'Daftar Sekolah', ringkasan: [], tabel: [{ nama: 'Daftar Sekolah (' + u.filter + ')', baris: tabel }] }, u.nama);
                });
}

// jsPDF harus dimuat sebelum AutoTable. Keduanya dimuat saat tombol PDF pertama kali diklik.
function muatPdf(onReady, onError) {
                if (window.pdfLibSiap) { onReady(); return; }
                function muat(url, lanjut) {
                                const sc = document.createElement('script');
                                sc.src = url;
                                sc.onload = lanjut;
                                sc.onerror = onError;
                                document.head.appendChild(sc);
                }
                muat(PDF_JS_URL, function() {
                                if (window.jspdf && window.jspdf.jsPDF && !window.jsPDF) window.jsPDF = window.jspdf.jsPDF;
                                muat(PDF_AUTOTABLE_URL, function() { window.pdfLibSiap = true; onReady(); });
                });
}

function unduhPdfSekolah() {
                const u = siapUnduhSekolah();
                if (!u) return;
                showToast('Menyiapkan PDF...');
                muatPdf(function() {
                                const doc = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'pt', format: 'a4' });
                                doc.setFontSize(16);
                                doc.text('Daftar Sekolah', 40, 42);
                                doc.setFontSize(9);
                                doc.setTextColor(90);
                                doc.text(NAMA_SITUS_UNDUH + ' | Diunduh ' + tanggalIndonesia(), 40, 58);
                                doc.text(u.filter + ' | ' + u.daftar.length + ' dari ' + window.dataSekolah.length + ' sekolah', 40, 71);
                                doc.autoTable({
                                                startY: 86,
                                                head: [KOLOM_SEKOLAH],
                                                body: u.baris,
                                                theme: 'grid',
                                                styles: { fontSize: 8, cellPadding: 4, overflow: 'linebreak', textColor: 30 },
                                                headStyles: { fillColor: [18, 59, 93], textColor: 255 },
                                                columnStyles: { 0: { cellWidth: 24, halign: 'center' }, 1: { cellWidth: 130 }, 2: { cellWidth: 50 }, 3: { cellWidth: 38 }, 4: { cellWidth: 40 }, 5: { cellWidth: 46, halign: 'center' } },
                                                margin: { left: 40, right: 40, bottom: 40 },
                                                didDrawPage: function() {
                                                                doc.setFontSize(8);
                                                                doc.setTextColor(120);
                                                                doc.text('Halaman ' + doc.internal.getNumberOfPages(), 40, doc.internal.pageSize.getHeight() - 20);
                                                }
                                });
                                doc.save(u.nama + '.pdf');
                }, function() {
                                showToast('Pustaka PDF belum bisa dimuat. Periksa koneksi internet, atau gunakan Unduh Excel.');
                });
}

function filterSekolah() {
                const body = document.getElementById('sekolahBody');
                if (!body) return;

                const all = window.dataSekolah || [];
                const hasil = sekolahTersaring();

                if (hasil.length === 0) {
                                body.innerHTML = '<tr><td colspan="9" class="c" style="padding:28px;color:var(--muted)">' +
                                                'Tidak ada sekolah yang cocok. Coba kata kunci atau filter lain.</td></tr>';
                } else {
                                body.innerHTML = hasil.map(function(item, index) {
                                                return '<tr>' +
                                                                '<td class="num">' + (index + 1) + '</td>' +
                                                                '<td class="strong">' + escapeHtml(item.nama_satuan_pendidikan || '-') + '</td>' +
                                                                '<td class="nowrap">' + escapeHtml(item.npsn || '-') + '</td>' +
                                                                '<td>' + escapeHtml(item.jenjang || '-') + '</td>' +
                                                                '<td>' + escapeHtml(item.status || '-') + '</td>' +
                                                                '<td class="c">' + escapeHtml(item.akreditasi || '-') + '</td>' +
                                                                '<td>' + escapeHtml(item.alamat || '-') + '</td>' +
                                                                '<td>' + escapeHtml(item.kapanewon || '-') + '</td>' +
                                                                '<td class="c"><button type="button" class="btn btn-ghost btn-sm" data-id="' + escapeHtml(item.id) + '" ' +
                                                                                'onclick="showDetailSekolah(this.dataset.id)">Detail</button></td>' +
                                                '</tr>';
                                }).join('');
                }

                const info = document.getElementById('schoolSearchInfo');
                if (info) {
                                info.textContent = 'Menampilkan ' + hasil.length + ' dari ' + all.length + ' sekolah';
                }
}

function loadAdiwiyataSekolah(idSekolah, npsn) {
                // Memakai data yang sudah dimuat (bila halaman Serba Informasi pernah dibuka), jika belum, ambil dari server.
                if (window.dataAdiwiyata) {
                                renderAdiwiyataSekolah(cariAdiwiyataSekolah(idSekolah, npsn));
                                return;
                }
                google.script.run
                                .withSuccessHandler(function(data) {
                                                window.dataAdiwiyata = (data && data.sekolah) || [];
                                                renderAdiwiyataSekolah(cariAdiwiyataSekolah(idSekolah, npsn));
                                })
                                .withFailureHandler(function(error) {
                                                console.error('Gagal memuat status Adiwiyata:', error);
                                                setHtml('adiwiyataSekolah', '<span style="font-weight:500;color:var(--muted)">-</span>');
                                })
                                .getRekapAdiwiyata();
}

function cariAdiwiyataSekolah(idSekolah, npsn) {
                const id = String(idSekolah || '').trim();
                const np = String(npsn || '').replace(/\D/g, '');
                const daftar = window.dataAdiwiyata || [];
                for (let i = 0; i < daftar.length; i++) {
                                const item = daftar[i];
                                if (id && String(item.id || '').trim() === id) return item;
                }
                for (let i = 0; i < daftar.length; i++) {
                                if (np && String(item_npsn(daftar[i])).replace(/\D/g, '') === np) return daftar[i];
                }
                return null;
}

function item_npsn(item) {
                return item && item.npsn !== undefined && item.npsn !== null ? item.npsn : '';
}

function renderAdiwiyataSekolah(item) {
                if (!item) {
                                setHtml('adiwiyataSekolah', '-');
                                return;
                }
                if (item.level !== null && item.level !== undefined && item.level !== '') {
                                setHtml('adiwiyataSekolah', badgeLevelAdiwiyata(item) +
                                                (item.tahun ? ' <span style="font-weight:500;color:var(--muted)">' + escapeHtml(item.tahun) + '</span>' : ''));
                                return;
                }
                let html = badgeStatus(item.status);
                if (item.status === 'sudah' && (item.tingkat || item.tahun)) {
                                html += ' <span style="font-weight:500;color:var(--muted)">' +
                                                (item.tingkat ? 'Tingkat ' + escapeHtml(item.tingkat) : '') +
                                                (item.tingkat && item.tahun ? ' &middot; ' : '') +
                                                (item.tahun ? escapeHtml(item.tahun) : '') + '</span>';
                }
                setHtml('adiwiyataSekolah', html);
}

function loadPtkSekolah(idSekolah) {

                                .withSuccessHandler(function(data) { renderPtkSekolah(data); })

                                                console.error('Gagal memuat PTK sekolah:', error);
                                                setHtml('ptkSekolahContainer', errorState('Data PTK belum bisa dimuat',
                                                                'Pastikan fungsi getRekapPTKSekolah sudah ada di file ptk.gs.'));
                                })

}

                }

                const t = data.total;
                const sk = data.status_kepegawaian;

                setHtml('ptkSekolahContainer',

                                                '<div><b>' + fmt(t.total) + '</b><span>Total PTK</span></div>' +
                                                '<div><b>' + fmt(t.pendidik) + '</b><span>Pendidik</span></div>' +
                                                '<div><b>' + fmt(t.tenaga) + '</b><span>Tenaga kependidikan</span></div>' +
                                                '<div><b>' + fmt(data.jenis_kelamin.laki_laki) + '</b><span>Laki-laki</span></div>' +
                                                '<div><b>' + fmt(data.jenis_kelamin.perempuan) + '</b><span>Perempuan</span></div>' +
                                '</div>' +
                                '<div class="mini-stats">' +
                                                '<div><b>' + fmt(sk.pns) + '</b><span>PNS / CPNS</span></div>' +
                                                '<div><b>' + fmt(sk.pppk) + '</b><span>PPPK</span></div>' +
                                                '<div><b>' + fmt(sk.yayasan) + '</b><span>GTY / PTY</span></div>' +
                                                '<div><b>' + fmt(sk.honor) + '</b><span>Honor</span></div>' +

                                '</div>' +

                                                '<th class="c">No</th><th>Jabatan</th><th class="c">Jumlah</th></tr></thead><tbody>' +
                                                data.jabatan.map(function(item, index) {
                                                                return '<tr><td class="num">' + (index + 1) + '</td>' +
                                                                                '<td>' + escapeHtml(item.jabatan) + '</td>' +
                                                                                '<td class="c"><b>' + fmt(item.jumlah) + '</b></td></tr>';
                                                }).join('') +
                                                '<tr class="total"><td colspan="2">Total</td><td class="c">' + fmt(t.total) + '</td></tr>' +
                                '</tbody></table></div>' +
                                (data.non_induk > 0

                                                                ' PTK lain bertugas di sekolah ini sebagai tugas tambahan (non induk) dan tidak masuk hitungan di atas.</p>'
                                                : ''));
}

                const container = document.getElementById('kegiatanContainer');

function muatPesertaKegiatan() {
                function segarkan() {

                }
                google.script.run
                                .withSuccessHandler(function(data) {
                                                const peta = {};
                                                (data || []).forEach(function(p) { (peta[p.kegiatan_id] = peta[p.kegiatan_id] || []).push(p); });
                                                window.pesertaKegiatan = peta;
                                                segarkan();
                                })

                                                console.error('Gagal memuat peserta kegiatan:', error);
                                                window.pesertaKegiatan = window.pesertaKegiatan || {};
                                                segarkan();

function pesertaHtml(id) {
                if (!window.pesertaKegiatan) return '<span style="color:var(--muted)">...</span>';
                const list = window.pesertaKegiatan[String(id || '').trim()];
                if (!list || list.length === 0) return '-';
                const perPeran = {};
                list.forEach(function(p) {
                                const kunci = p.peran || '';
                                (perPeran[kunci] = perPeran[kunci] || []).push(p);
                });
                return Object.keys(perPeran).map(function(peran) {
                                const baris = perPeran[peran];
                                const total = baris.reduce(function(a, p) { return a + p.jumlah; }, 0);
                                return '<div style="margin-bottom:4px"><b>' + fmt(total) + ' peserta</b>' +
                                                (peran ? ' sebagai ' + escapeHtml(peran) : '') +
                                                '<div style="margin-top:2px;font-weight:500">' +
                                                baris.map(function(p) { return (p.jenjang ? escapeHtml(p.jenjang) + ' ' : '') + fmt(p.jumlah); }).join(' &middot; ') +
                                                '</div></div>';
                }).join('');
}

function factItem(label, valueHtml) {
                return '<div><dt>' + label + '</dt><dd>' + valueHtml + '</dd></div>';
}

/* =====================================================
            TIMELINE KEGIATAN
===================================================== */
const TL_BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

function tanggalIndo(iso) {
                const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
                return m ? Number(m[3]) + ' ' + TL_BULAN[Number(m[2]) - 1] + ' ' + m[1] : '';
}

function rentangTanggal(mulai, selesai) {
                if (!selesai || selesai === mulai) return tanggalIndo(mulai);
                const a = mulai.split('-'), b = selesai.split('-');
                if (a[0] === b[0] && a[1] === b[1]) return Number(a[2]) + ' - ' + tanggalIndo(selesai);
                return tanggalIndo(mulai) + ' - ' + tanggalIndo(selesai);
}

const TL_LAINNYA = 'Lainnya';

function muatFormTimeline(id) {
                if (!id) { setHtml('timelineForm', '<p class="result-info">Pilih kegiatan untuk mengatur timeline.</p>'); return; }
                setHtml('timelineForm', skeleton(2, 'sk-row'));
                google.script.run
                                .withSuccessHandler(function(r) {
                                                if (!r.ok) { keluarPanitia(r.msg); return; }
                                                window.timelineJenis = r.jenis || [];
                                                window.timelineItems = (r.data || []).map(function(x) {
                                                                const baku = window.timelineJenis.indexOf(x.tahap) > -1;
                                                                return { jenis: baku ? x.tahap : TL_LAINNYA, nama: baku ? '' : x.tahap, mulai: x.mulai, selesai: x.selesai };
                                                });
                                                renderFormTimeline();
                                })
                                .withFailureHandler(function() { setHtml('timelineForm', errorState('Timeline belum bisa dimuat')); })
                                .ambilTimelineForm(window.anggotaToken, id);
}

function renderFormTimeline() {
                const jenis = (window.timelineJenis || []).concat([TL_LAINNYA]);
                const item = window.timelineItems || [];
                setHtml('timelineForm',
                                (item.length === 0 ? '<p class="result-info">Belum ada jadwal. Klik "Tambah kegiatan" untuk memulai.</p>' : '') +
                                item.map(function(x, i) {
                                                return '<div class="tl-form-item">' +
                                                                '<div><label class="field-label">Jenis kegiatan</label><select class="select" onchange="ubahTimeline(' + i + ', \'jenis\', this.value)">' +
                                                                                '<option value="">Pilih jenis</option>' +
                                                                                jenis.map(function(j) { return '<option value="' + escapeHtml(j) + '"' + (x.jenis === j ? ' selected' : '') + '>' + escapeHtml(j) + '</option>'; }).join('') +
                                                                '</select></div>' +
                                                                (x.jenis === TL_LAINNYA
                                                                                ? '<div><label class="field-label">Nama kegiatan</label><input type="text" class="input" maxlength="100" placeholder="Ketik nama kegiatan" value="' + escapeHtml(x.nama) + '" oninput="ubahTimeline(' + i + ', \'nama\', this.value)"></div>'
                                                                                : '') +
                                                                '<div><label class="field-label">Tanggal mulai</label><input type="date" class="input" value="' + escapeHtml(x.mulai) + '" onchange="ubahTimeline(' + i + ', \'mulai\', this.value)"></div>' +
                                                                '<div><label class="field-label">Tanggal selesai (opsional)</label><input type="date" class="input" value="' + escapeHtml(x.selesai) + '" onchange="ubahTimeline(' + i + ', \'selesai\', this.value)"></div>' +
                                                                '<div><button type="button" class="btn btn-ghost btn-sm" onclick="hapusTimeline(' + i + ')">Hapus</button></div>' +
                                                '</div>';
                                }).join('') +
                                '<div class="tl-aksi"><button type="button" class="btn btn-ghost" onclick="tambahTimeline()">+ Tambah kegiatan</button>' +
                                '<button type="button" class="btn" id="btnSimpanTimeline" onclick="simpanFormTimeline()">Simpan timeline</button></div>');
}

function ubahTimeline(i, field, nilai) {
                window.timelineItems[i][field] = nilai;
                if (field === 'jenis') renderFormTimeline();
}

function tambahTimeline() {
                window.timelineItems = window.timelineItems || [];
                window.timelineItems.push({ jenis: '', nama: '', mulai: '', selesai: '' });
                renderFormTimeline();
}

function hapusTimeline(i) {
                window.timelineItems.splice(i, 1);
                renderFormTimeline();
}

function simpanFormTimeline() {
                const id = document.getElementById('panitiaKegiatan').value;
                const data = [];
                const item = window.timelineItems || [];
                for (let i = 0; i < item.length; i++) {
                                const x = item[i];
                                const no = ' pada baris ' + (i + 1) + '.';
                                const tahap = x.jenis === TL_LAINNYA ? String(x.nama || '').trim() : x.jenis;
                                if (!x.jenis) { showToast('Pilih jenis kegiatan' + no); return; }
                                if (!tahap) { showToast('Ketik nama kegiatan' + no); return; }
                                if (!x.mulai) { showToast('Isi tanggal mulai' + no); return; }
                                if (x.selesai && x.selesai < x.mulai) { showToast('Tanggal selesai lebih awal dari tanggal mulai' + no); return; }
                                data.push({ tahap: tahap, mulai: x.mulai, selesai: x.selesai });
                }
                const btn = document.getElementById('btnSimpanTimeline');
                btn.disabled = true;
                google.script.run
                                .withSuccessHandler(function(r) {
                                                btn.disabled = false;
                                                if (r.ok) { showToast('Timeline tersimpan.'); muatFormTimeline(id); return; }
                                                if (/sesi/i.test(r.msg || '')) { keluarPanitia(r.msg); return; }
                                                showToast(r.msg || 'Gagal menyimpan.');
                                })
                                .withFailureHandler(function() { btn.disabled = false; showToast('Gagal menyimpan. Coba lagi.'); })
                                .simpanTimeline(window.anggotaToken, id, data);
}
