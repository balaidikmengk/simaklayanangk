<script>
/* =====================================================
                        TEMA TERANG / GELAP
===================================================== */
function temaGelapAktif(mode) {
        return mode === 'gelap' || (mode === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
}
function terapkanTema(mode) {
        window.__temaMode = mode;
        document.documentElement.setAttribute('data-tema', temaGelapAktif(mode) ? 'gelap' : 'terang');
        document.querySelectorAll('[data-tema-pilih]').forEach(function(b) {
                b.setAttribute('aria-pressed', b.dataset.temaPilih === mode ? 'true' : 'false');
        });
}
function setTema(mode) {
        try { localStorage.setItem('simak_tema', mode); } catch (e) { /* penyimpanan diblokir: tema berlaku sampai halaman ditutup */ }
        terapkanTema(mode);
}
terapkanTema(window.__temaMode || 'auto');
if (window.matchMedia) {
        const mq = matchMedia('(prefers-color-scheme: dark)');
        const ikuti = function() { if ((window.__temaMode || 'auto') === 'auto') terapkanTema('auto'); };
        if (mq.addEventListener) mq.addEventListener('change', ikuti); else if (mq.addListener) mq.addListener(ikuti);
}

/* =====================================================
                        UTILITAS
===================================================== */
function escapeHtml(value) {
                return String(value == null ? '' : value)
                                .replace(/&/g, '&amp;')
                                .replace(/</g, '&lt;')
                                .replace(/>/g, '&gt;')
                                .replace(/"/g, '&quot;')
                                .replace(/'/g, '&#039;');
}

function ic(name) {
                return '<svg class="ic" aria-hidden="true"><use href="#i-' + name + '"/></svg>';
}

function safeUrl(url) {
                const u = String(url == null ? '' : url).trim();
                return /^https?:\/\//i.test(u) ? u : '';
}

function fmt(n) {
                return (Number(n) || 0).toLocaleString('id-ID');
}

function statusKey(value) {
                const s = String(value || '').trim().toLowerCase();
                if (s === 'sudah') return 'sudah';
                if (s === 'proses') return 'proses';
                return 'belum'; // termasuk salah ketik "belun"
}

function badgeStatus(value) {
                const key = statusKey(value);
                const map = {
                                sudah: ['check', 'Sudah'],
                                proses: ['clock', 'Proses'],
                                belum: ['circle', 'Belum']
                };
                return '<span class="badge badge-' + key + '">' + ic(map[key][0]) + map[key][1] + '</span>';
}

function certBadge(value) {
                return String(value || '').trim().toLowerCase() === 'ada'
                                ? '<span class="cert cert-ada">' + ic('award') + 'Ada</span>'
                                : '<span class="cert cert-tidak">' + ic('x-circle') + 'Tidak</span>';
}

function pageHead(title, desc) {
                return '<div class="page-head"><h1>' + title + '</h1>' +
                                (desc ? '<p>' + desc + '</p>' : '') + '</div>';
}

function skeleton(count, cls) {
                let html = '';
                for (let i = 0; i < count; i++) html += '<div class="skeleton ' + cls + '"></div>';
                return html;
}

function emptyState(title, text) {
                return '<div class="state"><strong>' + escapeHtml(title) + '</strong>' +
                                (text ? escapeHtml(text) : '') + '</div>';
}

function jamPasir(ukuran) {
                const u = ukuran || 40;
                return '<svg class="jp" viewBox="0 0 48 64" width="' + u + '" height="' + Math.round(u * 64 / 48) + '" aria-hidden="true">' +
                                '<g class="jp-rot">' +
                                '<path class="jp-pasir jp-atas" d="M13 12 H35 C35 20 28 26 24 32 C20 26 13 20 13 12 Z"/>' +
                                '<path class="jp-pasir jp-bawah" d="M24 32 C28 38 35 44 35 52 V57 H13 V52 C13 44 20 38 24 32 Z"/>' +
                                '<line class="jp-alir" x1="24" y1="31" x2="24" y2="55"/>' +
                                '<path class="jp-kaca" d="M12 6 V12 C12 20 20 26 24 32 C20 38 12 44 12 52 V58 M36 6 V12 C36 20 28 26 24 32 C28 38 36 44 36 52 V58 M7 5 H41 M7 59 H41"/>' +
                                '</g></svg>';
}

// Penanda memuat di dalam halaman: ikon jam pasir dan teks. Dipakai di tempat yang menunggu data dari server.
function memuat(teks) {
                return '<div class="loading-box" role="status" aria-live="polite">' + jamPasir(30) + '<span>' + escapeHtml(teks || 'Memuat data...') + '</span></div>';
}

function errorState(title, text) {
                return '<div class="state state-error"><strong>' + escapeHtml(title) + '</strong>' +
                                escapeHtml(text || 'Muat ulang halaman, atau coba lagi beberapa saat lagi.') + '</div>';
}

function render(html) {
                document.getElementById('content').innerHTML = html;
                window.scrollTo(0, 0);
}

function setHtml(id, html) {
                const el = document.getElementById(id);
                if (el) el.innerHTML = html;
}

function setText(id, text) {
                const el = document.getElementById(id);
                if (el) el.textContent = text;
}

let toastTimer = null;
function showToast(message) {
                const el = document.getElementById('toast');
                el.textContent = message;
                el.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(function() { el.classList.remove('show'); }, 3200);
}

function sortYearsDesc(list) {
                return list.sort(function(a, b) { return Number(b) - Number(a); });
}

function uniqueYears(data) {
                const set = {};
                (data || []).forEach(function(item) {
                                if (item.tahun) set[String(item.tahun).trim()] = true;
                });
                return sortYearsDesc(Object.keys(set));
}

                                                '<h2 class="panel-title">Pelaksanaan kegiatan</h2>' +

                                                '<div class="summary">' +
                                                                summaryItem('sudah', 'jumlahSudah', 'Sudah terlaksana') +
                                                                summaryItem('proses', 'jumlahProses', 'Sedang berjalan') +
                                                                summaryItem('belum', 'jumlahBelum', 'Belum terlaksana') +
                                                                summaryItem('sertifikat', 'jumlahBersertifikat', 'Bersertifikat') +
                                                '</div>' +
                                                '<div id="kegiatanTahunContainer" class="year-list">' + skeleton(3, 'sk-row') + '</div>' +
                                '</section>' +

                                '<section class="block">' +
                                                '<div class="block-head"><h2>Kegiatan terbaru</h2>' +
                                                                '<button type="button" class="btn-text" onclick="go(\'kegiatan\')">Lihat semua' + ic('chev-right') + '</button>' +
                                                '</div>' +
                                                '<div id="kegiatanContainer" class="event-grid">' + skeleton(3, 'sk-card') + '</div>' +

                                                                quickButton('arsipfoto', 'folder', 'Arsip &amp; Foto Kegiatan', 'Arsip, foto, dan laporan') +
                                                                quickButton('sertifikat', 'award', 'Sertifikat', 'Cari dan unduh sertifikat') +

                                '</section>'
                );
                loadDashboardData();
}

function metricButton(page, icon, id, label) {
                return '<button type="button" class="metric" onclick="go(\'' + page + '\')">' +
                                '<span class="metric-icon">' + ic(icon) + '</span>' +
                                '<span><span class="metric-num" id="' + id + '">-</span>' +

}

function summaryItem(kind, id, label) {
                return '<div class="summary-item"><span class="dot dot-' + kind + '"></span>' +
                                '<span class="summary-num" id="' + id + '">-</span>' +
                                '<span class="summary-label">' + label + '</span></div>';
}

function quickButton(page, icon, title, desc) {
                return '<button type="button" onclick="go(\'' + page + '\')">' + ic(icon) +
                                '<strong>' + title + '</strong><span>' + desc + '</span></button>';
}

function countWithLink(data) {
                return (data || []).filter(function(item) {
                                return String(item.drive_url || '').trim() !== '';
                }).length;
}

function loadDashboardData() {
                google.script.run
                                .withSuccessHandler(function(data) {
                                                const list = data || [];
                                                let sudah = 0, proses = 0, belum = 0, bersertifikat = 0;

                                                list.forEach(function(item) {
                                                                const key = statusKey(item.status_pelaksanaan);
                                                                if (key === 'sudah') sudah++;
                                                                else if (key === 'proses') proses++;
                                                                else belum++;
                                                                if (String(item.status_sertifikat || '').trim().toLowerCase() === 'ada') bersertifikat++;
                                                });

                                                setText('jumlahKegiatan', fmt(list.length));
                                                setText('jumlahSudah', fmt(sudah));
                                                setText('jumlahProses', fmt(proses));
                                                setText('jumlahBelum', fmt(belum));
                                                setText('jumlahBersertifikat', fmt(bersertifikat));

                                                renderKegiatanTerbaru(list);
                                                renderKegiatanBerdasarkanTahun(list);
                                })
                                .withFailureHandler(function(error) {
                                                console.error('Gagal memuat kegiatan:', error);
                                                setHtml('kegiatanContainer', errorState('Kegiatan belum bisa dimuat'));
                                                setHtml('kegiatanTahunContainer', errorState('Data tahun belum bisa dimuat'));
                                })
                                .getKegiatanPublik();

                google.script.run
                                .withSuccessHandler(function(data) { setText('jumlahDokumentasi', fmt(Number(data) || 0)); })
                                .withFailureHandler(function(error) { console.error('Gagal memuat statistik arsip, foto, dan laporan:', error); })
                                .getJumlahDokumentasi();
}

function renderKegiatanTerbaru(data) {
                const container = document.getElementById('kegiatanContainer');
                if (!container) return;

                if (!Array.isArray(data) || data.length === 0) {
                                container.className = '';
                                container.innerHTML = emptyState('Belum ada kegiatan publik');
                                return;
                }

                container.innerHTML = data.slice(0, 5).map(function(item) {
                                return '<article class="event">' +
                                                '<h3>' + escapeHtml(item.nama_kegiatan || '-') + '</h3>' +
                                                '<div class="event-meta">' +
                                                                '<div>' + ic('user') + '<span>' + escapeHtml(item.pic || '-') + '</span></div>' +
                                                                '<div class="date">' + ic('calendar') + '<span>' + escapeHtml(item.tanggal_pelaksanaan || '-') + '</span></div>' +
                                                                '<div>' + ic('pin') + '<span>' + escapeHtml(item.lokasi || '-') + '</span></div>' +
                                                '</div>' +
                                                '<div class="event-foot">' + badgeStatus(item.status_pelaksanaan) + '</div>' +
                                '</article>';
                }).join('');
}

function renderKegiatanBerdasarkanTahun(data) {
                const container = document.getElementById('kegiatanTahunContainer');
                if (!container) return;

                if (!data || data.length === 0) {
                                container.innerHTML = emptyState('Belum ada data kegiatan');
                                return;
                }

                const tahunData = {};
                data.forEach(function(item) {
                                const tahun = String(item.tahun || '').trim();
                                if (!tahun) return;
                                if (!tahunData[tahun]) tahunData[tahun] = { total: 0, sudah: 0, proses: 0, belum: 0 };
                                tahunData[tahun].total++;
                                tahunData[tahun][statusKey(item.status_pelaksanaan)]++;
                });

                const tahunList = sortYearsDesc(Object.keys(tahunData));
                if (tahunList.length === 0) {
                                container.innerHTML = emptyState('Belum ada data tahun kegiatan');
                                return;
                }

                const maxTotal = Math.max.apply(null, tahunList.map(function(t) { return tahunData[t].total; }));

                container.innerHTML = tahunList.map(function(tahun) {
                                const d = tahunData[tahun];
                                const width = Math.max(14, (d.total / maxTotal) * 100);
                                const label = d.sudah + ' sudah, ' + d.proses + ' proses, ' + d.belum + ' belum';
                                return '<div class="year-row">' +
                                                '<div class="year-label"><strong>' + escapeHtml(tahun) + '</strong><span>' + d.total + ' kegiatan</span></div>' +
                                                '<div class="year-track" role="img" aria-label="' + escapeHtml(label) + '">' +
                                                                '<div class="year-fill" style="width:' + width + '%">' +
                                                                                (d.sudah ? '<i class="seg seg-sudah" style="flex:' + d.sudah + '"></i>' : '') +
                                                                                (d.proses ? '<i class="seg seg-proses" style="flex:' + d.proses + '"></i>' : '') +
                                                                                (d.belum ? '<i class="seg seg-belum" style="flex:' + d.belum + '"></i>' : '') +
                                                                '</div>' +
                                                '</div>' +
                                                '<div class="year-counts">' +
                                                                '<span><i class="dot dot-sudah"></i><b>' + d.sudah + '</b> sudah</span>' +
                                                                '<span><i class="dot dot-proses"></i><b>' + d.proses + '</b> proses</span>' +
                                                                '<span><i class="dot dot-belum"></i><b>' + d.belum + '</b> belum</span>' +
                                                '</div>' +
                                                '<button type="button" class="btn btn-ghost btn-sm" data-tahun="' + escapeHtml(tahun) + '" ' +
                                                                'onclick="showKegiatan(this.dataset.tahun)">Lihat kegiatan</button>' +
                                '</div>';
                }).join('');
}

/* =====================================================
                        UNDUH REKAP: Excel (SheetJS, dimuat saat dibutuhkan) dan Cetak / Simpan PDF
===================================================== */
const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const NAMA_SITUS_UNDUH = 'SIMAK - Rekapitulasi data SMA dan SMK se-Kabupaten Gunungkidul';

function teksSel(el) {
                return el ? String(el.textContent || '').replace(/\s+/g, ' ').trim() : '';
}

// Angka berformat Indonesia (1.234 atau 12,5) dijadikan angka sungguhan, selain itu tetap teks.
// NPSN, tahun, dan kode tidak cocok pola ini sehingga tidak berubah.
function kenaliAngka(t) {
                const x = String(t == null ? '' : t).trim();
                if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(x) || /^-?\d{1,3}(,\d+)?$/.test(x)) {
                                return Number(x.replace(/\./g, '').replace(',', '.'));
                }
                return x;
}

function kumpulkanBlok(acc) {
                const body = acc.querySelector('.acc-body');
                const judul = teksSel(acc.querySelector('.acc-text strong'));
                const ringkasan = [];
                const tabel = [];

                body.querySelectorAll('.tile').forEach(function(t) {
                                ringkasan.push([teksSel(t.querySelector('.tile-label')), kenaliAngka(teksSel(t.querySelector('.tile-value')))]);
                                t.querySelectorAll('p').forEach(function(p) {
                                                ringkasan.push(['                        ' + teksSel(p.querySelector('span')), kenaliAngka(teksSel(p.querySelector('b')))]);
                                });
                                ringkasan.push([]);
                });

                body.querySelectorAll('table').forEach(function(tb, i) {
                                let nama = '';
                                let prev = (tb.closest('.table-wrap') || tb).previousElementSibling;
                                while (prev && !nama) {
                                                if (prev.classList.contains('sub-title')) nama = teksSel(prev);
                                                prev = prev.previousElementSibling;
                                }
                                const baris = [];
                                tb.querySelectorAll('tr').forEach(function(tr) {
                                                const row = [];
                                                const header = tr.parentElement && tr.parentElement.tagName === 'THEAD';
                                                tr.querySelectorAll('th, td').forEach(function(c) {
                                                                row.push(header ? teksSel(c) : kenaliAngka(teksSel(c)));
                                                                const span = parseInt(c.getAttribute('colspan') || '1', 10);
                                                                for (let k = 1; k < span; k++) row.push('');
                                                });
                                                if (row.length) baris.push(row);
                                });
                                if (baris.length) tabel.push({ nama: nama || ('Tabel ' + (i + 1)), baris: baris });
                });

                return { judul: judul, ringkasan: ringkasan, tabel: tabel };
}

function slugFile(t) {
                return String(t || 'rekap').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'rekap';
}

function namaFileUnduh(judul) {
                const d = new Date();
                const p = function(n) { return (n < 10 ? '0' : '') + n; };
                return 'SIMAK_' + slugFile(judul) + '_' + d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function lebarKolom(aoa) {
                const w = [];
                aoa.forEach(function(r) {
                                r.forEach(function(v, i) {
                                                const len = String(v == null ? '' : v).length;
                                                w[i] = Math.max(w[i] || 8, Math.min(len + 2, 60));
                                });
                });
                return w.map(function(x) { return { wch: x }; });
}

function namaSheetUnik(nama, dipakai, cadangan) {
                let dasar = String(nama || cadangan).replace(/[\[\]:*?\/\\]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 28) || cadangan;
                let hasil = dasar;
                let n = 2;
                while (dipakai[hasil.toLowerCase()]) { hasil = dasar.slice(0, 26) + ' ' + n; n++; }
                dipakai[hasil.toLowerCase()] = true;
                return hasil;
}

function muatXlsx(onReady, onError) {
                if (window.XLSX) { onReady(); return; }
                const script = document.createElement('script');
                script.src = XLSX_URL;
                script.onload = onReady;
                script.onerror = onError;
                document.head.appendChild(script);
}

function tanggalIndonesia() {
                return new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
}

function unduhExcel(idAcc) {
                const acc = document.getElementById(idAcc);
                if (!acc) return;
                const blok = kumpulkanBlok(acc);
                if (!blok.ringkasan.length && !blok.tabel.length) {
                                showToast('Belum ada data untuk diunduh.');
                                return;
                }
                const namaFile = namaFileUnduh(blok.judul);

                muatXlsx(function() {
                                const wb = XLSX.utils.book_new();
                                const dipakai = {};
                                function tambah(aoa, nama, cadangan) {
                                                const ws = XLSX.utils.aoa_to_sheet(aoa);
                                                ws['!cols'] = lebarKolom(aoa);
                                                XLSX.utils.book_append_sheet(wb, ws, namaSheetUnik(nama, dipakai, cadangan));
                                }
                                if (blok.ringkasan.length) tambah(blok.ringkasan, 'Ringkasan', 'Ringkasan');
                                blok.tabel.forEach(function(t, i) { tambah(t.baris, t.nama, 'Tabel ' + (i + 1)); });
                                tambah([
                                                [NAMA_SITUS_UNDUH],
                                                ['Bagian', blok.judul],
                                                ['Diunduh', tanggalIndonesia()]
                                ], 'Info', 'Info');
                                XLSX.writeFile(wb, namaFile + '.xlsx');
                }, function() {
                                showToast('Pustaka Excel gagal dimuat, data diunduh sebagai CSV.');
                                unduhCsv(blok, namaFile);
                });
}

function bangunCsv(blok) {
                function sel(v) {
                                const t = typeof v === 'number' ? String(v).replace('.', ',') : String(v == null ? '' : v);
                                return /[";\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
                }
                function baris(aoa) { return aoa.map(function(r) { return r.map(sel).join(';'); }).join('\r\n'); }
                const bagian = [];
                if (blok.ringkasan.length) bagian.push(baris(blok.ringkasan));
                blok.tabel.forEach(function(t) { bagian.push(sel(t.nama) + '\r\n' + baris(t.baris)); });
                bagian.push(baris([[NAMA_SITUS_UNDUH], ['Bagian', blok.judul], ['Diunduh', tanggalIndonesia()]]));
                return bagian.join('\r\n\r\n');
}

function unduhCsv(blok, namaFile) {
                const blob = new Blob(['\uFEFF' + bangunCsv(blok)], { type: 'text/csv;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = namaFile + '.csv';
                document.body.appendChild(a);
                a.click();
                setTimeout(function() { URL.revokeObjectURL(url); a.remove(); }, 1000);
}

function unduhPesertaDidikPerSekolah() {
                showToast('Menyiapkan rekap per sekolah...');
                pastikanDataSekolah(function() {

                                                })
                                                .getRekapPesertaDidikPerSekolah();

}

function susunTabelPesertaDidikPerSekolah(data) {
                const tingkat = (data && data.tingkat) || [];
                // Urutan sekolah mengikuti Daftar Sekolah di menu Sekolah.
                const sekolah = urutkanSesuaiDaftarSekolah((data && data.sekolah) || []);
                const jumlahKolomAngka = (tingkat.length + 1) * 3;

                // Dua baris judul: kelompok kelas di atas, Laki-laki / Perempuan / Jumlah di bawah.
                const kepala1 = ['No', 'Nama Sekolah', 'Jenjang', 'Status'];
                const kepala2 = ['', '', '', ''];
                const gabung = [];
                for (let c = 0; c < 4; c++) gabung.push({ s: { r: 0, c: c }, e: { r: 1, c: c } });
                tingkat.concat(['__total']).forEach(function(t, i) {
                                const awal = 4 + i * 3;
                                kepala1.push(t === '__total' ? 'Total' : 'Kelas ' + t, '', '');
                                kepala2.push('Laki-laki', 'Perempuan', 'Jumlah');
                                gabung.push({ s: { r: 0, c: awal }, e: { r: 0, c: awal + 2 } });
                });

                const baris = [kepala1, kepala2];
                const nol = function() { return new Array(jumlahKolomAngka).fill(0); };
                const tambah = function(acc, nilai) { nilai.forEach(function(v, i) { acc[i] += v; }); };

                const semua = nol();
                const perJenjang = {};
                const perKelompok = {};
                const urutJenjang = [];
                const urutStatus = {};

                sekolah.forEach(function(s, i) {
                                const nilai = [];
                                tingkat.forEach(function(t) {
                                                const x = (s.per_tingkat && s.per_tingkat[t]) || { l: 0, p: 0, j: 0 };
                                                nilai.push(x.l, x.p, x.j);
                                });
                                const tot = s.total || { l: 0, p: 0, j: 0 };
                                nilai.push(tot.l, tot.p, tot.j);

                                baris.push([i + 1, s.nama, s.jenjang, s.status].concat(nilai));

                                tambah(semua, nilai);
                                const kj = s.jenjang || '-';
                                const kk = kj + '|' + (s.status || '-');
                                if (!perJenjang[kj]) { perJenjang[kj] = { nilai: nol(), n: 0 }; urutJenjang.push(kj); urutStatus[kj] = []; }
                                if (!perKelompok[kk]) { perKelompok[kk] = { nilai: nol(), n: 0 }; urutStatus[kj].push(s.status || '-'); }
                                tambah(perJenjang[kj].nilai, nilai); perJenjang[kj].n++;
                                tambah(perKelompok[kk].nilai, nilai); perKelompok[kk].n++;
                });

                // Baris total: per jenjang dan status, per jenjang, lalu total keseluruhan.
                baris.push([]);
                urutJenjang.forEach(function(kj) {
                                urutStatus[kj].forEach(function(st) {
                                                const g = perKelompok[kj + '|' + st];
                                                baris.push(['', 'Total ' + kj + ' ' + st, g.n + ' sekolah', ''].concat(g.nilai));
                                });
                                baris.push(['', 'Total ' + kj, perJenjang[kj].n + ' sekolah', ''].concat(perJenjang[kj].nilai));
                });
                baris.push(['', 'TOTAL KESELURUHAN', sekolah.length + ' sekolah', ''].concat(semua));

                return { baris: baris, gabung: gabung };
}

function buatExcelPesertaDidikPerSekolah(data) {
                if (!data || !data.sekolah || data.sekolah.length === 0) {
                                showToast('Belum ada data sekolah untuk diunduh.');
                                return;
                }
                const tabel = susunTabelPesertaDidikPerSekolah(data);
                const judul = 'Rekap Peserta Didik per Sekolah';
                const namaFile = namaFileUnduh(judul);
                const lebar = [{ wch: 5 }, { wch: 46 }, { wch: 12 }, { wch: 10 }];
                for (let i = 4; i < tabel.baris[0].length; i++) lebar.push({ wch: 12 });

                muatXlsx(function() {
                                const wb = XLSX.utils.book_new();
                                const ws = XLSX.utils.aoa_to_sheet(tabel.baris);
                                ws['!merges'] = tabel.gabung;
                                ws['!cols'] = lebar;
                                XLSX.utils.book_append_sheet(wb, ws, 'Per Sekolah');
                                XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
                                                [NAMA_SITUS_UNDUH],
                                                ['Bagian', judul],
                                                ['Diunduh', tanggalIndonesia()]
                                ]), 'Info');
                                XLSX.writeFile(wb, namaFile + '.xlsx');
                }, function() {
                                showToast('Pustaka Excel gagal dimuat, data diunduh sebagai CSV.');
                                unduhCsv({ judul: judul, ringkasan: [], tabel: [{ nama: 'Per Sekolah', baris: tabel.baris }] }, namaFile);
                });
}

function unduhDaftarSekolah() {
                if (window.dataSekolah && window.dataSekolah.length > 0) {
                                buatExcelDaftarSekolah(window.dataSekolah);
                                return;

                showToast('Menyiapkan daftar sekolah...');
                google.script.run
                                .withSuccessHandler(function(data) {

                                                buatExcelDaftarSekolah(window.dataSekolah);
                                })
                                .withFailureHandler(function(error) {
                                                console.error('Gagal menyiapkan daftar sekolah:', error);
                                                showToast('Daftar sekolah belum bisa disiapkan. Coba lagi sebentar.');
                                })
                                .getSekolahPublik();
}

function susunDaftarSekolah(data) {
                const urutJenjang = { SMA: 0, SMK: 1 };
                const urutStatus = { negeri: 0, swasta: 1 };
                const daftar = data.slice().sort(function(a, b) {
                                const ja = urutJenjang[String(a.jenjang || '').trim().toUpperCase()];
                                const jb = urutJenjang[String(b.jenjang || '').trim().toUpperCase()];
                                const sa = urutStatus[String(a.status || '').trim().toLowerCase()];
                                const sb = urutStatus[String(b.status || '').trim().toLowerCase()];
                                return ((ja === undefined ? 9 : ja) - (jb === undefined ? 9 : jb)) ||
                                                ((sa === undefined ? 9 : sa) - (sb === undefined ? 9 : sb)) ||
                                                String(a.nama_satuan_pendidikan || '').localeCompare(String(b.nama_satuan_pendidikan || ''), 'id');
                });

                const baris = [['No', 'Nama Satuan Pendidikan', 'NPSN', 'Jenjang', 'Status', 'Akreditasi', 'Alamat', 'Kapanewon']];
                const hitung = { SMA: { negeri: 0, swasta: 0 }, SMK: { negeri: 0, swasta: 0 } };
                daftar.forEach(function(s, i) {
                                const jenjang = String(s.jenjang || '').trim().toUpperCase();
                                const status = String(s.status || '').trim().toLowerCase();
                                if (hitung[jenjang] && hitung[jenjang][status] !== undefined) hitung[jenjang][status]++;
                                baris.push([
                                                i + 1,
                                                String(s.nama_satuan_pendidikan || '').trim(),
                                                String(s.npsn === null || s.npsn === undefined ? '' : s.npsn).trim(),
                                                String(s.jenjang || '').trim(),
                                                String(s.status || '').trim(),
                                                String(s.akreditasi || '').trim(),
                                                String(s.alamat || '').trim(),
                                                String(s.kapanewon || '').trim()
                                ]);
                });

                const rekap = [
                                ['Kelompok', 'Jumlah sekolah'],
                                ['SMA Negeri', hitung.SMA.negeri],
                                ['SMA Swasta', hitung.SMA.swasta],
                                ['Total SMA', hitung.SMA.negeri + hitung.SMA.swasta],
                                ['SMK Negeri', hitung.SMK.negeri],
                                ['SMK Swasta', hitung.SMK.swasta],
                                ['Total SMK', hitung.SMK.negeri + hitung.SMK.swasta],
                                ['TOTAL', hitung.SMA.negeri + hitung.SMA.swasta + hitung.SMK.negeri + hitung.SMK.swasta]
                ];
                return { baris: baris, rekap: rekap, jumlah: daftar.length };
}

function buatExcelDaftarSekolah(data) {
                if (!data || data.length === 0) {
                                showToast('Belum ada data sekolah untuk diunduh.');
                                return;
                }
                const t = susunDaftarSekolah(data);
                const namaFile = namaFileUnduh('Daftar Sekolah');
                const info = [
                                [NAMA_SITUS_UNDUH],
                                ['Bagian', 'Daftar Sekolah (Rekap Jumlah Sekolah)'],
                                ['Jumlah', t.jumlah + ' sekolah'],

                ];

                muatXlsx(function() {
                                const wb = XLSX.utils.book_new();
                                const ws = XLSX.utils.aoa_to_sheet(t.baris);
                                ws['!cols'] = [{ wch: 5 }, { wch: 46 }, { wch: 11 }, { wch: 9 }, { wch: 9 }, { wch: 11 }, { wch: 60 }, { wch: 22 }];
                                XLSX.utils.book_append_sheet(wb, ws, 'Daftar Sekolah');

                                XLSX.writeFile(wb, namaFile + '.xlsx');
                }, function() {
                                showToast('Pustaka Excel gagal dimuat, data diunduh sebagai CSV.');
                                unduhCsv({

                                                ringkasan: t.rekap,

}

function renderRekapTracer(data) {
        if (!data || !data.total || data.total.alumni === 0) {
                setHtml('rekapTracerContainer', emptyState('Belum ada data tracer study', 'Menunggu alumni mengisi data.'));
                return;
        }
        if (data.sekolah) data.sekolah = urutkanSesuaiDaftarSekolah(data.sekolah);
        const t = data.total;
        const kat = [['Melanjutkan kuliah', 'kuliah'], ['Bekerja', 'bekerja'], ['Wirausaha', 'wirausaha'], ['Belum bekerja', 'menganggur']];
        if (t.lainnya > 0) kat.push(['Lainnya', 'lainnya']);
        function persen(a, b) { return b > 0 ? (a / b * 100).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + '%' : '0%'; }
        function baris(r, label) {
                return '<tr><td class="strong">' + escapeHtml(label) + '</td><td class="c">' + fmt(r.alumni) + '</td><td class="c">' + fmt(r.mengisi) +
                        '</td><td class="c">' + persen(r.mengisi, r.alumni) + '</td>' +
                        kat.map(function(k) { return '<td class="c">' + fmt(r[k[1]]) + '</td>'; }).join('') + '</tr>';
        }
        function tabel(judul, kolom, rows, fn) {
                return '<h3 class="sub-title">' + judul + '</h3><div class="table-wrap"><table class="table table-wide"><thead><tr><th>' + kolom +
                        '</th><th class="c">Alumni terdata</th><th class="c">Sudah mengisi</th><th class="c">Persen</th>' +
                        kat.map(function(k) { return '<th class="c">' + k[0] + '</th>'; }).join('') + '</tr></thead><tbody>' +
                        rows.map(fn).join('') + '</tbody></table></div>';
        }
        setHtml('rekapTracerContainer',
                '<div class="tiles">' +
                        tile('Alumni terdata', fmt(t.alumni), [['Sudah mengisi', fmt(t.mengisi) + ' (' + persen(t.mengisi, t.alumni) + ')'], ['Belum mengisi', fmt(t.alumni - t.mengisi)]]) +
                        kat.map(function(k) { return tile(k[0], fmt(t[k[1]]), [['Dari yang sudah mengisi', persen(t[k[1]], t.mengisi)]]); }).join('') +
                '</div>' +
                (t.mengisi === 0 ? '<p class="result-info" style="margin:12px 0 0">Belum ada alumni yang mengisi status. Angka akan muncul otomatis begitu pengisian berjalan.</p>' : '') +
                tabel('Berdasarkan tahun lulus', 'Tahun lulus', data.tahun, function(r) { return baris(r, r.tahun); }) +
                '<h3 class="sub-title">Berdasarkan sekolah</h3>' +
                '<div class="toolbar"><div class="fixed"><label class="field-label" for="filterKapanewonTracer">Kapanewon</label>' +
                        '<select id="filterKapanewonTracer" class="select" onchange="filterTracerSekolah()">' + opsiKapanewon(data.sekolah.map(kapanewonSekolah)) + '</select></div></div>' +
                '<div class="table-wrap"><table class="table table-wide"><thead><tr><th>Sekolah</th><th>Kapanewon</th><th class="c">Alumni terdata</th><th class="c">Sudah mengisi</th><th class="c">Persen</th>' +
                        kat.map(function(k) { return '<th class="c">' + k[0] + '</th>'; }).join('') + '</tr></thead><tbody id="tracerSekolahBody"></tbody></table></div>' +
                '<p class="result-info" style="margin:8px 0 0">Persentase kategori dihitung dari alumni yang sudah mengisi. Yang ditampilkan hanya angka gabungan.</p>');

        window.filterTracerSekolah = function() {
                const body = document.getElementById('tracerSekolahBody');
                const sel = document.getElementById('filterKapanewonTracer');
                if (!body || !sel) return;
                const hasil = data.sekolah.filter(function(r) { return !sel.value || kapanewonSekolah(r) === sel.value; });
                body.innerHTML = hasil.length === 0
                        ? '<tr><td colspan="' + (kat.length + 5) + '" class="c" style="padding:28px;color:var(--muted)">Tidak ada sekolah yang cocok.</td></tr>'
                        : hasil.map(function(r) {
                                        return '<tr><td class="strong">' + escapeHtml(r.nama) + '</td><td>' + escapeHtml(kapanewonSekolah(r) || '-') + '</td><td class="c">' + fmt(r.alumni) +
                                                '</td><td class="c">' + fmt(r.mengisi) + '</td><td class="c">' + persen(r.mengisi, r.alumni) + '</td>' +
                                                kat.map(function(k) { return '<td class="c">' + fmt(r[k[1]]) + '</td>'; }).join('') + '</tr>';
                                }).join('');
        };
        window.filterTracerSekolah();
}

/* Urutan sekolah di rekap lulusan mengikuti urutan di menu Sekolah
            (urutan baris di sheet SEKOLAH). Sekolah yang tidak ditemukan di daftar
            Sekolah ditaruh di bagian bawah dengan urutan aslinya. */
function pastikanDataSekolah(lanjut) {
        if (window.dataSekolah && window.dataSekolah.length > 0) { lanjut(); return; }
        if (window.antreanDataSekolah) { window.antreanDataSekolah.push(lanjut); return; }
        window.antreanDataSekolah = [lanjut];
        const selesai = function() {
                const antre = window.antreanDataSekolah || [];
                window.antreanDataSekolah = null;
                antre.forEach(function(fn) { fn(); });
        };
        google.script.run
                .withSuccessHandler(function(data) { window.dataSekolah = data || []; selesai(); })
                .withFailureHandler(function(error) {
                        console.error('Gagal memuat urutan sekolah:', error);
                        selesai();
                })
                .getSekolahPublik();
}

function acuanSekolah(s) {
        const acuan = window.dataSekolah || [];
        if (acuan.length === 0) return null;
        if (!window.petaAcuanSekolah || window.petaAcuanSekolah.sumber !== acuan) {
                const peta = { sumber: acuan, id: {}, nama: {} };
                acuan.forEach(function(x, i) {
                        const id = String(x.id === null || x.id === undefined ? '' : x.id).trim();
                        if (id && peta.id[id] === undefined) peta.id[id] = i;
                        const nama = String(x.nama_satuan_pendidikan || '').toLowerCase().replace(/\s+/g, ' ').trim();
                        if (nama && peta.nama[nama] === undefined) peta.nama[nama] = i;
                });
                window.petaAcuanSekolah = peta;
        }
        const peta = window.petaAcuanSekolah;
        const rawId = s.id !== undefined && s.id !== null ? s.id : (s.sekolah_id !== undefined && s.sekolah_id !== null ? s.sekolah_id : '');
        const id = String(rawId).trim();
        if (id && peta.id[id] !== undefined) return peta.id[id];
        const nama = String(s.nama || '').toLowerCase().replace(/\s+/g, ' ').trim();
        if (nama && peta.nama[nama] !== undefined) return peta.nama[nama];
        return null;
}

function urutkanSesuaiDaftarSekolah(daftar) {
        const acuan = window.dataSekolah || [];
        if (acuan.length === 0) return daftar;
        return daftar
                .map(function(s, i) {
                        const pos = acuanSekolah(s);
                        return { s: s, p: pos === null ? acuan.length + i : pos };
                })
                .sort(function(x, y) { return x.p - y.p; })
                .map(function(x) { return x.s; });
}

/* Kapanewon sekolah di data alumni diambil dari sheet SEKOLAH (cocok lewat ID atau nama). */
function kapanewonSekolah(s) {
        if (s.kapanewon) return String(s.kapanewon).trim();
        const pos = acuanSekolah(s);
        return pos === null ? '' : String(window.dataSekolah[pos].kapanewon || '').trim();
}

function opsiKapanewon(daftarNama) {
        const unik = {};
        daftarNama.forEach(function(k) { const v = String(k || '').trim(); if (v) unik[v] = true; });
        return '<option value="">Semua kapanewon</option>' +
                Object.keys(unik).sort(function(x, y) { return x.localeCompare(y, 'id'); }).map(function(k) {
                        return '<option value="' + escapeHtml(k) + '">' + escapeHtml(k) + '</option>';
                }).join('');
}

/* Angka lulusan per sekolah per tahun. Nilai bisa berupa objek {laki_laki, perempuan, total}
   (dari getRekapLulusanLP) atau angka biasa (data lama, tanpa pemisahan laki-laki/perempuan). */
function lulusanAngka(v) {
        if (v === undefined || v === null || v === '') return null;
        if (typeof v === 'object') {
                return { l: Number(v.laki_laki) || 0, p: Number(v.perempuan) || 0, total: Number(v.total) || 0, lp: true };
        }
        return { l: 0, p: 0, total: Number(v) || 0, lp: false };
}

/* Gabungkan angka satu sekolah untuk tahun terpilih (kosong = semua tahun). */
function lulusanSekolahTahun(s, tahun, daftarTahun) {
        const hasil = { l: 0, p: 0, total: 0, lp: false, ada: false };
        (tahun ? [tahun] : daftarTahun).forEach(function(t) {
                const a = lulusanAngka((s.per_tahun || {})[t]);
                if (!a) return;
                hasil.ada = true;
                hasil.l += a.l; hasil.p += a.p; hasil.total += a.total;
                if (a.lp) hasil.lp = true;
        });
        return hasil;
}

function renderRekapLulusan(data) {
        if (!data || !data.sekolah || data.sekolah.length === 0) {
                setHtml('rekapLulusanContainer', emptyState('Belum ada data lulusan', 'Data lulusan diambil dari aplikasi Laporan Kelulusan. Data akan tampil setelah sekolah mengisinya.'));
                return;
        }
        data.sekolah = urutkanSesuaiDaftarSekolah(data.sekolah);
        data.tahun = (data.tahun || []).map(String);
        window.dataLulusan = data;
        const pt = data.per_tahun;
        const opsiTahun = data.tahun.slice().reverse().map(function(t, i) {
                return '<option value="' + escapeHtml(t) + '"' + (i === 0 ? ' selected' : '') + '>' + escapeHtml(t) + '</option>';
        }).join('');

        setHtml('rekapLulusanContainer',
                '<div class="toolbar">' +
                        '<div class="fixed"><label class="field-label" for="filterTahunLulusan">Tahun lulusan</label>' +
                                '<select id="filterTahunLulusan" class="select" onchange="renderTileLulusan()">' + opsiTahun + '</select></div>' +
                '</div>' +
                '<div class="tiles" id="lulusanTiles"></div>' +
                '<h3 class="sub-title">Jumlah lulusan per tahun</h3>' +
                '<div class="table-wrap"><table class="table"><thead><tr><th class="c">Tahun</th><th class="c">SMA</th><th class="c">SMK</th>' +
                        '<th class="c">Laki-laki</th><th class="c">Perempuan</th><th class="c">Total</th></tr></thead><tbody id="lulusanTahunBody"></tbody></table></div>' +
                '<h3 class="sub-title">Jumlah lulusan per sekolah</h3>' +
                '<div class="toolbar">' +
                        '<div class="grow"><label class="field-label" for="searchLulusan">Pencarian</label><div class="search-wrap">' + ic('search') +
                                '<input type="text" id="searchLulusan" class="input" autocomplete="off" placeholder="Cari nama sekolah" oninput="filterLulusan()"></div></div>' +
                        '<div class="fixed"><label class="field-label" for="filterJenjangLulusan">Jenjang</label>' +
                                '<select id="filterJenjangLulusan" class="select" onchange="filterLulusan()"><option value="">Semua jenjang</option><option value="SMA">SMA</option><option value="SMK">SMK</option></select></div>' +
                        '<div class="fixed"><label class="field-label" for="filterKapanewonLulusan">Kapanewon</label>' +
                                '<select id="filterKapanewonLulusan" class="select" onchange="filterLulusan()">' + opsiKapanewon(data.sekolah.map(kapanewonSekolah)) + '</select></div>' +
                '</div>' +
                '<div class="list-meta">' +
                        '<p class="result-info" id="lulusanInfo"></p>' +
                        '<div class="dl-bar">' +
                                '<button type="button" class="btn btn-ghost btn-sm" onclick="unduhExcelLulusan()">' + ic('download') + 'Unduh Excel</button>' +
                                '<button type="button" class="btn btn-ghost btn-sm" onclick="unduhPdfLulusan()">' + ic('download') + 'Unduh PDF</button>' +
                        '</div>' +
                '</div>' +
                '<div class="table-wrap" style="max-height:480px;overflow-y:auto"><table class="table table-wide"><thead><tr>' +
                        '<th class="c" rowspan="2">No</th><th rowspan="2">Nama sekolah</th><th rowspan="2">Jenjang</th><th rowspan="2">Status</th><th rowspan="2">Kapanewon</th><th rowspan="2">Jurusan</th>' +
                        data.tahun.map(function(t) { return '<th class="c" colspan="2" style="border-left:1px solid var(--line, #e2e8f0)">' + escapeHtml(t) + '</th>'; }).join('') +
                        '<th class="c" rowspan="2" style="border-left:1px solid var(--line, #e2e8f0)">Total</th></tr>' +
                        '<tr>' + data.tahun.map(function() { return '<th class="c" style="border-left:1px solid var(--line, #e2e8f0)">Laki-laki</th><th class="c">Perempuan</th>'; }).join('') +
                        '</tr></thead><tbody id="lulusanBody"></tbody></table></div>' +
                '<p class="result-info" style="margin:8px 0 0">Jumlah lulusan dihitung dari seluruh program keahlian atau jurusan di tiap sekolah.</p>');
        renderTileLulusan();
        filterLulusan();
}

/* Kotak ringkasan di atas: angka lulusan mengikuti tahun yang dipilih (hanya kotak ini yang terpengaruh filter tahun). */
function renderTileLulusan() {
        const box = document.getElementById('lulusanTiles');
        const d = window.dataLulusan;
        const sel = document.getElementById('filterTahunLulusan');
        if (!box || !d || !sel) return;
        const pt = d.per_tahun;
        const dipilih = pt.filter(function(r) { return String(r.tahun) === sel.value; })[0] || pt[pt.length - 1];
        const jumlahSemua = pt.reduce(function(a, r) { return a + r.total; }, 0);
        box.innerHTML =
                tile('Lulusan ' + dipilih.tahun, fmt(dipilih.total), [['SMA', fmt(dipilih.SMA)], ['SMK', fmt(dipilih.SMK)]]) +
                tile('Total ' + pt[0].tahun + ' - ' + pt[pt.length - 1].tahun, fmt(jumlahSemua), [['Sekolah terdata', fmt(d.sekolah.length)]]);
}

/* Daftar jurusan sekolah (dari Laporan Kelulusan) sebagai daftar bernomor. Pemisah tersembunyi dipakai agar hasil unduh Excel/cetak terbaca per jurusan. */
function jurusanLulusan(daftar) {
        const j = Array.isArray(daftar) ? daftar : [];
        if (j.length === 0) return '<span style="color:var(--muted)">-</span>';
        return '<ol style="margin:0;padding-left:20px">' + j.map(function(x, i) {
                return '<li>' + (i > 0 ? '<span style="display:none">; </span>' : '') + escapeHtml(x) + '</li>';
        }).join('') + '</ol>';
}

/* Daftar jurusan satu sekolah. Entri jurusan tanpa nama (atau bernama "-") yang tidak punya angka sama sekali dibuang,
   supaya tidak muncul baris "-" kosong di awal setiap sekolah dan baris Jumlah hanya muncul bila jurusan benar-benar lebih dari satu. */
function daftarJurusanLulusan(s) {
        const cadangan = [{ nama: '-', per_tahun: s.per_tahun, total: s.total }];
        if (!(Array.isArray(s.jurusan) && s.jurusan.length > 0 && typeof s.jurusan[0] === 'object')) return cadangan;
        // Angka yang benar-benar tampil (laki-laki/perempuan) dan lebih dari nol
        const adaAngka = function(j) {
                return Object.keys((j && j.per_tahun) || {}).some(function(t) {
                        const x = lulusanAngka(j.per_tahun[t]);
                        return x && x.lp && x.total > 0;
                });
        };
        const kosongNama = function(j) {
                const n = String(j && j.nama != null ? j.nama : '').replace(/[\s\-\u2010-\u2015\u2212_.]/g, '').toLowerCase();
                return n === '' || n === 'null' || n === 'undefined' || n === 'tanpajurusan' || n === 'nan';
        };
        const bersih = s.jurusan.filter(function(j) { return !(j == null || (kosongNama(j) && !adaAngka(j))); });
        return bersih.length > 0 ? bersih : cadangan;
}

function filterLulusan() {
        const body = document.getElementById('lulusanBody');
        const bodyTahun = document.getElementById('lulusanTahunBody');
        const d = window.dataLulusan;
        if (!body || !bodyTahun || !d) return;
        const kata = document.getElementById('searchLulusan').value.toLowerCase().trim();
        const jenjang = document.getElementById('filterJenjangLulusan').value;
        const kapanewon = document.getElementById('filterKapanewonLulusan').value;
        const tahun = '';
        const styleTotal = 'background:rgba(0,0,0,.05);font-weight:700';
        const angka = function(v, ada) { return ada ? fmt(v) : '-'; };

        /* Tabel per tahun (ikut filter tahun) */
        const barisTahun = d.per_tahun.filter(function(r) { return !tahun || String(r.tahun) === tahun; });
        let tSMA = 0, tSMK = 0, tL = 0, tP = 0, tTot = 0, tAdaLP = false;
        const htmlTahun = barisTahun.map(function(r) {
                const adaLP = typeof r.laki_laki === 'number';
                const l = adaLP ? r.laki_laki : 0, p = adaLP ? r.perempuan : 0;
                tSMA += r.SMA; tSMK += r.SMK; tTot += r.total;
                if (adaLP) { tAdaLP = true; tL += l; tP += p; }
                return '<tr><td class="c strong">' + escapeHtml(r.tahun) + '</td><td class="c">' + fmt(r.SMA) + '</td><td class="c">' + fmt(r.SMK) +
                        '</td><td class="c">' + angka(l, adaLP) + '</td><td class="c">' + angka(p, adaLP) +
                        '</td><td class="c"><b>' + fmt(r.total) + '</b></td></tr>';
        }).join('');
        bodyTahun.innerHTML = barisTahun.length === 0
                ? '<tr><td colspan="6" class="c" style="padding:28px;color:var(--muted)">Tidak ada data untuk tahun ini.</td></tr>'
                : htmlTahun + '<tr style="' + styleTotal + '"><td class="c">Jumlah total</td><td class="c">' + fmt(tSMA) + '</td><td class="c">' + fmt(tSMK) +
                        '</td><td class="c">' + angka(tL, tAdaLP) + '</td><td class="c">' + angka(tP, tAdaLP) + '</td><td class="c">' + fmt(tTot) + '</td></tr>';

        /* Tabel per sekolah (ikut filter tahun, pencarian, jenjang, kapanewon) */
        const hasil = lulusanTersaring();
        let sTot = 0;
        const sL = {}, sP = {};
        const sel = function(v, ada) { return ada ? fmt(v) : '-'; };
        const garis = 'border-left:1px solid var(--line, #e2e8f0)';
        // Satu baris tabel per jurusan: angka tiap jurusan berada di baris jurusannya sendiri.
        // Sel identitas sekolah diulang di baris berikutnya tetapi dibuat transparan (tetap ikut terbaca saat unduh Excel / cetak).
        const sembunyi = ' style="color:transparent;border-top-color:transparent"';
        const htmlSekolah = hasil.map(function(s, i) {
                const a = lulusanSekolahTahun(s, tahun, d.tahun);
                if (a.ada) sTot += a.total;
                d.tahun.forEach(function(t) {
                        const x = lulusanAngka((s.per_tahun || {})[t]);
                        if (x && x.lp) { sL[t] = (sL[t] || 0) + x.l; sP[t] = (sP[t] || 0) + x.p; }
                });
                const jur = daftarJurusanLulusan(s);
                const identitas = function(pertama) {
                        const sm = pertama ? '' : sembunyi;
                        return '<td class="num"' + sm + '>' + (i + 1) + '</td><td class="strong"' + sm + '>' + escapeHtml(s.nama) + '</td><td' + sm + '>' + escapeHtml(s.jenjang) +
                                '</td><td' + sm + '>' + escapeHtml(s.status || '-') + '</td><td' + sm + '>' + escapeHtml(kapanewonSekolah(s) || '-') + '</td>';
                };
                const barisJurusan = jur.map(function(j, idx) {
                        let totalJ = 0, adaJ = false;
                        const selJ = d.tahun.map(function(t) {
                                const x = lulusanAngka((j.per_tahun || {})[t]);
                                const ada = !!(x && x.lp);
                                if (ada) { totalJ += x.total; adaJ = true; }
                                return '<td class="c" style="' + garis + '">' + sel(ada ? x.l : 0, ada) + '</td><td class="c">' + sel(ada ? x.p : 0, ada) + '</td>';
                        }).join('');
                        return '<tr>' + identitas(idx === 0) + '<td>' + escapeHtml(j.nama) + '</td>' + selJ +
                                '<td class="c" style="' + garis + '"><b>' + sel(totalJ, adaJ) + '</b></td></tr>';
                }).join('');
                if (jur.length < 2) return barisJurusan;
                // Jumlah seluruh jurusan sekolah ini
                const selS = d.tahun.map(function(t) {
                        const x = lulusanAngka((s.per_tahun || {})[t]);
                        const ada = !!(x && x.lp);
                        return '<td class="c" style="' + garis + '">' + sel(ada ? x.l : 0, ada) + '</td><td class="c">' + sel(ada ? x.p : 0, ada) + '</td>';
                }).join('');
                return barisJurusan + '<tr style="background:rgba(0,0,0,.035);font-weight:700">' + identitas(false) + '<td><b>Jumlah</b></td>' + selS +
                        '<td class="c" style="' + garis + '"><b>' + sel(a.total, a.ada) + '</b></td></tr>';
        }).join('');
        body.innerHTML = hasil.length === 0
                ? '<tr><td colspan="' + (d.tahun.length * 2 + 7) + '" class="c" style="padding:28px;color:var(--muted)">Tidak ada sekolah yang cocok.</td></tr>'
                : htmlSekolah + '<tr style="' + styleTotal + '"><td colspan="6" class="c">Jumlah total</td>' +
                        d.tahun.map(function(t) {
                                return '<td class="c" style="border-left:1px solid var(--line, #e2e8f0)">' + fmt(sL[t] || 0) + '</td><td class="c">' + fmt(sP[t] || 0) + '</td>';
                        }).join('') +
                        '<td class="c" style="border-left:1px solid var(--line, #e2e8f0)">' + fmt(sTot) + '</td></tr>';
        document.getElementById('lulusanInfo').textContent = 'Menampilkan ' + hasil.length + ' dari ' + d.sekolah.length + ' sekolah';
}

/* =====================================================
                        UNDUH TABEL "JUMLAH LULUSAN PER SEKOLAH" (Excel dan PDF)
                        Disusun langsung dari data (bukan dari tampilan layar) agar rapi:
                        nama sekolah tampil sekali per sekolah, tanpa teks tersembunyi.
===================================================== */
function lulusanTersaring() {
        const d = window.dataLulusan;
        if (!d) return [];
        const nilai = function(id) { const el = document.getElementById(id); return el ? el.value : ''; };
        const kata = nilai('searchLulusan').toLowerCase().trim();
        const jenjang = nilai('filterJenjangLulusan');
        const kapanewon = nilai('filterKapanewonLulusan');
        return d.sekolah.filter(function(s) {
                return s.nama.toLowerCase().indexOf(kata) > -1 && (!jenjang || s.jenjang === jenjang) &&
                        (!kapanewon || kapanewonSekolah(s) === kapanewon);
        });
}

function teksFilterLulusan() {
        const nilai = function(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
        const p = [];
        if (nilai('searchLulusan')) p.push('Pencarian "' + nilai('searchLulusan') + '"');
        if (nilai('filterJenjangLulusan')) p.push('Jenjang ' + nilai('filterJenjangLulusan'));
        if (nilai('filterKapanewonLulusan')) p.push('Kapanewon ' + nilai('filterKapanewonLulusan'));
        return p.length ? p.join(', ') : 'Semua sekolah';
}

/* Susun data per sekolah: tiap sekolah punya beberapa baris jurusan, lalu baris "Jumlah" bila jurusannya lebih dari satu. */
function susunTabelLulusan() {
        const d = window.dataLulusan;
        const daftar = lulusanTersaring();
        const tahun = d.tahun;
        const angkaTahun = function(sumber) {
                const out = [];
                let total = 0, ada = false;
                tahun.forEach(function(t) {
                        const x = lulusanAngka((sumber.per_tahun || {})[t]);
                        const lp = !!(x && x.lp);
                        if (lp) { total += x.total; ada = true; }
                        out.push(lp ? x.l : '-', lp ? x.p : '-');
                });
                return { angka: out, total: ada ? total : '-' };
        };
        let sTot = 0;
        const sL = {}, sP = {};
        const sekolah = daftar.map(function(s, i) {
                const a = lulusanSekolahTahun(s, '', tahun);
                if (a.ada) sTot += a.total;
                tahun.forEach(function(t) {
                        const x = lulusanAngka((s.per_tahun || {})[t]);
                        if (x && x.lp) { sL[t] = (sL[t] || 0) + x.l; sP[t] = (sP[t] || 0) + x.p; }
                });
                const jur = daftarJurusanLulusan(s);
                const baris = jur.map(function(j) {
                        const h = angkaTahun(j);
                        return { jumlah: false, jurusan: j.nama, angka: h.angka, total: h.total };
                });
                if (jur.length >= 2) {
                        const h = angkaTahun(s);
                        baris.push({ jumlah: true, jurusan: 'Jumlah', angka: h.angka, total: a.ada ? a.total : '-' });
                }
                return { identitas: [i + 1, s.nama, s.jenjang || '-', s.status || '-', kapanewonSekolah(s) || '-'], baris: baris };
        });
        const angkaTotal = [];
        tahun.forEach(function(t) { angkaTotal.push(sL[t] || 0, sP[t] || 0); });
        return { tahun: tahun, sekolah: sekolah, angkaTotal: angkaTotal, total: sTot, jumlahSekolah: daftar.length };
}

function siapUnduhLulusan() {
        if (!window.dataLulusan) { showToast('Data lulusan belum siap, coba lagi sebentar.'); return null; }
        const t = susunTabelLulusan();
        if (t.jumlahSekolah === 0) { showToast('Tidak ada sekolah yang cocok untuk diunduh.'); return null; }
        const filter = teksFilterLulusan();
        t.filter = filter;
        t.info = filter + ' | ' + t.jumlahSekolah + ' dari ' + window.dataLulusan.sekolah.length + ' sekolah';
        t.nama = namaFileUnduh('Jumlah Lulusan per Sekolah' + (filter === 'Semua sekolah' ? '' : ' ' + filter));
        return t;
}

function unduhExcelLulusan() {
        const t = siapUnduhLulusan();
        if (!t) return;
        const nTahun = t.tahun.length;
        const aoa = [], merges = [];

        aoa.push(['Jumlah Lulusan per Sekolah']);
        aoa.push([NAMA_SITUS_UNDUH]);
        aoa.push([t.info + ' | Diunduh ' + tanggalIndonesia()]);
        aoa.push([]);

        const h1 = ['No', 'Nama sekolah', 'Jenjang', 'Status', 'Kapanewon', 'Jurusan'];
        const h2 = ['', '', '', '', '', ''];
        t.tahun.forEach(function(y) { h1.push(String(y), ''); h2.push('Laki-laki', 'Perempuan'); });
        h1.push('Total'); h2.push('');
        const r0 = aoa.length;
        aoa.push(h1);
        aoa.push(h2);
        for (let c = 0; c < 6; c++) merges.push({ s: { r: r0, c: c }, e: { r: r0 + 1, c: c } });
        for (let i = 0; i < nTahun; i++) merges.push({ s: { r: r0, c: 6 + i * 2 }, e: { r: r0, c: 7 + i * 2 } });
        merges.push({ s: { r: r0, c: 6 + nTahun * 2 }, e: { r: r0 + 1, c: 6 + nTahun * 2 } });

        t.sekolah.forEach(function(s) {
                s.baris.forEach(function(b, k) {
                        const ident = k === 0 ? s.identitas : ['', '', '', '', ''];
                        aoa.push(ident.concat([b.jurusan], b.angka, [b.total]));
                });
        });
        const rTotal = aoa.length;
        aoa.push(['Jumlah total', '', '', '', '', ''].concat(t.angkaTotal, [t.total]));
        merges.push({ s: { r: rTotal, c: 0 }, e: { r: rTotal, c: 5 } });

        muatXlsx(function() {
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.aoa_to_sheet(aoa);
                const lebar = [{ wch: 5 }, { wch: 42 }, { wch: 9 }, { wch: 9 }, { wch: 18 }, { wch: 36 }];
                for (let i = 0; i < nTahun * 2; i++) lebar.push({ wch: 11 });
                lebar.push({ wch: 10 });
                ws['!cols'] = lebar;
                ws['!merges'] = merges;
                XLSX.utils.book_append_sheet(wb, ws, 'Jumlah Lulusan');
                XLSX.writeFile(wb, t.nama + '.xlsx');
        }, function() {
                showToast('Pustaka Excel gagal dimuat, data diunduh sebagai CSV.');
                unduhCsv({ judul: 'Jumlah Lulusan per Sekolah', ringkasan: [], tabel: [{ nama: 'Jumlah Lulusan per Sekolah', baris: aoa }] }, t.nama);
        });
}

function unduhPdfLulusan() {
        const t = siapUnduhLulusan();
        if (!t) return;
        showToast('Menyiapkan PDF...');
        muatPdf(function() {
                const nTahun = t.tahun.length;
                const doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: nTahun > 4 ? 'a3' : 'a4' });
                const margin = 30;
                const angka = function(v) { return typeof v === 'number' ? fmt(v) : v; };
                const tengah = { halign: 'center', valign: 'middle' };
                const bgJumlah = [233, 238, 243];

                doc.setFontSize(15);
                doc.setTextColor(20);
                doc.text('Jumlah Lulusan per Sekolah', margin, 36);
                doc.setFontSize(9);
                doc.setTextColor(90);
                doc.text(NAMA_SITUS_UNDUH + ' | Diunduh ' + tanggalIndonesia(), margin, 51);
                doc.text(t.info, margin, 64);

                const head1 = ['No', 'Nama sekolah', 'Jenjang', 'Status', 'Kapanewon', 'Jurusan'].map(function(x) {
                        return { content: x, rowSpan: 2, styles: tengah };
                });
                const head2 = [];
                t.tahun.forEach(function(y) {
                        head1.push({ content: String(y), colSpan: 2, styles: tengah });
                        head2.push({ content: 'Laki-laki', styles: tengah }, { content: 'Perempuan', styles: tengah });
                });
                head1.push({ content: 'Total', rowSpan: 2, styles: tengah });

                const body = [];
                t.sekolah.forEach(function(s) {
                        const n = s.baris.length;
                        s.baris.forEach(function(b, k) {
                                const row = [];
                                if (k === 0) {
                                        row.push(
                                                { content: String(s.identitas[0]), rowSpan: n, styles: { halign: 'center', valign: 'top' } },
                                                { content: s.identitas[1], rowSpan: n, styles: { fontStyle: 'bold', valign: 'top' } },
                                                { content: s.identitas[2], rowSpan: n, styles: { valign: 'top' } },
                                                { content: s.identitas[3], rowSpan: n, styles: { valign: 'top' } },
                                                { content: s.identitas[4], rowSpan: n, styles: { valign: 'top' } }
                                        );
                                }
                                const gaya = b.jumlah ? { fontStyle: 'bold', fillColor: bgJumlah } : {};
                                row.push({ content: b.jurusan, styles: gaya });
                                b.angka.forEach(function(v) { row.push({ content: angka(v), styles: Object.assign({ halign: 'center' }, gaya) }); });
                                row.push({ content: angka(b.total), styles: Object.assign({ halign: 'center', fontStyle: 'bold' }, b.jumlah ? { fillColor: bgJumlah } : {}) });
                                body.push(row);
                        });
                });
                const barisTotal = [{ content: 'Jumlah total', colSpan: 6, styles: { halign: 'center', fontStyle: 'bold', fillColor: bgJumlah } }];
                t.angkaTotal.forEach(function(v) { barisTotal.push({ content: angka(v), styles: { halign: 'center', fontStyle: 'bold', fillColor: bgJumlah } }); });
                barisTotal.push({ content: angka(t.total), styles: { halign: 'center', fontStyle: 'bold', fillColor: bgJumlah } });
                body.push(barisTotal);

                const kolom = { 0: { cellWidth: 24 }, 2: { cellWidth: 40 }, 3: { cellWidth: 44 } };
                for (let c = 6; c < 7 + nTahun * 2; c++) kolom[c] = { cellWidth: 38 };

                doc.autoTable({
                        startY: 78,
                        head: [head1, head2],
                        body: body,
                        theme: 'grid',
                        styles: { fontSize: nTahun > 3 ? 7.5 : 8, cellPadding: 3, overflow: 'linebreak', textColor: 30, lineColor: [200, 208, 216], lineWidth: 0.5, valign: 'middle' },
                        headStyles: { fillColor: [18, 59, 93], textColor: 255, fontStyle: 'bold' },
                        columnStyles: kolom,
                        margin: { left: margin, right: margin, bottom: 36 },
                        didDrawPage: function() {
                                doc.setFontSize(8);
                                doc.setTextColor(120);
                                doc.text('Halaman ' + doc.internal.getNumberOfPages(), margin, doc.internal.pageSize.getHeight() - 18);
                        }
                });
                doc.save(t.nama + '.pdf');
        }, function() {
                showToast('Pustaka PDF belum bisa dimuat. Periksa koneksi internet, atau gunakan Unduh Excel.');
        });
}

function filterRekapJurusanSMK() {
        const body = document.getElementById('rekapJurusanBody');
        const d = window.dataJurusanSMK;
        if (!body || !d) return;
        const kata = document.getElementById('searchRekapJurusan').value.toLowerCase().trim();
        const hasil = d.jurusan.filter(function(j) { return j.nama.toLowerCase().indexOf(kata) > -1; });
        body.innerHTML = hasil.length === 0
                ? '<tr><td colspan="3" class="c" style="padding:28px;color:var(--muted)">Tidak ada jurusan yang cocok.</td></tr>'
                : hasil.map(function(j, i) {
                                return '<tr><td class="num">' + (i + 1) + '</td><td class="strong">' + escapeHtml(j.nama) +
                                        '</td><td class="c"><b>' + fmt(j.jumlah_sekolah) + '</b></td></tr>';
                        }).join('');
        const info = document.getElementById('rekapJurusanInfo');
        if (info) info.textContent = 'Menampilkan ' + hasil.length + ' dari ' + d.jurusan.length + ' jurusan';
}

function filterJurusanSMK() {
        const body = document.getElementById('jurusanSMKBody');
        const d = window.dataJurusanSMK;
        if (!body || !d) return;
        const kata = document.getElementById('searchJurusanSMK').value.toLowerCase().trim();
        const kataJurusan = document.getElementById('filterNamaJurusanSMK').value.toLowerCase().trim();
        const status = document.getElementById('filterStatusJurusanSMK').value;
        const kapanewon = document.getElementById('filterKapanewonJurusanSMK').value;
        const cocokJurusan = function(j) { return kataJurusan !== '' && String(j).toLowerCase().indexOf(kataJurusan) > -1; };
        const hasil = d.sekolah.filter(function(s) {
                return String(s.nama || '').toLowerCase().indexOf(kata) > -1 &&
                        (!kataJurusan || s.jurusan.some(cocokJurusan)) &&
                        (!status || String(s.status || '').trim().toLowerCase() === status) &&
                        (!kapanewon || String(s.kapanewon || '').trim() === kapanewon);
        });
        body.innerHTML = hasil.length === 0
                ? '<tr><td colspan="6" class="c" style="padding:28px;color:var(--muted)">Tidak ada sekolah yang cocok. Coba kata kunci atau filter lain.</td></tr>'
                : hasil.map(function(s, i) {
                                const daftar = s.jurusan.length
                                        ? '<ol style="margin:0;padding-left:20px">' + s.jurusan.map(function(j) {
                                                return '<li' + (cocokJurusan(j) ? ' style="font-weight:700;color:var(--brand)"' : '') + '>' + escapeHtml(j) + '</li>';
                                        }).join('') + '</ol>'
                                        : '<span style="color:var(--muted)">Belum ada data</span>';
                                return '<tr><td class="num">' + (i + 1) + '</td><td class="strong">' + escapeHtml(s.nama || '-') +
                                        '</td><td>' + escapeHtml(s.status || '-') + '</td><td>' + escapeHtml(s.kapanewon || '-') +
                                        '</td><td class="c"><b>' + fmt(s.jumlah) + '</b></td><td>' + daftar + '</td></tr>';
                        }).join('');
        const info = document.getElementById('jurusanSMKInfo');
        if (info) info.textContent = kataJurusan
                ? 'Jurusan "' + document.getElementById('filterNamaJurusanSMK').value.trim() + '" ditemukan di ' + hasil.length + ' dari ' + d.sekolah.length + ' SMK'
                : 'Menampilkan ' + hasil.length + ' dari ' + d.sekolah.length + ' SMK';
}

        function sel(x) { return '<td class="c">' + fmt(x.l) + '</td><td class="c">' + fmt(x.p) + '</td><td class="c"><b>' + fmt(x.j) + '</b></td>'; }
        body.innerHTML = rows.map(function(s, i) {
                return '<tr><td class="num">' + (i + 1) + '</td><td class="strong">' + escapeHtml(s.nama) + '</td><td>' + escapeHtml(s.jenjang) +

        }).join('') + (tot ? '<tr class="total"><td colspan="4">Total</td>' + sel(tot.total) + sel(tot.mukim) + sel(tot.fullday) + '</tr>' : '');
}

/* Info "Data diperbarui per ..." (tanggal file terakhir diunggah di menu Update Database). */
function muatInfoPembaruan() {
        google.script.run
                .withSuccessHandler(function(r) {
                        if (!r || !r.ok || !r.info) return;
                        const info = r.info;
                        const peta = {
                                accordionSekolah: 'sekolah', accordionPesertaDidik: 'pd', accordionPTK: 'ptk', accordionATS: 'ats',
                                accordionMBG: 'mbg', accordionAdiwiyata: 'adiwiyata', accordionBoarding: 'boarding', accordionJurusanSMK: 'jurusan'
                        };
                        Object.keys(peta).forEach(function(id) {
                                const tgl = info[peta[id]];
                                const acc = document.getElementById(id);
                                if (!tgl || !acc) return;
                                const teks = acc.querySelector('.acc-text');
                                if (!teks || teks.querySelector('.acc-update')) return;
                                teks.insertAdjacentHTML('beforeend', '<span class="acc-update">Data diperbarui per ' + escapeHtml(tgl) + '</span>');
                        });
                        const awal = document.getElementById('accordionSekolah');
                        if (info.terbaru && awal && !document.getElementById('infoPembaruanTerbaru')) {
                                awal.insertAdjacentHTML('beforebegin', '<p class="update-terbaru" id="infoPembaruanTerbaru">Pembaruan data terakhir: <b>' + escapeHtml(info.terbaru) + '</b></p>');
                        }
                })
                .withFailureHandler(function(e) { console.warn('Info pembaruan data belum tersedia:', e); })
                .getInfoPembaruanData();
}

function barList(items, total, labelFn) {
                const max = Math.max.apply(null, items.map(function(i) { return i.jumlah; }));
                return items.map(function(item) {
                                const persen = total > 0 ? (item.jumlah / total) * 100 : 0;
                                return '<div class="bar-row">' +
                                                '<div class="bar-label">' + labelFn(item) + '</div>' +
                                                '<div class="bar-track"><span class="bar-fill" style="width:' + Math.max(2, (item.jumlah / max) * 100) + '%"></span></div>' +
                                                '<div class="bar-num">' + fmt(item.jumlah) + ' <span>(' + persen.toLocaleString('id-ID', { maximumFractionDigits: 1 }) + '%)</span></div>' +
                                '</div>';
                }).join('');
}

function filterMBG() {
                const body = document.getElementById('mbgBody');
                if (!body) return;
                const keyword = document.getElementById('searchMBG').value.toLowerCase().trim();
                const jenjang = document.getElementById('filterJenjangMBG').value;
                const status = document.getElementById('filterStatusMBG').value;
                const all = window.dataMBG || [];

                const hasil = all.filter(function(s) {
                                const teks = [s.nama, s.sppg].join(' ').toLowerCase();
                                return teks.indexOf(keyword) > -1 &&
                                                (!jenjang || s.jenjang === jenjang) &&
                                                (!status || s.status_mbg === status);
                });

                if (hasil.length === 0) {
                                body.innerHTML = '<tr><td colspan="6" class="c" style="padding:28px;color:var(--muted)">' +
                                                'Tidak ada sekolah yang cocok. Coba kata kunci atau filter lain.</td></tr>';
                } else {
                                body.innerHTML = hasil.map(function(s, index) {
                                                return '<tr>' +
                                                                '<td class="num">' + (index + 1) + '</td>' +
                                                                '<td class="strong">' + escapeHtml(s.nama || '-') + '</td>' +
                                                                '<td>' + escapeHtml(s.jenjang || '-') + '</td>' +
                                                                '<td>' + escapeHtml(s.status_sekolah || '-') + '</td>' +
                                                                '<td class="c">' + badgeStatus(s.status_mbg) + '</td>' +
                                                                '<td>' + escapeHtml(s.sppg || '-') + '</td>' +
                                                '</tr>';
                                }).join('');
                }

                const info = document.getElementById('mbgInfo');
                if (info) info.textContent = 'Menampilkan ' + hasil.length + ' dari ' + all.length + ' sekolah';
}

                setHtml('rekapAdiwiyataContainer',
                                '<div class="tiles">' +
