function renderFormNarasumber() {
                const item = window.narasumberItems || [];
                function kolom(i, kunci, label, nilai, opsi) {
                                const mask = (opsi && opsi.rahasia && item[i].mask[kunci]) || '';
                                return '<div><label class="field-label">' + label + (mask ? ' (tersimpan)' : '') + '</label>' +
                                                '<input type="text" class="input" autocomplete="off" maxlength="' + (opsi.maks || 150) + '"' +
                                                (opsi.mode ? ' inputmode="' + opsi.mode + '"' : '') +
                                                ' placeholder="' + escapeHtml(mask ? mask + ' - kosongkan jika tidak diubah' : (opsi.petunjuk || '')) + '"' +
                                                ' value="' + escapeHtml(nilai) + '" oninput="ubahNarasumber(' + i + ', \'' + kunci + '\', this.value)"></div>';
                }
                setHtml('narasumberForm',
                                '<p class="result-info" style="margin:0 0 12px">Data ini hanya untuk anggota dan tidak ditampilkan di halaman publik. ' +
                                'Nomor yang sudah tersimpan disamarkan; isi kolomnya hanya bila ingin mengubah.</p>' +
                                (item.length === 0 ? '<p class="result-info">Belum ada narasumber. Klik "Tambah narasumber" untuk memulai.</p>' : '') +
                                item.map(function(x, i) {
                                                return '<section class="panitia-role"><h3>Narasumber ' + (i + 1) + '</h3><div class="ns-grid">' +
                                                                kolom(i, 'nama', 'Nama', x.nama, { maks: 150 }) +
                                                                kolom(i, 'instansi', 'Instansi', x.instansi, { maks: 150 }) +
                                                                kolom(i, 'nik', 'NIK', x.nik, { maks: 16, mode: 'numeric', rahasia: true, petunjuk: '16 digit' }) +
                                                                kolom(i, 'nip', 'NIP', x.nip, { maks: 18, mode: 'numeric', rahasia: true, petunjuk: '18 digit, kosongkan bila bukan ASN' }) +
                                                                kolom(i, 'rek', 'Nomor rekening', x.rek, { maks: 25, mode: 'numeric', rahasia: true, petunjuk: 'Hanya angka' }) +
                                                                kolom(i, 'bank', 'Nama bank', x.bank, { maks: 60, petunjuk: 'Contoh: BRI' }) +
                                                                kolom(i, 'wa', 'Nomor WA', x.wa, { maks: 20, mode: 'tel', rahasia: true, petunjuk: 'Contoh: 08123456789' }) +
                                                                '<div style="display:flex;align-items:flex-end"><button type="button" class="btn btn-ghost btn-sm" onclick="hapusNarasumber(' + i + ')">Hapus narasumber</button></div>' +
                                                '</div></section>';
                                }).join('') +
                                '<div class="tl-aksi"><button type="button" class="btn btn-ghost" onclick="tambahNarasumber()">+ Tambah narasumber</button>' +
                                '<button type="button" class="btn" id="btnSimpanNarasumber" onclick="simpanFormNarasumber()">Simpan data narasumber</button></div>');
}

function ubahNarasumber(i, kunci, nilai) { window.narasumberItems[i][kunci] = nilai; }

function tambahNarasumber() {
                window.narasumberItems = window.narasumberItems || [];
                window.narasumberItems.push({ id: '', nama: '', instansi: '', bank: '', nik: '', nip: '', rek: '', wa: '', mask: {} });
                renderFormNarasumber();
}

function hapusNarasumber(i) {
                window.narasumberItems.splice(i, 1);
                renderFormNarasumber();
}

function simpanFormNarasumber() {
                const id = document.getElementById('panitiaKegiatan').value;
                const item = window.narasumberItems || [];
                for (let i = 0; i < item.length; i++) {
                                if (!String(item[i].nama || '').trim()) { showToast('Nama narasumber ' + (i + 1) + ' wajib diisi.'); return; }
                }
                const btn = document.getElementById('btnSimpanNarasumber');
                btn.disabled = true;
                google.script.run
                                .withSuccessHandler(function(r) {
                                                btn.disabled = false;
                                                if (r.ok) { showToast('Data narasumber tersimpan.'); muatFormNarasumber(id); return; }
                                                if (/sesi/i.test(r.msg || '')) { keluarPanitia(r.msg); return; }
                                                showToast(r.msg || 'Gagal menyimpan.');
                                })
                                .withFailureHandler(function() { btn.disabled = false; showToast('Gagal menyimpan. Coba lagi.'); })
                                .simpanNarasumber(window.anggotaToken, id, item.map(function(x) {
                                                return { id: x.id, nama: x.nama, instansi: x.instansi, bank: x.bank, nik: x.nik, nip: x.nip, rek: x.rek, wa: x.wa };
                                }));
}

function muatNarasumberDetail(id) {
                google.script.run
                                .withSuccessHandler(function(r) {
                                                const daftar = (r && r.narasumber) || [];
                                                setHtml('narasumberFakta', daftar.length === 0 ? '-' : daftar.map(function(n) {
                                                                return '<div class="anggota-detail"><b>' + escapeHtml(n.nama) + '</b>' + (n.instansi ? '<small>' + escapeHtml(n.instansi) + '</small>' : '') + '</div>';
                                                }).join(''));
                                })
                                .withFailureHandler(function(error) {
                                                console.error('Gagal memuat narasumber:', error);
                                                setHtml('narasumberFakta', '-');
                                })
                                .getNarasumberKegiatan(id);
}

function kunciTahap(t) { return String(t.tahap) + '||' + String(t.mulai); }

function muatTimelineDetail(id) {
                if (window.tlTimer) { clearInterval(window.tlTimer); window.tlTimer = null; }
                google.script.run
                                .withSuccessHandler(function(r) {
                                                if (!r || !r.tahap || r.tahap.length === 0) {
                                                                window.tlDetail = null;
                                                                setHtml('timelineDetail', emptyState('Timeline belum diatur', 'Jadwal akan tampil setelah diatur oleh panitia.'));
                                                                return;
                                                }
                                                window.tlDetail = { id: id, tahap: r.tahap, ceklist: {}, ceklistAktif: false, ceklistGagal: false, sibuk: false };
                                                renderTimelineDetail();
                                                ambilCeklist(id);
                                                // Sinkron otomatis: ceklist dari anggota lain muncul tanpa muat ulang halaman.
                                                window.tlTimer = setInterval(function() {
                                                                if (!document.getElementById('timelineDetail')) { clearInterval(window.tlTimer); window.tlTimer = null; return; }
                                                                if (document.hidden || !window.tlDetail || window.tlDetail.sibuk) return;
                                                                if (document.getElementById('ceklistPassword')) return;
                                                                ambilCeklist(id);
                                                }, 15000);
                                })
                                .withFailureHandler(function() { setHtml('timelineDetail', errorState('Timeline belum bisa dimuat')); })
                                .getTimelineKegiatan(id);
}

function ambilCeklist(id) {
                google.script.run
                                .withSuccessHandler(function(r) {
                                                const d = window.tlDetail;
                                                if (!d || d.id !== id) return;
                                                if (!r || !r.ok) { if (!d.ceklistAktif) { d.ceklistGagal = true; renderTimelineDetail(); } return; }
                                                d.ceklist = r.data || {};
                                                if (r.status_pelaksanaan) setStatusDetail(r.status_pelaksanaan);
                                                d.ceklistAktif = true;
                                                d.ceklistGagal = false;
                                                if (!d.sibuk && !document.getElementById('ceklistPassword')) renderTimelineDetail();
                                })
                                .withFailureHandler(function() {
                                                const d = window.tlDetail;
                                                if (d && d.id === id && !d.ceklistAktif) { d.ceklistGagal = true; renderTimelineDetail(); }
                                })
                                .getCeklistTimeline(id);
}

function renderTimelineDetail() {
                const d = window.tlDetail;
                if (!d || !document.getElementById('timelineDetail')) return;
                const total = d.tahap.length;
                const selesai = d.tahap.filter(function(t) { const c = d.ceklist[kunciTahap(t)]; return c && c.done; }).length;
                const persen = total > 0 ? Math.round(selesai / total * 100) : 0;
                let kepala = '';
                if (d.ceklistAktif) {
                                kepala = '<div class="tl-ringkas"><div><b>' + selesai + ' dari ' + total + ' tahap terlaksana</b> (' + persen + '%)</div>' +
                                                '<div class="tl-bar"><span style="width:' + persen + '%"></span></div>' +
                                                '<small>' + (window.anggotaToken
                                                                ? 'Centang tahap yang sudah terlaksana. Perubahan langsung terlihat oleh semua anggota.'
                                                                : 'Hanya anggota yang dapat mengubah ceklist. Klik kotak centang untuk masuk.') + '</small></div>';
                } else if (d.ceklistGagal) {
                                kepala = '<p class="result-info">Ceklist belum bisa dimuat. Pastikan fungsi getCeklistTimeline sudah ada di Apps Script.</p>';
                }
                const lama = (document.getElementById('ceklistLogin') || {}).innerHTML || '';
                setHtml('timelineDetail',
                                kepala + '<div id="ceklistLogin">' + lama + '</div>' +
                                '<div class="tl">' + d.tahap.map(function(t, i) {
                                                const c = d.ceklist[kunciTahap(t)];
                                                const done = !!(c && c.done);
                                                const judul = d.ceklistAktif
                                                                ? '<label class="tl-cek"><input type="checkbox"' + (done ? ' checked' : '') + ' onchange="ubahCeklist(' + i + ', this)"><b>' + escapeHtml(t.tahap) + '</b></label>'
                                                                : '<b>' + escapeHtml(t.tahap) + '</b>';
                                                return '<div class="tl-item' + (done ? ' tl-done' : '') + '">' + judul +
                                                                '<div>' + escapeHtml(rentangTanggal(t.mulai, t.selesai)) + '</div>' +
                                                                (done && c.waktu ? '<small class="tl-waktu">Terlaksana, dicentang ' + escapeHtml(c.waktu) + '</small>' : '') + '</div>';
                                }).join('') + '</div>');
}

// Status pelaksanaan kegiatan di bagian atas halaman mengikuti ceklist tahap Pelaksanaan.
function setStatusDetail(status) {
                const el = document.getElementById('statusKegiatan');
                if (el) el.innerHTML = badgeStatus(status);
                const d = window.tlDetail;
                const k = d && (window.dataInformasiKegiatan || []).filter(function(x) { return String(x.id) === String(d.id); })[0];
                if (k) k.status_pelaksanaan = status;
}

function ubahCeklist(i, el) {
                const d = window.tlDetail;
                if (!d) return;
                const baru = el.checked;
                if (!window.anggotaToken) { el.checked = !baru; tampilLoginCeklist(''); return; }
                const t = d.tahap[i];
                const k = kunciTahap(t);
                const sebelum = d.ceklist[k];
                d.ceklist[k] = { done: baru, waktu: '' };
                // Tampilan langsung: bila semua tahap Pelaksanaan sudah dicentang, status di atas menjadi Sudah.
                const pelaksanaan = d.tahap.filter(function(x) { return x.tahap === 'Pelaksanaan'; });
                if (baru && pelaksanaan.length > 0 && pelaksanaan.every(function(x) { const c = d.ceklist[kunciTahap(x)]; return c && c.done; })) setStatusDetail('Sudah');
                d.sibuk = true;
                renderTimelineDetail();
                function batal() {
                                if (sebelum) d.ceklist[k] = sebelum; else delete d.ceklist[k];
                                d.sibuk = false;
                                renderTimelineDetail();
                }
                google.script.run
                                .withSuccessHandler(function(r) {
                                                if (d !== window.tlDetail) return;
                                                if (r && r.ok) { d.ceklist = r.data || d.ceklist; if (r.status_pelaksanaan) setStatusDetail(r.status_pelaksanaan); d.sibuk = false; renderTimelineDetail(); return; }
                                                batal();
                                                if (/sesi|password|masuk/i.test((r && r.msg) || '')) { window.anggotaToken = null; renderTimelineDetail(); tampilLoginCeklist((r && r.msg) || 'Sesi habis. Masuk kembali.'); return; }
                                                showToast((r && r.msg) || 'Gagal menyimpan ceklist.');
                                })
                                .withFailureHandler(function() {
                                                if (d !== window.tlDetail) return;
                                                batal();
                                                showToast('Gagal menyimpan ceklist. Coba lagi.');
                                })
                                .setCeklistTimeline(window.anggotaToken, d.id, t.tahap, t.mulai, baru);
}

function tampilLoginCeklist(pesan) {
                setHtml('ceklistLogin',
                                '<div class="panel panel-pad" style="max-width:420px;margin:0 0 16px"><h3 class="panel-title">Masuk anggota</h3>' +
                                '<p class="panel-sub">Masukkan password untuk mengubah ceklist timeline.</p>' +
                                '<input type="password" id="ceklistPassword" class="input" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')loginCeklist()">' +
                                '<p id="ceklistPesan" class="result-info" style="color:#b3261e;min-height:20px;margin:8px 0">' + escapeHtml(pesan || '') + '</p>' +
                                '<button type="button" class="btn" onclick="loginCeklist()">Masuk</button> ' +
                                '<button type="button" class="btn btn-ghost" onclick="setHtml(\'ceklistLogin\', \'\')">Batal</button></div>');
                const inp = document.getElementById('ceklistPassword');
                if (inp) inp.focus();
}

function loginCeklist() {
                const pw = document.getElementById('ceklistPassword').value;
                if (!pw) { setText('ceklistPesan', 'Isi password terlebih dahulu.'); return; }
                setText('ceklistPesan', 'Memeriksa...');
                google.script.run
                                .withSuccessHandler(function(r) {
                                                if (!r.ok) { setText('ceklistPesan', r.msg || 'Password salah.'); return; }
                                                window.anggotaToken = r.token;
                                                setHtml('ceklistLogin', '');
                                                renderTimelineDetail();
                                                showToast('Berhasil masuk. Sekarang Anda dapat mengubah ceklist.');
                                })
                                .withFailureHandler(function() { setText('ceklistPesan', 'Gagal terhubung. Coba lagi.'); })
                                .masukAnggota(pw);
}

                                                                                                (a.jabatan || a.nip ? '<small>' + [a.jabatan ? escapeHtml(a.jabatan) : '', a.nip ? 'NIP ' + escapeHtml(a.nip) : ''].filter(Boolean).join(' &middot; ') + '</small>' : '') + '</div>';
                                                                }).join('') + '</div>' +

function showInformasi() {
                setActiveMenu('informasi');
                render(
                                pageHead('Informasi Kegiatan', 'Daftar kegiatan berdasarkan tahun pelaksanaan.') +

                                '</div></div>' +

                );

                google.script.run

                                                                const t = window.tahunInformasiPilihan;
                                                                if (sel && t && Array.prototype.some.call(sel.options, function(o) { return o.value === t; })) sel.value = t;
                                                })();
                                                filterInformasiTahun();
                                                muatPesertaKegiatan();
                                })

                                                setHtml('informasiTabelContainer', errorState('Data kegiatan belum bisa dimuat'));

/* Unduh PDF Informasi Kegiatan: kegiatan pada tahun yang sedang dipilih, kolom sama dengan tabel (tanpa tombol Detail). */
function pesertaTeksInformasi(id) {
                const list = (window.pesertaKegiatan || {})[String(id || '').trim()];
                if (!list || list.length === 0) return '-';
                const perPeran = {};
                list.forEach(function(p) { (perPeran[p.peran || ''] = perPeran[p.peran || ''] || []).push(p); });
                return Object.keys(perPeran).map(function(peran) {
                                const baris = perPeran[peran];
                                const total = baris.reduce(function(a, p) { return a + (Number(p.jumlah) || 0); }, 0);
                                return fmt(total) + ' peserta' + (peran ? ' sebagai ' + peran : '') + '\n' +
                                                baris.map(function(p) { return (p.jenjang ? p.jenjang + ' ' : '') + fmt(p.jumlah); }).join(' | ');
                }).join('\n');
}

function unduhPdfInformasi() {
                const sel = document.getElementById('filterTahunInformasi');
                const tahun = sel ? sel.value : '';
                const daftar = (window.dataInformasiKegiatan || []).filter(function(item) { return String(item.tahun) === String(tahun); });
                if (!tahun || daftar.length === 0) { showToast('Tidak ada kegiatan untuk diunduh.'); return; }
                if (!window.pesertaKegiatan) { showToast('Data peserta masih dimuat, coba lagi sebentar.'); return; }
                const namaStatus = { sudah: 'Sudah', proses: 'Proses', belum: 'Belum' };
                const baris = daftar.map(function(item, i) {
                                return [i + 1, String(item.nama_kegiatan || '-'), String(item.pic || '-'), String(item.angkas || '-'),
                                                String(item.tanggal_pelaksanaan || '-'), pesertaTeksInformasi(item.id),
                                                namaStatus[statusKey(item.status_pelaksanaan)],
                                                String(item.status_sertifikat || '').trim().toLowerCase() === 'ada' ? 'Ada' : 'Tidak'];
                });
                showToast('Menyiapkan PDF...');
                muatPdf(function() {
                                const doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
                                doc.setFontSize(16);
                                doc.text('Informasi Kegiatan Tahun ' + tahun, 40, 42);
                                doc.setFontSize(9);
                                doc.setTextColor(90);
                                doc.text(NAMA_SITUS_UNDUH + ' | Diunduh ' + tanggalIndonesia(), 40, 58);
                                doc.text(daftar.length + ' kegiatan', 40, 71);
                                doc.autoTable({
                                                startY: 86,
                                                head: [['No', 'Nama kegiatan', 'PIC', 'Angkas', 'Tanggal pelaksanaan', 'Peserta', 'Status', 'Sertifikat']],
                                                body: baris,
                                                theme: 'grid',
                                                styles: { fontSize: 8, cellPadding: 4, overflow: 'linebreak', textColor: 30, valign: 'top' },
                                                headStyles: { fillColor: [18, 59, 93], textColor: 255 },
                                                columnStyles: { 0: { cellWidth: 24, halign: 'center' }, 1: { cellWidth: 190 }, 2: { cellWidth: 90 }, 3: { cellWidth: 70 },
                                                                4: { cellWidth: 100 }, 5: { cellWidth: 170 }, 6: { cellWidth: 45, halign: 'center' }, 7: { cellWidth: 52, halign: 'center' } },
                                                margin: { left: 40, right: 40, bottom: 40 },
                                                didDrawPage: function() {
                                                                doc.setFontSize(8);
                                                                doc.setTextColor(120);
                                                                doc.text('Halaman ' + doc.internal.getNumberOfPages(), 40, doc.internal.pageSize.getHeight() - 20);
                                                }
                                });
                                doc.save(namaFileUnduh('Informasi Kegiatan ' + tahun) + '.pdf');
                }, function() {
                                showToast('Pustaka PDF belum bisa dimuat. Periksa koneksi internet, lalu coba lagi.');
                });
}

function isiFilterTahunInformasi(data) {
                const select = document.getElementById('filterTahunInformasi');
                if (!select) return;
                const tahunList = uniqueYears(data);
                if (tahunList.length === 0) {
                                select.innerHTML = '<option value="">Belum ada data tahun</option>';
                                return;
                }
                select.innerHTML = tahunList.map(function(t) {
                                return '<option value="' + escapeHtml(t) + '">' + escapeHtml(t) + '</option>';
                }).join('');
}

function filterInformasiTahun() {
                const select = document.getElementById('filterTahunInformasi');
                if (!select) return;
                window.tahunInformasiPilihan = select.value;
                const hasil = (window.dataInformasiKegiatan || []).filter(function(item) {
                                return String(item.tahun) === String(select.value);
                });
                renderTabelInformasi(hasil);
}

function renderTabelInformasi(data) {
                const container = document.getElementById('informasiTabelContainer');
                if (!container) return;

                if (!data || data.length === 0) {
                                container.innerHTML = emptyState('Belum ada kegiatan untuk tahun tersebut', 'Pilih tahun lain.');
                                return;
                }

                container.innerHTML =
                                '<p class="result-info">Menampilkan ' + data.length + ' kegiatan</p>' +

function renderLaporanKegiatan(data) {
                const container = document.getElementById('laporanKegiatanContainer');
                if (!container) return;

                // Kegiatan bernama sama (walau tahunnya berbeda) digabung menjadi satu baris dengan satu tautan Drive.
                const kelompok = {};
                const urutan = [];
                (data || []).forEach(function(item) {
                                const nama = String(item.nama_kegiatan || '').replace(/\s+/g, ' ').trim();
                                const kunci = nama.toLowerCase();
                                if (!kunci) return;
                                if (!kelompok[kunci]) { kelompok[kunci] = { nama: nama, items: [] }; urutan.push(kunci); }
                                kelompok[kunci].items.push(item);
                });

                if (urutan.length === 0) {
                                container.innerHTML = emptyState('Belum ada laporan kegiatan');
                                return;
                }

                const baris = urutan.map(function(k) {
                                const g = kelompok[k];
                                g.items.sort(function(a, b) { return Number(b.tahun) - Number(a.tahun); });
                                g.terbaru = g.items[0];
                                // Tautan yang dipakai: milik tahun terbaru yang sudah punya tautan.
                                const ada = g.items.filter(function(item) { return safeUrl(item.drive_url); })[0];
                                g.url = ada ? safeUrl(ada.drive_url) : '';
                                return g;
                });

                container.innerHTML =
                                '<p class="result-info">Menampilkan ' + baris.length + ' kegiatan</p>' +
                                '<div class="table-wrap"><table class="table"><thead><tr>' +
                                                '<th class="c">No</th><th>Nama kegiatan</th><th>PIC</th>' +
                                                '<th class="c">Laporan</th></tr></thead><tbody>' +
                                                baris.map(function(g, index) {
                                                                const aksi = g.url
                                                                                ? '<a class="btn btn-sm" href="' + escapeHtml(g.url) + '" target="_blank" rel="noopener noreferrer">Buka laporan' + ic('external') + '</a>'
                                                                                : '<span class="resource-na">Laporan belum tersedia</span>';
                                                                return '<tr>' +
                                                                                '<td class="num">' + (index + 1) + '</td>' +
                                                                                '<td class="strong">' + escapeHtml(g.nama) + '</td>' +
                                                                                '<td>' + escapeHtml(g.terbaru.pic || '-') + '</td>' +
                                                                                '<td class="c">' + aksi + '</td>' +
                                                                '</tr>';
                                                }).join('') +
                                '</tbody></table></div>';
}

function pbdDelta(a, b) {
        if (a === null || a === undefined || b === null || b === undefined) return '<span class="delta tetap">-</span>';
        const d = b - a;
        const cls = d > 0 ? 'naik' : (d < 0 ? 'turun' : 'tetap');
        const panah = d > 0 ? '&#9650; +' : (d < 0 ? '&#9660; &minus;' : '= ');
        const pct = a > 0 ? ' (' + (d > 0 ? '+' : (d < 0 ? '&minus;' : '')) + Math.abs(d / a * 100).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + '%)' : '';
        return '<span class="delta ' + cls + '">' + panah + fmt(Math.abs(d)) + pct + '</span>';
}

function pbdOpsiPeriode(terpilih) {
        return window.pbd.periode.map(function(p) {

/* Tombol cepat: periode akhir tetap, periode awal dipilih dari foto yang ada (terdekat sebelum atau sama dengan sasaran). */
function pbdCepat(jenis) {
        const elAwal = document.getElementById('pbdAwal'), elAkhir = document.getElementById('pbdAkhir');
        if (!elAwal || !elAkhir) return;
        const akhir = Number(elAkhir.value);
        const th = Math.floor(akhir / 10), tw = akhir % 10;
        let sasaran;
        if (jenis === 'tw') sasaran = tw === 1 ? (th - 1) * 10 + 4 : th * 10 + tw - 1;   // triwulan sebelumnya
        else if (jenis === 'tahun') sasaran = (th - 1) * 10 + tw;                         // triwulan yang sama tahun lalu
        else sasaran = th * 10 + 1;                                                        // awal tahun: Triwulan I tahun periode akhir
        const ada = window.pbd.periode.map(function(p) { return p.kunci; })
                .filter(function(k) { return k <= sasaran && k < akhir; })
                .sort(function(x, y) { return y - x; })[0];
        if (!ada) { showToast('Belum ada foto data untuk pembanding itu. Pilih periode awal secara manual.'); return; }
        elAwal.value = String(ada);
        pbdGanti();
}

function pbdGanti() {
        const elAwal = document.getElementById('pbdAwal'), elAkhir = document.getElementById('pbdAkhir');
        if (!elAwal || !elAkhir) return;
        const a = Number(elAwal.value), b = Number(elAkhir.value);
        if (a >= b) {
                window.pbd.seq++;
                window.pbd.data = null;
                setHtml('pbdIsi', emptyState('Periode awal harus lebih awal', 'Pilih periode awal yang lebih awal daripada periode akhir.'));
                return;
        }
        muatPerbandingan(a, b);
}

function muatPerbandingan(awal, akhir) {
        const seq = ++window.pbd.seq;
        setHtml('pbdIsi', skeleton(3, 'sk-row'));
        google.script.run
                .withSuccessHandler(function(r) {
                        if (seq !== window.pbd.seq) return;   // pilihan sudah berganti
                        if (!r || !r.ok) { setHtml('pbdIsi', errorState('Data pembanding belum bisa dimuat', (r && r.msg) || '')); return; }
                        window.pbd.data = r;
                        const ada = r.indikator.filter(function(i) { return i.kunci === window.pbd.indikator && i.tersedia; }).length;
                        if (!ada) { const p1 = r.indikator.filter(function(i) { return i.tersedia; })[0]; window.pbd.indikator = p1 ? p1.kunci : 'pd_total'; }
                        renderPerbandingan();
                })
                .withFailureHandler(function(e) {
                        if (seq !== window.pbd.seq) return;
                        console.error(e);
                        setHtml('pbdIsi', errorState('Data pembanding belum bisa dimuat', 'Periksa koneksi, lalu coba lagi.'));
                })
                .getPerbandinganData(awal, akhir);
}

/* Catatan tentang foto yang dipakai: data yang belum diperbarui di suatu periode, atau tidak berubah di antara dua periode. */
function pbdCatatanFoto(d) {
        const out = [];
        (d.status_sumber || []).forEach(function(x) {
                if (!x.lama || !x.baru) return;
                if (x.sama) { out.push(x.nama + ': tidak diperbarui di antara kedua periode (kedua sisi memakai foto ' + x.baru.label + '), jadi selisihnya 0.'); return; }
                if (!x.lama.segar) out.push(x.nama + ': belum diperbarui di ' + d.label_lama + ', dipakai foto terakhir sebelumnya (' + x.lama.label + ').');
                if (!x.baru.segar) out.push(x.nama + ': belum diperbarui di ' + d.label_baru + ', dipakai foto terakhir sebelumnya (' + x.baru.label + ').');
        });
        return out;
}

function pbdPilihIndikator(k) { window.pbd.indikator = k; renderPerbandingan(); }
function pbdUrut(v) { window.pbd.urut = v; renderPerbandingan(); }

function renderPerbandingan() {
        const d = window.pbd.data;
        if (!d) return;
        const t = d.grup.total;
        const ket = {}; d.indikator.forEach(function(i) { ket[i.kunci] = i; });
        const k = window.pbd.indikator;
        if (!ket[k] || !ket[k].tersedia) {
                setHtml('pbdIsi', emptyState('Belum ada data yang bisa dibandingkan', 'Salah satu periode belum punya foto untuk bagian ini. Pilih data atau periode lain.'));
                return;
        }
        const modeKec = ket[k].dimensi === 'kecamatan';
        const kartu = function(kunci, judul) {
                if (!ket[kunci] || !ket[kunci].tersedia) return '';
                const x = t[kunci];
                return tile(judul || ket[kunci].label, fmt(x.baru), [[d.singkat_lama, fmt(x.lama)], ['Selisih', pbdDelta(x.lama, x.baru)]]);
        };
        const belum = d.indikator.filter(function(i) { return !i.tersedia; }).map(function(i) { return i.label; });

        // Pilihan indikator, dikelompokkan per bagian.
        const bagian = []; d.indikator.forEach(function(i) { if (bagian.indexOf(i.bagian) < 0) bagian.push(i.bagian); });
        const opsi = bagian.map(function(b) {
                return '<optgroup label="' + escapeHtml(b) + '">' + d.indikator.filter(function(i) { return i.bagian === b; }).map(function(i) {
                        return '<option value="' + i.kunci + '"' + (i.kunci === k ? ' selected' : '') + (i.tersedia ? '' : ' disabled') + '>' +
                                escapeHtml(i.label) + (i.tersedia ? '' : ' (belum ada pembanding)') + '</option>';
                }).join('') + '</optgroup>';
        }).join('');

        // Grafik batang berpasangan: per jenjang dan status sekolah, atau (ATS) per jenjang terakhir.
        const barisGrafik = modeKec
                ? (d.ats_jenjang || []).map(function(g) { return [g.nama, g.nilai[k]]; })
                : PBD_GRUP.map(function(g) { return [g[1], d.grup[g[0]][k]]; });
        let maks = 0;
        barisGrafik.forEach(function(g) { maks = Math.max(maks, g[1].lama, g[1].baru); });
        const lebar = function(n) { return maks > 0 ? Math.max(1, n / maks * 100) : 1; };
        const grafik = barisGrafik.map(function(g) {
                const x = g[1];
                return '<div class="pbd-row"><div class="strong">' + escapeHtml(g[0]) + '</div><div class="pbd-bars">' +
                        '<div class="pbd-bar lama" style="width:' + lebar(x.lama) + '%"><span>' + fmt(x.lama) + '</span></div>' +
                        '<div class="pbd-bar baru" style="width:' + lebar(x.baru) + '%"><span>' + fmt(x.baru) + '</span></div></div>' +
                        '<div>' + pbdDelta(x.lama, x.baru) + '</div></div>';
        }).join('');

        // Tabel: per sekolah, atau (ATS) per kecamatan.
        const sumberBaris = modeKec ? (d.kecamatan || []) : d.sekolah;
        const baris = sumberBaris.map(function(s) {
                const n = s.nilai[k] || { lama: null, baru: null };
                return { nama: s.nama, jenjang: s.jenjang || '', status: s.status || '', _lama: n.lama, _baru: n.baru,
                         _d: (n.lama === null || n.baru === null) ? null : n.baru - n.lama };
        });
        const u = window.pbd.urut;
        const urutJenjang = { SMA: 0, SMK: 1 };
        baris.sort(function(a, b) {
                if (u === 'naik' || u === 'turun') {
                        if (a._d === null && b._d === null) return a.nama.localeCompare(b.nama, 'id');
                        if (a._d === null) return 1;
                        if (b._d === null) return -1;
                        return u === 'naik' ? (b._d - a._d) : (a._d - b._d);
                }
                if (modeKec) return a.nama.localeCompare(b.nama, 'id');
                return ((urutJenjang[a.jenjang] || 0) - (urutJenjang[b.jenjang] || 0)) || String(a.status).localeCompare(String(b.status)) || a.nama.localeCompare(b.nama, 'id');
        });
        const tb = baris.map(function(s, i) {
                const pct = (s._d !== null && s._lama > 0) ? (s._d / s._lama * 100).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + '%' : '-';
                return '<tr><td class="num">' + (i + 1) + '</td><td class="strong">' + escapeHtml(s.nama) + '</td>' +
                        (modeKec ? '' : '<td>' + escapeHtml(s.jenjang) + '</td><td>' + escapeHtml(s.status) + '</td>') +
                        '<td class="c">' + (s._lama === null ? '-' : fmt(s._lama)) + '</td><td class="c">' + (s._baru === null ? '-' : fmt(s._baru)) +
                        '</td><td class="c">' + pbdDelta(s._lama, s._baru) + '</td><td class="c">' + pct + '</td></tr>';
        }).join('');
        const tot = t[k];

        // Catatan sesuai jenis data.
        const sumber = ket[k].sumber;
        let catatan;
        if (modeKec) {
                catatan = '<p>Data ATS tidak terhubung ke sekolah, jadi dibandingkan per kecamatan dan per jenjang terakhir. Hanya baris berstatus aktif yang dihitung, sama seperti menu Serba Informasi.</p>';
        } else {
                catatan = '<p>Selisih dan total hanya menghitung ' + fmt(t.sekolah) + ' sekolah yang ada di kedua data, supaya sekolah baru atau yang belum terisi tidak memengaruhi selisih.' +
                        (d.hanya_baru ? ' ' + fmt(d.hanya_baru) + ' sekolah hanya ada di data terbaru.' : '') + (d.hanya_lama ? ' ' + fmt(d.hanya_lama) + ' sekolah hanya ada di data sebelumnya.' : '') + '</p>';
        }
        if (sumber === 'adw') catatan += '<p>Angka per sekolah adalah 1 bila sekolah masuk kategori tersebut dan 0 bila tidak, sehingga totalnya adalah jumlah sekolah.</p>';
        if (sumber === 'brd') {
                const tb2 = d.ta_boarding || {};
                catatan += '<p>Data boarding memakai tahun ajaran terbaru di masing-masing foto (periode awal ' + escapeHtml(tb2.lama || '-') + ', periode akhir ' + escapeHtml(tb2.baru || '-') + ').' +
                        (tb2.lama && tb2.baru && tb2.lama !== tb2.baru ? ' Karena tahun ajarannya berbeda, selisih menunjukkan perubahan antartahun ajaran.' : '') +
                        ' Sekolah yang tidak tercatat boarding dihitung 0.</p>';
        }
        if (sumber === 'ptk') catatan += '<p>PTK dihitung dengan aturan yang sama seperti Serba Informasi: berstatus aktif dan status tugas Induk.</p>';

        const kolomAwal = modeKec ? '<th>Kecamatan</th>' : '<th>Nama sekolah</th><th>Jenjang</th><th>Status</th>';
        const judulTabel = modeKec ? 'Per kecamatan: ' : 'Per sekolah: ';
        const judulGrafik = modeKec ? 'Perbandingan per jenjang terakhir' : 'Perbandingan per jenjang dan status';

        setHtml('pbdIsi',
                '<p class="result-info" style="margin:0 0 12px"><b>Periode awal:</b> ' + escapeHtml(d.label_lama) + ' &nbsp;|&nbsp; <b>Periode akhir:</b> ' + escapeHtml(d.label_baru) + '</p>' +
                '<div class="tiles">' + kartu('pd_total', 'Jumlah peserta didik') + kartu('pd_l') + kartu('pd_p') + kartu('pd_baru') + kartu('pdbk_total') +
                kartu('ptk_total', 'Jumlah PTK') + kartu('ats_total', 'Anak tidak sekolah (ATS)') + kartu('adw_sudah', 'Sekolah Adiwiyata') + kartu('brd_total', 'Peserta didik boarding') + '</div>' +

                '<h3 class="sub-title" style="margin:24px 0 8px">' + judulGrafik + '</h3>' +
                '<div class="toolbar"><div class="grow"><label class="field-label" for="pbdIndikator">Data yang dibandingkan</label>' +
                '<select id="pbdIndikator" class="select" onchange="pbdPilihIndikator(this.value)">' + opsi + '</select></div></div>' +
                '<div class="pbd-legenda"><span><i style="background:#b8c4d0"></i>' + escapeHtml(d.singkat_lama) + '</span><span><i style="background:var(--brand)"></i>' + escapeHtml(d.singkat_baru) + '</span></div>' +
                grafik +

                '<h3 class="sub-title" style="margin:28px 0 8px">' + judulTabel + escapeHtml(ket[k].label) + '</h3>' +
                '<div class="toolbar"><div class="fixed"><label class="field-label" for="pbdUrut">Urutkan</label>' +
                '<select id="pbdUrut" class="select" onchange="pbdUrut(this.value)">' +
                '<option value="nama"' + (u === 'nama' ? ' selected' : '') + '>' + (modeKec ? 'Nama kecamatan' : 'Jenjang dan nama sekolah') + '</option>' +
                '<option value="naik"' + (u === 'naik' ? ' selected' : '') + '>Kenaikan terbesar</option>' +
                '<option value="turun"' + (u === 'turun' ? ' selected' : '') + '>Penurunan terbesar</option></select></div>' +
                '<div class="fixed"><label class="field-label">&nbsp;</label><button type="button" class="btn btn-ghost" onclick="unduhPerbandingan()">' + ic('download') + 'Unduh Excel</button></div></div>' +
                '<div class="table-wrap"><table class="table"><thead><tr><th class="c">No</th>' + kolomAwal +
                '<th class="c">' + escapeHtml(d.singkat_lama) + '</th><th class="c">' + escapeHtml(d.singkat_baru) + '</th><th class="c">Selisih</th><th class="c">%</th></tr></thead><tbody>' + tb +
                '<tr class="total"><td colspan="' + (modeKec ? 2 : 4) + '">' + (modeKec ? 'Total' : 'Total (sekolah yang ada di kedua data)') + '</td><td class="c">' + fmt(tot.lama) + '</td><td class="c">' + fmt(tot.baru) + '</td><td class="c">' + pbdDelta(tot.lama, tot.baru) + '</td><td class="c"></td></tr>' +
                '</tbody></table></div>' +

                '<div class="note-box">' + catatan +
                pbdCatatanFoto(d).map(function(c) { return '<p>' + escapeHtml(c) + '</p>'; }).join('') +
                (belum.length ? '<p>Belum bisa dibandingkan karena salah satu periode belum punya foto datanya: ' + escapeHtml(belum.join(', ')) + '. Bagian ini terisi setelah data tersebut diperbarui dengan memilih periodenya.</p>' : '') +
                '<p>Panah naik berarti angka bertambah, panah turun berarti berkurang. Warnanya hanya penanda arah, bukan penilaian baik atau buruk.</p></div>'
        );
}

function unduhPerbandingan() {
        const d = window.pbd.data;
        if (!d) return;
        const k = window.pbd.indikator;
        const info = d.indikator.filter(function(i) { return i.kunci === k; })[0] || {};
        const modeKec = info.dimensi === 'kecamatan';
        const sel = function(a, b) { return (a === null || b === null || a === undefined || b === undefined) ? '' : b - a; };
        const ringkas = [['Data', d.singkat_lama, d.singkat_baru, 'Selisih']];
        d.indikator.filter(function(i) { return i.tersedia; }).forEach(function(i) { const x = d.grup.total[i.kunci]; ringkas.push([i.label, x.lama, x.baru, x.baru - x.lama]); });
        let per;
        if (modeKec) {
                per = [['No', 'Kecamatan', d.singkat_lama, d.singkat_baru, 'Selisih']];
                (d.kecamatan || []).forEach(function(s, i) {
                        const n = s.nilai[k] || { lama: null, baru: null };
                        per.push([i + 1, s.nama, n.lama === null ? '' : n.lama, n.baru === null ? '' : n.baru, sel(n.lama, n.baru)]);
                });
        } else {
                per = [['No', 'Nama Sekolah', 'Jenjang', 'Status', d.singkat_lama, d.singkat_baru, 'Selisih']];
                d.sekolah.forEach(function(s, i) {
                        const n = s.nilai[k] || { lama: null, baru: null };
                        per.push([i + 1, s.nama, s.jenjang, s.status, n.lama === null ? '' : n.lama, n.baru === null ? '' : n.baru, sel(n.lama, n.baru)]);
                });
        }
        const namaInd = info.label || k;
        const judul = 'Perbandingan Data: ' + namaInd;
        const namaFile = namaFileUnduh(judul);
        const namaSheet = modeKec ? 'Per Kecamatan' : 'Per Sekolah';
        muatXlsx(function() {
                const wb = XLSX.utils.book_new();
                const a = XLSX.utils.aoa_to_sheet(ringkas); a['!cols'] = [{ wch: 34 }, { wch: 14 }, { wch: 14 }, { wch: 12 }];
                const b = XLSX.utils.aoa_to_sheet(per);
                b['!cols'] = modeKec ? [{ wch: 5 }, { wch: 30 }, { wch: 13 }, { wch: 13 }, { wch: 11 }] : [{ wch: 5 }, { wch: 46 }, { wch: 10 }, { wch: 10 }, { wch: 13 }, { wch: 13 }, { wch: 11 }];
                XLSX.utils.book_append_sheet(wb, a, 'Ringkasan');
                XLSX.utils.book_append_sheet(wb, b, namaSheet);
                XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([[NAMA_SITUS_UNDUH], ['Bagian', judul], ['Periode awal', d.label_lama], ['Periode akhir', d.label_baru], ['Diunduh', tanggalIndonesia()]].concat(pbdCatatanFoto(d).map(function(c) { return ['Catatan', c]; }))), 'Info');
                XLSX.writeFile(wb, namaFile + '.xlsx');
        }, function() {
                showToast('Pustaka Excel gagal dimuat, data diunduh sebagai CSV.');
                unduhCsv({ judul: judul, ringkasan: [], tabel: [{ nama: 'Ringkasan', baris: ringkas }, { nama: namaSheet, baris: per }] }, namaFile);
        });
}

/* =====================================================
                        DOPADU (Data Olahan Persektor Terpadu)
                        Menampilkan Hasil Indikator (13 indikator laporan) dari spreadsheet Dopadu.
===================================================== */
function showDopadu() {
        setActiveMenu('dopadu');
        window.dopadu = { data: null, mode: (window.dopadu && window.dopadu.mode) || 'kartu' };
        render(
                pageHead('Dopadu', 'Data Olahan Persektor Terpadu: hasil indikator laporan SMA dan SMK.') +
                '<div id="dopaduContainer">' + memuat('Memuat hasil indikator...') + '</div>'
        );
        muatDopadu('');
}

function muatDopadu(tab) {
        setHtml('dopaduContainer', memuat('Memuat hasil indikator...'));
        google.script.run
                .withSuccessHandler(function(data) { renderDopadu(data); })
                .withFailureHandler(function(error) {
                        console.error('Gagal memuat Dopadu:', error);
                        setHtml('dopaduContainer', errorState('Hasil indikator belum bisa dimuat',
                                'Pastikan fungsi getDopaduIndikator sudah terpasang dan akun deployment punya akses ke spreadsheet Dopadu.'));
                })
                .getDopaduIndikator(tab || '');
}

function dopaduSel(n) {
        if (!n || n.k === 'kosong') return '<td class="c">-</td>';
        if (n.k === 'tunggu') return '<td class="c"><span style="color:var(--muted);font-style:italic">' + escapeHtml(n.t) + '</span></td>';
        return '<td class="c">' + escapeHtml(n.t) + '</td>';
}

function dopaduNilai(n) {
        return (!n || n.k === 'kosong') ? { t: '-', c: '' } : { t: n.t, c: n.k === 'tunggu' ? ' dp-tunggu' : '' };
}

function dopaduKartu(d) {
        return '<div class="dp-grid">' + d.indikator.map(function(x, i) {
                const g = dopaduNilai(x.gab), a = dopaduNilai(x.sma), k = dopaduNilai(x.smk);
                const sma = (x.sma && x.sma.k === 'ada') || (x.smk && x.smk.k === 'ada');
                return '<div class="dp-card"><span class="dp-no">' + escapeHtml(x.no || (i + 1)) + '</span><h3>' + escapeHtml(x.nama) + '</h3>' +
                        '<div class="dp-total' + g.c + '"><small>SMA + SMK</small>' + escapeHtml(g.t) + '</div>' +
                        '<div class="dp-split"><div><span>SMA</span><b class="' + a.c.trim() + '">' + escapeHtml(a.t) + '</b></div>' +
                        '<div><span>SMK</span><b class="' + k.c.trim() + '">' + escapeHtml(k.t) + '</b></div></div></div>';
        }).join('') + '</div>';
}

function dopaduTabel(d) {
        const baris = d.indikator.map(function(x, i) {
                return '<tr><td class="num">' + escapeHtml(x.no || (i + 1)) + '</td><td class="strong">' + escapeHtml(x.nama) + '</td>' +
                        dopaduSel(x.sma) + dopaduSel(x.smk) + dopaduSel(x.gab) + '</tr>';
        }).join('');
        return '<div class="table-wrap"><table class="table"><thead><tr><th class="c">No</th><th>Indikator</th><th class="c">SMA</th><th class="c">SMK</th><th class="c">SMA + SMK</th></tr></thead><tbody>' +
                baris + '</tbody></table></div>';
}

function ubahTampilanDopadu(mode) {
        window.dopadu.mode = mode;
        const d = window.dopadu.data;
        if (d) setHtml('dopaduBadan', mode === 'tabel' ? dopaduTabel(d) : dopaduKartu(d));
}

function renderDopadu(d) {
        if (!d || !d.ok) {
                setHtml('dopaduContainer', errorState('Hasil indikator belum bisa dimuat',
                        (d && d.pesan) || 'Muat ulang halaman, atau coba lagi beberapa saat lagi.'));
                return;
        }
        if (!d.indikator || !d.indikator.length) {
                setHtml('dopaduContainer', emptyState('Belum ada hasil indikator', 'Belum ada data untuk periode ini.'));
                return;
        }
        window.dopadu.data = d;
        const mode = window.dopadu.mode || 'kartu';
        const pilihan = d.daftar.length > 1
                ? '<div class="fixed"><label class="field-label" for="dopaduPeriode">Periode</label>' +
                  '<select id="dopaduPeriode" class="select" onchange="muatDopadu(this.value)">' +
                  d.daftar.map(function(x) { return '<option value="' + escapeHtml(x.tab) + '"' + (x.tab === d.tab ? ' selected' : '') + '>' + escapeHtml(x.label) + '</option>'; }).join('') +
                  '</select></div>'
                : '';
        const belum = d.total - d.terisi;

        setHtml('dopaduContainer',
                '<p class="result-info" style="margin:0 0 12px"><b>Periode:</b> ' + escapeHtml(d.periode) + ' &nbsp;|&nbsp; <b>' + fmt(d.terisi) + '</b> dari <b>' + fmt(d.total) + '</b> indikator sudah terisi' +
                        (belum > 0 ? ' (' + fmt(belum) + ' masih menunggu data)' : '') + '</p>' +
                '<div class="toolbar">' + pilihan +
                        '<div class="fixed"><label class="field-label" for="dopaduTampilan">Tampilan</label>' +
                        '<select id="dopaduTampilan" class="select" onchange="ubahTampilanDopadu(this.value)">' +
                        '<option value="kartu"' + (mode === 'kartu' ? ' selected' : '') + '>Kartu</option><option value="tabel"' + (mode === 'tabel' ? ' selected' : '') + '>Tabel</option></select></div>' +
                        '<div class="fixed"><label class="field-label">&nbsp;</label><button type="button" class="btn btn-ghost" onclick="unduhDopadu()">' + ic('download') + 'Unduh Excel</button></div></div>' +
                '<div id="dopaduBadan">' + (mode === 'tabel' ? dopaduTabel(d) : dopaduKartu(d)) + '</div>' +
                '<div class="note-box"><p>Angka dihitung dari data yang diupload dan diisi di aplikasi Dopadu, sehingga mengikuti pembaruan data di sana (jeda beberapa menit). Indikator yang tertulis "Menunggu data" belum bisa dihitung karena data pendukungnya belum diisi.</p>' +
                        ((d.belum && d.belum.length) ? '<p>Belum ada data untuk periode ini: ' + escapeHtml(d.belum.join(', ')) + '.</p>' : '') + '</div>');
}

function unduhDopadu() {
        const d = window.dopadu && window.dopadu.data;
        if (!d) return;
        const t = function(n) { return n && n.k !== 'kosong' ? n.t : ''; };
        const aoa = [['No', 'Indikator', 'SMA', 'SMK', 'SMA + SMK']];
        d.indikator.forEach(function(x, i) { aoa.push([x.no || (i + 1), x.nama, t(x.sma), t(x.smk), t(x.gab)]); });
        const judul = 'Dopadu Hasil Indikator ' + d.periode;
        const namaFile = namaFileUnduh(judul);
        muatXlsx(function() {
                const wb = XLSX.utils.book_new();
                const a = XLSX.utils.aoa_to_sheet(aoa);
                a['!cols'] = [{ wch: 5 }, { wch: 46 }, { wch: 16 }, { wch: 16 }, { wch: 16 }];
                XLSX.utils.book_append_sheet(wb, a, 'Hasil Indikator');
                XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([[NAMA_SITUS_UNDUH], ['Bagian', judul], ['Periode', d.periode], ['Diunduh', tanggalIndonesia()]]), 'Info');
                XLSX.writeFile(wb, namaFile + '.xlsx');
        }, function() {
                showToast('Pustaka Excel gagal dimuat, data diunduh sebagai CSV.');
                unduhCsv({ judul: judul, ringkasan: [], tabel: [{ nama: 'Hasil Indikator', baris: aoa }] }, namaFile);
        });
}

function showUpdateDatabase() {
    setActiveMenu('database');
    render(
        pageHead('Update Database', 'Perbarui data Serba Informasi setiap triwulan: file Dapodik (termasuk PTK) dipakai apa adanya, data lain lewat template Excel terpisah untuk masing-masing data. Setiap pembaruan wajib memilih periode (triwulan) dan disimpan sebagai foto permanen untuk menu Perbandingan Data.') +
        '<div id="updateDatabaseContainer"></div>'
    );
    gerbangAnggota('updateDatabaseContainer', muatUpdateDatabase);
}

function muatUpdateDatabase() {
    setHtml('updateDatabaseContainer', skeleton(4, 'sk-row'));
    google.script.run
        .withSuccessHandler(function(r) {
            if (!r || !r.ok) { habisSesi('updateDatabaseContainer', muatUpdateDatabase, r && r.msg); return; }
            window.utq.status = r;
            window.utq.payload = null;
            tampilUpdateDatabase();
        })
        .withFailureHandler(function(error) {
            console.error(error);

/* ---------- Periode (wajib) dan foto data per periode ---------- */
function utqOpsiPeriode() {
    const ro = ['', 'I', 'II', 'III', 'IV'];
    const tahunIni = new Date().getFullYear();
    let h = '<option value="">- Pilih periode -</option>';
    for (let t = tahunIni; t >= 2025; t--) {
        for (let q = 4; q >= 1; q--) {
            const lbl = 'Triwulan ' + ro[q] + ' ' + t;
            h += '<option value="' + lbl + '">' + lbl + '</option>';
        }
    }
    return h;
}

function utqPeriodeDipilih(id) {
    const el = document.getElementById(id);
    const v = el ? el.value : '';
    if (!v) {
        showToast('Pilih periode pembaruan terlebih dahulu.');
        if (el) el.focus();
        return '';
    }
    return v;
}

function utqCatatFoto(h) {
    if (h.fotoMsg) return '<br><span class="badge badge-proses">Foto periode gagal</span> ' + escapeHtml(h.fotoMsg);
    return h.foto ? '<br><span style="color:var(--muted)">Foto ' + escapeHtml(h.periode || '') + ' tersimpan untuk perbandingan.</span>' : '';
}

function utqFotoHtml() {
    const s = window.utq.status || {};
    const foto = s.foto || [];
    const r = s.ruang;
    const tabel = foto.length
        ? '<div class="table-wrap"><table class="table"><thead><tr><th>Periode</th><th>Data yang tersimpan</th></tr></thead><tbody>' +
            foto.map(function(f) { return '<tr><td class="strong nowrap">' + escapeHtml(f.label) + '</td><td>' + escapeHtml(f.sumber.join(', ')) + '</td></tr>'; }).join('') + '</tbody></table></div>'
        : '<p class="result-info" style="margin:0">Belum ada foto periode. Periode muncul di sini setelah pembaruan diterapkan atau setelah data sekarang disimpan sebagai foto.</p>';
    const ruang = r ? '<p class="update-terbaru" style="margin:12px 0 0">Ruang Google Sheet terpakai sekitar ' +
        (r.terpakai / r.batas * 100).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + '% (' + utqAngka(r.terpakai) + ' dari ' + utqAngka(r.batas) + ' sel). ' +
        'Satu foto periode membutuhkan sekitar ' + utqAngka(r.perPeriode) + ' sel.' + (r.terpakai / r.batas > 0.7 ? ' Ruang mulai menipis, segera hubungi pengelola.' : '') + '</p>' : '';
    return tabel + ruang;
}

function utqFotoMinta() {
    const per = utqPeriodeDipilih('utqFotoPeriode');
    if (!per) return;
    setHtml('utqFotoAksi',
        '<div class="utq-konfirmasi"><p><b>Simpan data yang ada sekarang sebagai foto ' + escapeHtml(per) + '?</b> Semua data yang dibandingkan (peserta didik, agama, data tambahan, PTK, ATS, Adiwiyata, boarding) disalin. ' +
        'Foto ' + escapeHtml(per) + ' yang sudah ada akan ditimpa.</p>' +
        '<button type="button" class="btn" onclick="utqFotoTerapkan()">Ya, simpan foto</button> ' +
        '<button type="button" class="btn btn-ghost" onclick="setHtml(\'utqFotoAksi\', \'\')">Batal</button></div>');
}

function utqFotoTerapkan() {
    const per = utqPeriodeDipilih('utqFotoPeriode');
    if (!per) return;
    setHtml('utqFotoAksi', '<p class="result-info" style="margin:12px 0 0">Menyimpan foto. Mohon tunggu, jangan tutup halaman...</p>');

        .withSuccessHandler(function(r) {

                setHtml('utqFotoAksi', '<p class="result-info" style="color:var(--danger);margin:12px 0 0">' + escapeHtml((r && r.msg) || 'Foto gagal disimpan.') + '</p>');
                return;
            }
            setHtml('utqFotoAksi',
                '<div class="utq-laporan"><div class="table-wrap"><table class="table"><thead><tr><th>Data</th><th>Hasil</th></tr></thead><tbody>' +
                r.hasil.map(function(h) {
                    return '<tr><td class="strong">' + escapeHtml(h.label) + '</td><td>' + (h.ok ? '<span class="badge badge-sudah">Tersimpan</span>' : '<span class="badge badge-galat">Dilewati</span> ' + escapeHtml(h.msg || '')) + '</td></tr>';
                }).join('') + '</tbody></table></div></div>');

        .withFailureHandler(function(e) {

            setHtml('utqFotoAksi', '<p class="result-info" style="color:var(--danger);margin:12px 0 0">Koneksi terputus. Muat ulang halaman ini dan periksa daftar foto sebelum mencoba lagi.</p>');
        })

}

/* ---------- Unduh template (satu data) ---------- */
function utqUnduh(kode) {
    const btn = document.getElementById('utqBtnUnduh_' + kode);
    btn.disabled = true;
    btn.textContent = 'Menyiapkan template...';
    const pulih = function() { btn.disabled = false; btn.innerHTML = ic('download') + 'Unduh template'; };
    google.script.run
        .withSuccessHandler(function(d) {
            if (!d || !d.ok) {
                pulih();
                if (d && /sesi|masuk/i.test(d.msg || '')) { habisSesi('updateDatabaseContainer', muatUpdateDatabase, d.msg); return; }
                showToast((d && d.msg) || 'Template belum bisa disiapkan.');
                return;
            }
            muatXlsx(function() {
                try { utqBangunTemplate(d); showToast('Template berhasil diunduh.'); }
                catch (e) { console.error(e); showToast('Template gagal dibuat. Coba lagi.'); }
                pulih();
            }, function() { pulih(); showToast('Pustaka Excel belum termuat. Periksa koneksi internet.'); });
        })
        .withFailureHandler(function(e) { console.error(e); pulih(); showToast('Template belum bisa disiapkan. Coba lagi.'); })
        .ambilDataTemplateTriwulan(window.anggotaToken, kode);
}

function utqBangunTemplate(d) {
    const t = d.tab;
    const wb = XLSX.utils.book_new();
    const petunjuk = [
        ['TEMPLATE UPDATE DATA SIMAK: ' + t.label.toUpperCase()],
        ['Dibuat ' + tanggalIndonesia() + '. Tab "' + t.tab + '" berisi data ini yang sekarang tampil di SIMAK.'],
        [],
        ['Cara memakai'],
        ['1. Perbarui isi tab "' + t.tab + '": ubah angka yang berubah dan tambahkan baris baru.'],
        ['2. Jangan mengganti nama tab dan jangan mengubah atau menghapus judul kolom (baris pertama).'],
        ['3. File ini MENGGANTIKAN seluruh isi data ' + t.label + '. Pertahankan baris lama yang masih berlaku.'],
        ['4. ' + (d.ket && d.ket.length ? 'Isi tab Keterangan (keterangan data). Kosongkan sel isi untuk kembali ke nilai bawaan.' : 'Tab Keterangan tidak perlu diisi untuk data ini.') + ' Periode pembaruan (mis. Triwulan I 2027) dipilih di SIMAK saat mengunggah, bukan di file ini.'],
        ['5. Unggah file ini di SIMAK, menu Update Database, pada kartu "' + t.label + '". SIMAK memeriksa file dan membuat cadangan otomatis sebelum data diganti.'],
        [],
        ['Kolom wajib', t.wajib.join(', ')],
        ['Catatan', t.catatan]
    ];
    const wsP = XLSX.utils.aoa_to_sheet(petunjuk);
    wsP['!cols'] = [{ wch: 18 }, { wch: 100 }];
    XLSX.utils.book_append_sheet(wb, wsP, 'Petunjuk');

    const ws = XLSX.utils.aoa_to_sheet([t.header].concat(t.rows));
    ws['!cols'] = t.header.map(function(h) { return { wch: Math.min(Math.max(String(h).length + 3, 12), 34) }; });
    ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: Math.max(t.rows.length, 1), c: Math.max(t.header.length - 1, 0) } }) };
    XLSX.utils.book_append_sheet(wb, ws, t.tab);

    const ket = [['kode', 'keterangan', 'isi', 'contoh pengisian']].concat((d.ket || []).map(function(k) { return [k.kode, k.label, k.nilai, k.contoh]; }));
    const wsK = XLSX.utils.aoa_to_sheet(ket);
    wsK['!cols'] = [{ wch: 16 }, { wch: 30 }, { wch: 36 }, { wch: 34 }];
    XLSX.utils.book_append_sheet(wb, wsK, d.tabKet || 'Keterangan');

    const tg = new Date();
    const p2 = function(n) { return ('0' + n).slice(-2); };
    XLSX.writeFile(wb, 'Template-' + slugFile(t.label).replace(/_/g, '-') + '-' + tg.getFullYear() + '-' + p2(tg.getMonth() + 1) + '-' + p2(tg.getDate()) + '.xlsx');
}

/* ---------- Unggah template Excel dan periksa ---------- */
function utqPilihFile(input, kode) {
    const f = input.files && input.files[0];
    if (!f) return;
    setText('utqNama_' + kode, f.name);
    const lap = 'utqLap_' + kode;
    if (!/\.xlsx?$/i.test(f.name)) {
        setHtml(lap, errorState('Format file tidak didukung', 'Gunakan file Excel (.xlsx) dari template data ini.'));
        return;
    }
    setHtml(lap, '<p class="result-info" style="margin-top:14px">Membaca file...</p>');
    muatXlsx(function() {
        const fr = new FileReader();
        fr.onload = function(e) {
            try { utqBacaWorkbook(XLSX.read(new Uint8Array(e.target.result), { type: 'array' }), kode); }
            catch (err) {
                console.error(err);
                setHtml(lap, errorState('File tidak bisa dibaca', 'Pastikan file berformat .xlsx dan tidak rusak.'));
            }
        };
        fr.onerror = function() { setHtml(lap, errorState('File tidak bisa dibaca', 'Coba pilih file lagi.')); };
        fr.readAsArrayBuffer(f);
    }, function() {
        setHtml(lap, errorState('Pustaka Excel belum termuat', 'Periksa koneksi internet, lalu pilih file lagi.'));
    });
}

function utqCariTab(wb, nama) {
    const kunci = String(nama).trim().toLowerCase();
    for (let i = 0; i < wb.SheetNames.length; i++) {
        if (String(wb.SheetNames[i]).trim().toLowerCase() === kunci) return wb.Sheets[wb.SheetNames[i]];
    }
    return null;
}

function utqBacaWorkbook(wb, kode) {
    const lap = 'utqLap_' + kode;
    const it = window.utq.status.items.filter(function(x) { return x.kode === kode; })[0];
    const ws = it && utqCariTab(wb, it.tab);
    if (!ws) {
        setHtml(lap, errorState('Tab "' + (it ? it.tab : kode) + '" tidak ditemukan',
            'File ini bukan template ' + (it ? it.label : 'data ini') + '. Unduh template dari kartu ini dan isi file itu.'));
        return;
    }
    const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: true, blankrows: false });
    const header = (aoa[0] || []).map(function(h) { return String(h).trim(); });
    const rows = aoa.slice(1).filter(function(r) { return r.some(function(c) { return String(c).trim() !== ''; }); });

    const ket = {};
    const wsK = utqCariTab(wb, window.utq.status.tabKet || 'Keterangan');
    if (wsK) {
        const a2 = XLSX.utils.sheet_to_json(wsK, { header: 1, defval: '', raw: true, blankrows: false });
        const h = (a2[0] || []).map(function(x) { return String(x).trim().toLowerCase(); });
        const ik = h.indexOf('kode'), ii = h.indexOf('isi');

/* ---------- PTK: file Dapodik "Guru Data Pokok Pendidikan" (CSV bertitik koma atau Excel) ---------- */
function csvKeAoa(teks) {
    if (teks.charCodeAt(0) === 0xFEFF) teks = teks.slice(1);
    const baris1 = teks.split(/\r?\n/, 1)[0];
    const hit = function(c) { return baris1.split(c).length - 1; };
    const pemisah = (hit(';') >= hit(',') && hit(';') >= hit('\t')) ? ';' : (hit('\t') > hit(',') ? '\t' : ',');
    const hasil = [];
    let row = [], sel = '', kutip = false;
    const tutupBaris = function() { row.push(sel); sel = ''; if (row.length > 1 || row[0] !== '') hasil.push(row); row = []; };
    for (let i = 0; i < teks.length; i++) {
        const c = teks[i];
        if (kutip) {
            if (c === '"') { if (teks[i + 1] === '"') { sel += '"'; i++; } else kutip = false; }
            else sel += c;
        } else if (c === '"') kutip = true;
        else if (c === pemisah) { row.push(sel); sel = ''; }
        else if (c === '\n' || c === '\r') { if (c === '\r' && teks[i + 1] === '\n') i++; tutupBaris(); }
        else sel += c;
    }
    if (sel !== '' || row.length) tutupBaris();
    return hasil;
}

function ptkPilihFile(input, kode) {
    const f = input.files && input.files[0];
    if (!f) return;
    setText('utqNama_PTK', f.name);
    const lap = 'utqLap_PTK';
    if (!/\.(csv|xlsx|xls)$/i.test(f.name)) {
        setHtml(lap, errorState('Format file tidak didukung', 'Gunakan file .csv atau .xlsx dari Dapodik.'));
        return;
    }
    setHtml(lap, '<p class="result-info" style="margin-top:14px">Membaca file...</p>');
    const csv = /\.csv$/i.test(f.name);
    const fr = new FileReader();
    fr.onerror = function() { setHtml(lap, errorState('File tidak bisa dibaca', 'Coba pilih file lagi.')); };
    if (csv) {
        fr.onload = function(e) {
            try { ptkProses(csvKeAoa(String(e.target.result)), f.name); }
            catch (err) { console.error(err); setHtml(lap, errorState('File tidak bisa diproses', /not a function|undefined/i.test(String(err && err.message)) ? 'Server SIMAK belum memakai kode terbaru. Tempel Kode_v5.gs ke Apps Script lalu deploy sebagai versi baru, kemudian muat ulang halaman ini.' : 'Detail: ' + (err && err.message))); }
        };
        fr.readAsText(f, 'UTF-8');
    } else {
        muatXlsx(function() {
            fr.onload = function(e) {
                try {
                    const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                    let aoa = null;
                    for (let i = 0; i < wb.SheetNames.length && !aoa; i++) {
                        const a = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[i]], { header: 1, defval: '', raw: true, blankrows: false });
                        if (a.length && a[0].some(function(h) { return dpkNorm(h) === 'npsn'; })) aoa = a;
                    }

                } catch (err) { console.error(err); setHtml(lap, errorState('File tidak bisa dibaca', 'Pastikan file dari Dapodik dan tidak rusak.')); }
            };
            fr.readAsArrayBuffer(f);
        }, function() {
            setHtml(lap, errorState('Pustaka Excel belum termuat', 'Periksa koneksi internet, lalu pilih file lagi.'));
        });
    }
}

function ptkProses(aoa, namaFile) {
    const lap = 'utqLap_PTK';

    const kunci = Object.keys(perlu);
    const hilang = kunci.filter(function(k) { return k !== 'jabatanptk' && hn.indexOf(k) < 0; }).map(function(k) { return perlu[k]; });
    if (hilang.length) {
        setHtml(lap, errorState('Bukan file Guru Data Pokok Pendidikan', 'Kolom tidak ditemukan: ' + hilang.join(', ') + '. Pilih file PTK dari Dapodik dan jangan ubah judul kolomnya.'));
        return;
    }
    const idx = kunci.map(function(k) { return hn.indexOf(k); });
    const iTugas = hn.indexOf('statustugas');
    const semua = aoa.slice(1).filter(function(r) { return r.some(function(c) { return String(c).trim() !== ''; }); });
    // Hanya baris Induk dan kolom yang dipakai SIMAK yang dikirim ke server.
    const induk = semua.filter(function(r) { return String(r[iTugas]).trim().toLowerCase() === 'induk'; });
    const rows = induk.map(function(r) {
        return idx.map(function(i) { return i < 0 ? '' : (typeof r[i] === 'number' ? String(r[i]) : r[i]); });
    });
    if (!rows.length) {
        setHtml(lap, errorState('Tidak ada PTK induk', 'File ini tidak memuat baris dengan Status Tugas "Induk".'));
        return;
    }
    const el = document.getElementById('utqPeriode_PTK');
    utqData('PTK').payload = {
        header: kunci.map(function(k) { return perlu[k]; }), rows: rows,
        totalFile: semua.length, nonInduk: semua.length - induk.length, namaFile: namaFile, periode: el ? el.value.trim() : ''
    };
    setHtml(lap, '<p class="result-info" style="margin-top:14px">Memeriksa ' + rows.length + ' PTK induk (dari ' + semua.length + ' baris di file)...</p>');
    google.script.run
        .withSuccessHandler(function(r) { utqTerimaPeriksa(r, 'PTK'); })
        .withFailureHandler(function(e) {
            console.error(e);
            setHtml(lap, errorState('File belum bisa diperiksa', 'Ukuran file mungkin terlalu besar atau koneksi terputus. Coba lagi.'));
        })
        .periksaImporPTK(window.anggotaToken, utqData('PTK').payload);
}

function atsCariJudul(aoa) {
    for (let i = 0; i < Math.min(aoa.length, 15); i++) {
        const n = (aoa[i] || []).map(dpkNorm);

function atsProses(aoa, namaFile) {
    const lap = 'utqLap_ATS';

    if (h < 0) {
        setHtml(lap, errorState('Bukan file Data Upload ATS', 'Kolom status, jenis_kelamin, dan kecamatan tidak ditemukan. Pilih file ATS dari Datamart dan jangan ubah judul kolomnya.'));
        return;
    }
    // Dua format dikenali otomatis: 'datamart' (triwulan IV, ada kolom usia) dan 'triwulan2' (tanpa usia, ada tingkat_pendidikan).
    const perlu = ['tahun', 'status', 'usia', 'jenis_kelamin', 'jenjang_pendidikan', 'bentuk_pendidikan', 'kecamatan', 'alasan_approval_id', 'soft_delete', 'kabupaten', 'tingkat_pendidikan', 'keterangan_approval', 'alasan_lainnya'];

    const hilang = ['tahun'].filter(function(k) { return !ada(k); });
    if (hilang.length) {
        setHtml(lap, errorState('Bukan file Data Upload ATS', 'Kolom tidak ditemukan: ' + hilang.join(', ') + '. Pilih file ATS dari Datamart dan jangan ubah judul kolomnya.'));
        return;
    }
    const format = ada('usia') ? 'datamart' : (ada('tingkat_pendidikan') ? 'triwulan2' : '');
    if (!format) {
        setHtml(lap, errorState('Format file ATS tidak dikenali', 'File harus punya kolom usia (format Datamart triwulan IV) atau kolom tingkat_pendidikan (format triwulan II). Jangan ubah judul kolomnya.'));

    // Baris di atas judul (mis. "Sumber : Datamart 31 Oktober 2026") dikirim sebagai teks sumber, untuk mengambil tanggalnya.
    const sumber = aoa.slice(0, h).map(function(r) { return String((r && r[0]) || '').trim(); }).filter(Boolean).join(' ');

    const rows = aoa.slice(h + 1)
        .filter(function(r) { return r.some(function(c) { return String(c).trim() !== ''; }); })
        .map(function(r) { return idx.map(function(i) { return i < 0 ? '' : (typeof r[i] === 'number' ? String(r[i]) : r[i]); }); });
    if (!rows.length) {
        setHtml(lap, errorState('Tidak ada data', 'File ini tidak berisi baris data di bawah judul kolom.'));
        return;
    }
    const el = document.getElementById('utqPeriode_ATS');
    utqData('ATS').payload = { header: perlu, format: format, rows: rows, totalFile: rows.length, sumber: sumber, namaFile: namaFile, periode: el ? el.value.trim() : '' };
    setHtml(lap, '<p class="result-info" style="margin-top:14px">Memeriksa ' + utqAngka(rows.length) + ' baris ATS...</p>');

}

    utqData('ADW').payload = { header: perlu, rows: rows, totalFile: rows.length, namaFile: namaFile, periode: el ? el.value.trim() : '' };
    setHtml(lap, '<p class="result-info" style="margin-top:14px">Memeriksa ' + utqAngka(rows.length) + ' sekolah...</p>');
    google.script.run
        .withSuccessHandler(function(r) { utqTerimaPeriksa(r, 'ADW'); })
        .withFailureHandler(function(e) {
            console.error(e);
            setHtml(lap, errorState('File belum bisa diperiksa', 'Koneksi terputus atau server SIMAK belum memakai kode terbaru. Coba lagi.'));

}

/* =====================================================
                        IMPOR DAPODIK (bagian A halaman Update Database)
                        File Dapodik dibaca di browser, hanya baris Kab. Gunungkidul SMA/SMK yang dikirim ke server.
===================================================== */
function dpkNorm(x) { return String(x === null || x === undefined ? '' : x).toLowerCase().replace(/[^a-z0-9]/g, ''); }

function dpkPilihFile(input) {
    const f = input.files && input.files[0];
    if (!f) return;
    setText('dpkNamaFile', f.name);
    if (!/\.(csv|xlsx|xls)$/i.test(f.name)) {
        setHtml('dpkLaporan', errorState('Format file tidak didukung', 'Gunakan file .csv atau .xlsx dari Dapodik.'));
        return;
    }
    const csv = /\.csv$/i.test(f.name);
    setHtml('dpkLaporan', '<p class="result-info" style="margin-top:14px">Membaca file...</p>');
    muatXlsx(function() {
        const fr = new FileReader();
        fr.onload = function(e) {
            try { dpkBaca(XLSX.read(csv ? e.target.result : new Uint8Array(e.target.result), { type: csv ? 'string' : 'array' }), f.name); }
            catch (err) {
                console.error(err);
                setHtml('dpkLaporan', errorState('File tidak bisa dibaca', 'Pastikan file dari Dapodik dan tidak rusak.'));
            }
        };
        fr.onerror = function() { setHtml('dpkLaporan', errorState('File tidak bisa dibaca', 'Coba pilih file lagi.')); };
        if (csv) fr.readAsText(f, 'UTF-8'); else fr.readAsArrayBuffer(f);
    }, function() {
        setHtml('dpkLaporan', errorState('Pustaka Excel belum termuat', 'Periksa koneksi internet, lalu pilih file lagi.'));
    });
}

function dpkBaca(wb, namaFile) {
    let aoa = null;
    for (let i = 0; i < wb.SheetNames.length && !aoa; i++) {
        const a = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[i]], { header: 1, defval: '', raw: true, blankrows: false });
        if (a.length && a[0].some(function(h) { return dpkNorm(h) === 'npsn'; })) aoa = a;
    }
    if (!aoa) {
        setHtml('dpkLaporan', errorState('Bukan file Dapodik yang dikenali',
            'Kolom NPSN tidak ditemukan. Pilih file "Rekap Data per Satuan Pendidikan - Data Pokok Pendidikan" dari Dapodik.'));
        return;
    }
    const header = aoa[0].map(function(h) { return String(h).trim(); });
    const iKab = header.map(dpkNorm).indexOf('kabupatenkota');
    const iBentuk = header.map(dpkNorm).indexOf('bentukpendidikan');
    if (iKab < 0 || iBentuk < 0) {
        setHtml('dpkLaporan', errorState('Kolom Dapodik tidak lengkap', 'Kolom "Kabupaten/Kota" dan "Bentuk Pendidikan" harus ada.'));
        return;
    }
    const semua = aoa.slice(1);
    const rows = semua.filter(function(r) {
        return dpkNorm(r[iKab]).indexOf('gunungkidul') > -1 && ['SMA', 'SMK'].indexOf(String(r[iBentuk]).trim().toUpperCase()) > -1;
    });
    if (!rows.length) {
        setHtml('dpkLaporan', errorState('Tidak ada data Gunungkidul', 'File ini tidak berisi SMA atau SMK Kabupaten Gunungkidul.'));
        return;
    }
    window.dpk.payload = { header: header, rows: rows, totalFile: semua.length, namaFile: namaFile, periode: '' };
    setHtml('dpkLaporan', '<p class="result-info" style="margin-top:14px">Memeriksa ' + rows.length + ' sekolah Gunungkidul (dari ' + semua.length + ' baris di file)...</p>');
    google.script.run
        .withSuccessHandler(function(r) {
            if (!r || !r.ok) {
                if (r && /sesi|masuk/i.test(r.msg || '')) { habisSesi('updateDatabaseContainer', muatUpdateDatabase, r.msg); return; }
                setHtml('dpkLaporan', errorState('File belum bisa diperiksa', (r && r.msg) || ''));
                return;
            }
            window.dpk.laporan = r;
            dpkTampilLaporan(r);
        })
        .withFailureHandler(function(e) {
            console.error(e);
            setHtml('dpkLaporan', errorState('File belum bisa diperiksa', 'Ukuran file mungkin terlalu besar atau koneksi terputus. Coba lagi.'));
        })
        .periksaImporDapodik(window.anggotaToken, window.dpk.payload);
}

function dpkTampilLaporan(r) {
    const adaBisa = r.laporan.some(function(x) { return x.status !== 'galat'; });
    const umum = (r.umum || []).map(function(c) { return '<li class="utq-' + c.t + '">' + escapeHtml(c.teks) + '</li>'; }).join('');
    setHtml('dpkLaporan',
        '<div class="utq-laporan">' +
        (umum ? '<ul class="utq-catatan" style="margin:0 0 14px">' + umum + '</ul>' : '') +
        '<div class="table-wrap"><table class="table"><thead><tr><th style="width:44px"></th><th>Data</th><th class="c">Baris</th><th>Hasil pemeriksaan</th></tr></thead><tbody>' +
        r.laporan.map(function(x) {
            const catatan = x.catatan.map(function(c) { return '<li class="utq-' + c.t + '">' + escapeHtml(c.teks) + '</li>'; }).join('');
            return '<tr><td class="c"><input type="checkbox" class="dpk-pilih" data-kode="' + escapeHtml(x.kode) + '"' +
                (x.status === 'galat' ? ' disabled' : ' checked') + ' aria-label="Terapkan ' + escapeHtml(x.label) + '"></td>' +
                '<td class="strong">' + escapeHtml(x.label) + '</td>' +

                '<td>' + utqLencanaStatus(x.status) + (catatan ? '<ul class="utq-catatan">' + catatan + '</ul>' : '') + '</td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<div class="utq-aksi" id="dpkAksi">' +
            (adaBisa
                ? '<button type="button" class="btn" onclick="dpkMintaKonfirmasi()">Terapkan pembaruan</button>'
                : '<p class="result-info" style="margin:0">Perbaiki kesalahan di file, lalu pilih file lagi.</p>') +
        '</div></div>');
}

function dpkMintaKonfirmasi() {
    const dipilih = document.querySelectorAll('.dpk-pilih:checked').length;
    if (!dipilih) { showToast('Pilih minimal satu data untuk diterapkan.'); return; }

function dpkTerapkan() {

    document.querySelectorAll('.dpk-pilih:checked').forEach(function(el) { pilih.push(el.dataset.kode); });

                setHtml('dpkAksi', '<p class="result-info" style="color:var(--danger);margin:0">' + escapeHtml((r && r.msg) || 'Pembaruan gagal.') + '</p>');

        })
        .terapkanImporDapodik(window.anggotaToken, window.dpk.payload, pilih);
}

function dpkTampilHasil(hasil) {
