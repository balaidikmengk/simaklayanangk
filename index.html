};
const AL_WARNA = [199, 160, 262, 340, 28, 45, 222, 128, 290, 8, 175, 312];

function alWarna(teks) {
        let x = 0;
        String(teks).split('').forEach(function(c) { x = (x * 31 + c.charCodeAt(0)) % 9973; });
        return AL_WARNA[x % AL_WARNA.length];
}

function alHost(url) {
        try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return url; }
}

function alKategori(teks) {
        const daftar = String(teks || '').split('/').map(function(x) { return x.trim(); }).filter(Boolean);
        return daftar.length ? daftar : ['Lainnya'];
}

function alIkonOtomatis(nama) {
        const n = String(nama).toLowerCase();
        if (/kelulusan|lulus/.test(n)) return 'toga';
        if (/tracer/.test(n)) return 'tracer';
        if (/fls3n|topeng|seni/.test(n)) return 'topeng';
        if (/simak|arsip|kearsipan/.test(n)) return 'arsip';
        return '';
}

function alIkonHtml(item) {
        const raw = String(item.ikon || '').trim();
        const kunci = AL_IKON[raw] ? raw : (raw ? '' : alIkonOtomatis(item.nama));
        if (kunci) return '<span class="al-ico sv" aria-hidden="true"><svg viewBox="0 0 24 24">' + AL_IKON[kunci] + '</svg></span>';
        const src = /^https?:\/\//i.test(raw) ? raw : 'https://www.google.com/s2/favicons?sz=64&domain=' + encodeURIComponent(alHost(item.url));
        return '<span class="al-ico" aria-hidden="true">' + escapeHtml(String(item.nama).trim().charAt(0).toUpperCase()) +
                '<img class="al-fv" alt="" loading="lazy" referrerpolicy="no-referrer" src="' + escapeHtml(src) + '"></span>';
}

function renderAppLainnya(d) {
        if (!d || !d.ok) {
                setHtml('alContainer', errorState('Daftar aplikasi belum bisa dimuat', (d && d.pesan) || ''));
                return;
        }
        if (!d.data.length) {
                setHtml('alContainer', emptyState('Belum ada aplikasi', 'Daftar akan tampil di sini setelah tautan ditambahkan.'));
                return;
        }
        d.data.forEach(function(i) { i.kats = alKategori(i.kategori); });
        window.appLain.data = d.data;
        const nama = {};
        d.data.forEach(function(i) { i.kats.forEach(function(k) { nama[k] = true; }); });
        window.appLain.nama = Object.keys(nama).sort(function(a, b) { return a.localeCompare(b, 'id'); });

        setHtml('alContainer',
                '<div class="toolbar"><div class="grow"><label class="field-label" for="alCari">Cari aplikasi</label>' +

                (d.kelola ? '<p style="margin:18px 0 0"><a class="btn btn-ghost btn-sm" href="' + escapeHtml(d.kelola) + '" target="_blank" rel="noopener noreferrer">Kelola daftar tautan</a></p>' : '')
        );
        alSaring();
}

function alCariUbah(nilai) {
        window.appLain.q = nilai;
        alSaring();
}

function alPilihKategori(idx) {
        const s = window.appLain;
        s.cat = idx < 0 ? '' : s.nama[idx];
        alSaring();
}

function alSaring() {
        const s = window.appLain, k = s.q.trim().toLowerCase();
        const hitung = {};
        s.data.forEach(function(i) { i.kats.forEach(function(c) { hitung[c] = (hitung[c] || 0) + 1; }); });
        setHtml('alChips', s.nama.length > 1
                ? '<button type="button" class="al-chip" aria-pressed="' + (!s.cat) + '" onclick="alPilihKategori(-1)">Semua <b>' + s.data.length + '</b></button>' +
                  s.nama.map(function(n, idx) {
                          return '<button type="button" class="al-chip" aria-pressed="' + (s.cat === n) + '" onclick="alPilihKategori(' + idx + ')">' + escapeHtml(n) + ' <b>' + hitung[n] + '</b></button>';
                  }).join('')
                : '');
        const cocok = s.data.filter(function(i) {
                if (s.cat && i.kats.indexOf(s.cat) < 0) return false;
                return !k || [i.nama, i.ket, i.kategori, alHost(i.url)].join(' ').toLowerCase().indexOf(k) > -1;
        });
        setText('alInfo', 'Menampilkan ' + cocok.length + ' dari ' + s.data.length + ' aplikasi');
        if (!cocok.length) {
                setHtml('alGrid', emptyState('Tidak ada yang cocok', 'Coba kata kunci lain atau pilih kategori Semua.'));
                return;
        }
        setHtml('alGrid', '<div class="al-grid">' + cocok.map(function(i) {
                return '<a class="al-card" style="--h:' + alWarna(i.nama) + '" href="' + escapeHtml(i.url) + '" target="_blank" rel="noopener noreferrer" title="' + escapeHtml(i.url) + '">' +
                        alIkonHtml(i) +
                        '<span class="al-txt"><b>' + escapeHtml(i.nama) + '</b>' +
                        (i.ket ? '<small>' + escapeHtml(i.ket) + '</small>' : '') +
                        '<span class="al-url">' + escapeHtml(i.url) + '</span></span>' +
                        '<span class="al-tag">' + escapeHtml(i.kategori || 'Lainnya') + '</span></a>';
        }).join('') + '</div>');
}

<script>

(function () {

    if (!pillReady) { void pill.offsetWidth; pill.style.transition = ''; pillReady = true; }
  }

  function afterNav() {

      content.classList.remove('swap');

  if (typeof window.go === 'function') {

    if (reduce || busy.has(el)) return;
    var txt = el.textContent.trim();
    if (!/^\d{1,3}(\.\d{3})*$|^\d+$/.test(txt)) return;
    var to = parseInt(txt.replace(/\./g, ''), 10);
    if (!(to > 0) || to > 1e7) return;
    var sep = txt.indexOf('.') > -1;
    busy.add(el);
    var t0 = performance.now(), dur = 600;
    (function frame(now) {
      var p = Math.min(1, (now - t0) / dur);
      var v = p < 1 ? Math.round(to * (1 - Math.pow(1 - p, 3))) : to;
      el.textContent = sep ? v.toLocaleString('id-ID') : String(v);
      if (p < 1) requestAnimationFrame(frame);
      else setTimeout(function () { busy.delete(el); }, 0);
    })(t0);
  }
  if (content && window.MutationObserver) {
    new MutationObserver(function (records) {
      records.forEach(function (m) {
        m.addedNodes.forEach(function (n) {
          var el = n.nodeType === 3 ? n.parentElement : n;
          if (!el || !el.querySelectorAll) return;
          if (el.matches('.metric-num, .summary-num')) tick(el);
          el.querySelectorAll('.metric-num, .summary-num').forEach(tick);
        });
      });
    }).observe(content, { childList: true, subtree: true });
  }

  /* Suara klik: mati secara bawaan, pilihan disimpan di peramban */
  var soundOn = false;
  try { soundOn = localStorage.getItem('simak_suara') === '1'; } catch (e) {}
  var audio = null;
  function blip(freq, dur) {
    if (!soundOn) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      var o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.06, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(audio.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.nav button, .btn, .btn-ghost, .btn-sm');
    if (b && !b.disabled) blip(b.closest('.nav') ? 660 : 520, 0.09);
  }, true);

  var host = document.querySelector('.tema-switch');
  if (host) {
    var tog = document.createElement('button');
    tog.type = 'button';
    tog.className = 'snd-toggle';
    function paint() {
      tog.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
      tog.textContent = soundOn ? 'Suara klik: hidup' : 'Suara klik: mati';
    }
    tog.addEventListener('click', function () {
      soundOn = !soundOn;
      try { localStorage.setItem('simak_suara', soundOn ? '1' : '0'); } catch (e) {}
      paint();
      blip(780, 0.12);
    });
    paint();
    host.appendChild(tog);
  }
})();
</script>


<script>
/* ISLAND v52: notifikasi (menggantikan showToast) dan status proses simpan/perbarui data. */
(function () {
  var el = document.createElement('div');
  el.id = 'island'; el.className = 'island';
  el.setAttribute('role', 'status'); el.setAttribute('aria-live', 'polite');
  el.innerHTML = '<span class="isl-ic" aria-hidden="true"></span><span class="isl-tx"></span><span class="isl-bar" aria-hidden="true"><i></i></span>';
  document.body.appendChild(el);
  var tx = el.querySelector('.isl-tx'), hideT = null, cur = null;

  function show(kind, text) { el.className = 'island show ' + kind; tx.textContent = text; }
  function hideLater(ms) { clearTimeout(hideT); hideT = setTimeout(function () { el.classList.remove('show'); }, ms); }
  function classify(m) {
    if (/gagal|belum|tidak|terputus|galat|salah|wajib|pilih |isi |ketik |lebih awal|habis/i.test(m)) return 'err';
    if (/tersimpan|berhasil|diperbarui|diunduh|selesai/i.test(m)) return 'ok';
    return 'info';
  }
  function notice(msg, kind) {
    cur = null; kind = kind || classify(msg);
    show(kind, msg); hideLater(kind === 'err' ? 4500 : 3200);
  }
  function work(label, maxMs) {
    var h = {};
    cur = h; clearTimeout(hideT); show('work', label);
    h.safety = setTimeout(function () { if (cur === h) { cur = null; el.classList.remove('show'); } }, maxMs || 60000);
    h.text = function (t) { if (cur === h) tx.textContent = t; };
    h.finish = function (msg, kind) { if (cur !== h) return; clearTimeout(h.safety); notice(msg, kind); };
    return h;
  }
  window.SimakIsland = { notice: notice, work: work };

  /* Semua pemanggilan showToast() lama kini tampil di kapsul. Pesan berakhiran "..." tampil sebagai proses. */
  window.showToast = function (message) {
    var m = String(message == null ? '' : message);
    if (/(\.\.\.|\u2026)\s*$/.test(m)) work(m.replace(/\s*(\.\.\.|\u2026)\s*$/, '\u2026'), 10000);
    else notice(m);
  };

  /* Proses ke server: setiap fungsi yang namanya diawali simpan/terapkan memunculkan status proses. */
  var LABEL = {
    terapkanImporPTK: ['Memperbarui data PTK', 'Data PTK diperbarui'],
    terapkanImporATS: ['Memperbarui data ATS', 'Data ATS diperbarui'],
    terapkanImporAdiwiyata: ['Memperbarui data Adiwiyata', 'Data Adiwiyata diperbarui'],
    terapkanImporDapodik: ['Memperbarui data Dapodik', 'Data Dapodik diperbarui'],
    terapkanUpdateTriwulan: ['Memperbarui data', 'Data diperbarui'],
    simpanFotoDataSekarang: ['Menyimpan foto data', 'Foto data tersimpan'],
    simpanPanitia: ['Menyimpan susunan panitia', 'Susunan panitia tersimpan'],
    simpanTimeline: ['Menyimpan timeline', 'Timeline tersimpan'],
    simpanNarasumber: ['Menyimpan data narasumber', 'Data narasumber tersimpan']
  };
  var TRACK = /^(simpan|terapkan)/;
  function mk(b, st) {
    return new Proxy(b, { get: function (t, p) {
      var v = t[p];
      if (typeof v !== 'function') return v;
      return function () {
        var a = Array.prototype.slice.call(arguments);
        if (p === 'withSuccessHandler' && typeof a[0] === 'function') {
          var f = a[0];
          a[0] = function (r) {
            try { f.apply(this, arguments); }
            finally {
              var h = st.h; st.h = null;
              if (h) { if (r && r.ok === false) h.finish(r.msg || 'Gagal menyimpan.', 'err'); else h.finish(st.ok, 'ok'); }
            }
          };
        }
        if (p === 'withFailureHandler' && typeof a[0] === 'function') {
          var g = a[0];
          a[0] = function () {
            try { g.apply(this, arguments); }
            finally { var h = st.h; st.h = null; if (h) h.finish('Koneksi terputus. Coba lagi.', 'err'); }
          };
        }
        if (p === 'withSuccessHandler' || p === 'withFailureHandler' || p === 'withUserObject') return mk(v.apply(t, a), st);
        if (typeof p === 'string' && TRACK.test(p)) {
          var info = LABEL[p] || ['Menyimpan data', 'Data tersimpan'];
          st.ok = info[1]; st.h = work(info[0]);
        }
        return v.apply(t, a);
      };
    } });
  }
  try {
    if (window.google && google.script && google.script.run && typeof Proxy === 'function') {
      google.script.run = mk(google.script.run, {});
    }
  } catch (e) { /* bila google.script.run tidak bisa dibungkus, kapsul tetap menampilkan notifikasi */ }
})();
</script>


<script>
/* =====================================================
   PENANDA LOADING GLOBAL
   Setiap permintaan ke server (google.script.run) dihitung. Selama ada yang belum selesai,
   kartu jam pasir tampil di tengah halaman. Kartu baru muncul bila permintaan lebih dari 0,3 detik,
   supaya tidak berkedip pada permintaan yang cepat. Kartu tidak menghalangi klik atau gulir.
===================================================== */
(function () {
  if (!(window.google && google.script && google.script.run && typeof Proxy === 'function')) return;
  var JEDA_TAMPIL = 300, BATAS_AMAN = 120000;
  var jumlah = 0, timer = null, bar = null;

  function adaBar() {
    if (bar) return bar;
    bar = document.createElement('div');
    bar.className = 'simak-muat';
    bar.setAttribute('role', 'status');
    bar.setAttribute('aria-live', 'polite');
    bar.innerHTML = (typeof jamPasir === 'function' ? jamPasir(46) : '') + '<span>Memuat data...</span>';
    document.body.appendChild(bar);
    return bar;
  }
  function mulai() {
    jumlah++;
    if (jumlah === 1) {
      clearTimeout(timer);
      timer = setTimeout(function () { if (jumlah > 0) adaBar().classList.add('on'); }, JEDA_TAMPIL);
    }
  }
  function selesai() {
    jumlah = Math.max(0, jumlah - 1);
    if (jumlah === 0) {
      clearTimeout(timer);
      if (bar) bar.classList.remove('on');
    }
  }
  function rantai(dasar, ok, gagal, user, adaUser) {
    return new Proxy({}, { get: function (_, nama) {
      if (typeof nama !== 'string' || nama === 'then') return undefined;
      if (nama === 'withSuccessHandler') return function (f) { return rantai(dasar, f, gagal, user, adaUser); };
      if (nama === 'withFailureHandler') return function (f) { return rantai(dasar, ok, f, user, adaUser); };
      if (nama === 'withUserObject') return function (u) { return rantai(dasar, ok, gagal, u, true); };
      return function () {
        var sudah = false, pengaman;
        var akhir = function () { if (sudah) return; sudah = true; clearTimeout(pengaman); selesai(); };
        mulai();
        pengaman = setTimeout(akhir, BATAS_AMAN);
        try {
          var r = dasar.withSuccessHandler(function () {
            akhir();
            if (typeof ok === 'function') return ok.apply(this, arguments);
          }).withFailureHandler(function () {
            akhir();
            if (typeof gagal === 'function') return gagal.apply(this, arguments);
            console.error('[SIMAK] ' + nama + ':', arguments[0]);
          });
          if (adaUser) r = r.withUserObject(user);
          return r[nama].apply(r, arguments);
        } catch (e) { akhir(); throw e; }
      };
    } });
  }
  try { google.script.run = rantai(google.script.run, null, null, undefined, false); } catch (e) { /* bila tidak bisa dibungkus, halaman tetap berjalan tanpa penanda */ }
})();
</script>
