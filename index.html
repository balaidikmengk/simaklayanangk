<script>
/* =====================================================
   HOSTING DI GITHUB PAGES
   Di Google Apps Script, google.script.run sudah ada dan blok ini tidak melakukan apa-apa.
   Di GitHub Pages, google.script.run ditiru: setiap pemanggilan dikirim ke web app Apps Script (doPost).
   ISI SIMAK_API_URL dengan alamat web app (berakhiran /exec) dari Deploy > Manage deployments.
===================================================== */
(function () {
  var SIMAK_API_URL = 'https://script.google.com/macros/s/AKfycbws9xRz2eqxy8dJuIPohpEkc0FI8J3JsZoPHKig2vsm11KqzO0UgmCAWBpwB5R9ilKq/exec';
  var MAKS_BERSAMAAN = 6;                       // batasi permintaan serentak agar tidak melewati batas Apps Script

  if (window.google && google.script && google.script.run) return;   // sedang berjalan di Apps Script

  var antri = [], jalan = 0;
  function giliran() {
    while (jalan < MAKS_BERSAMAAN && antri.length) { jalan++; antri.shift()(); }
  }
  function kirim(nama, args, ok, gagal, user) {
    antri.push(function () {
      var selesai = function () { jalan--; giliran(); };
      var galat = function (e) { selesai(); if (typeof gagal === 'function') gagal(e, user); else console.error('[SIMAK] ' + nama + ':', e); };
      if (!SIMAK_API_URL || /^ISI_/.test(SIMAK_API_URL)) { galat(new Error('Alamat API belum diisi di index.html (SIMAK_API_URL).')); return; }
      fetch(SIMAK_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // text/plain: tanpa preflight CORS
        body: JSON.stringify({ fn: nama, args: args }),
        redirect: 'follow'
      }).then(function (r) { return r.text(); }).then(function (t) {
        var d;
        try { d = JSON.parse(t); } catch (e) { throw new Error('Balasan server tidak valid. Pastikan web app dideploy dengan akses Anyone.'); }
        if (!d || d.ok !== true) throw new Error((d && d.error) || 'Galat server.');
        return d.data === undefined ? null : d.data;
      }).then(function (data) {
        selesai();
        if (typeof ok === 'function') setTimeout(function () { ok(data, user); }, 0);
      }, galat);
    });
    giliran();
  }
  function bangun(ok, gagal, user) {
    return new Proxy({}, { get: function (_, nama) {
      if (typeof nama !== 'string' || nama === 'then') return undefined;
      if (nama === 'withSuccessHandler') return function (f) { return bangun(f, gagal, user); };
      if (nama === 'withFailureHandler') return function (f) { return bangun(ok, f, user); };
      if (nama === 'withUserObject') return function (u) { return bangun(ok, gagal, u); };
      return function () { kirim(nama, Array.prototype.slice.call(arguments), ok, gagal, user); };
    } });
  }
  var G = window.google = window.google || {};
  G.script = G.script || {};
  G.script.run = bangun(null, null, undefined);
})();
</script>

<script>
/* Tema terang/gelap: disimpan di peramban; bila penyimpanan diblokir, berlaku selama halaman terbuka. */
(function() {
  var mode = 'auto';
  try { mode = localStorage.getItem('simak_tema') || 'auto'; } catch (e) {}
  var gelap = mode === 'gelap' || (mode === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-tema', gelap ? 'gelap' : 'terang');
  window.__temaMode = mode;
})();
</script>

<style>
/* =====================================================
                        TOKEN
===================================================== */
:root {
                --ink: #14263a;
                --muted: #5b6b7b;
                --line: #dfe5ea;
                --paper: #f3f5f7;
                --surface: #ffffff;
                --brand: #123b5d;
                --brand-deep: #0c2a43;
                --brand-soft: #e7eef4;
                --gold: #e9b44c;
                --ok: #17753f;
                --ok-bg: #e5f3ea;
                --warn: #9a5b06;
                --warn-bg: #fcf0d9;
                --idle: #475569;
                --idle-bg: #e9edf1;
                --danger: #b42318;
                --danger-bg: #fdecea;
                --sidebar-w: 268px;
                --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
                margin: 0;
                font-family: var(--font);
                font-size: 15px;
                line-height: 1.55;
                color: var(--ink);
                background: var(--paper);
}

button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }

:focus-visible {
                outline: 2px solid #2f7fc1;
                outline-offset: 2px;
}

.ic {
                width: 1.15em;
                height: 1.15em;
                flex-shrink: 0;
                fill: none;
                stroke: currentColor;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round;
                vertical-align: -0.2em;
}

/* =====================================================
                        KERANGKA
===================================================== */
.app { display: flex; min-height: 100vh; }

.sidebar {
                position: sticky;
                top: 0;
                align-self: flex-start;
                width: var(--sidebar-w);
                height: 100vh;
                overflow-y: auto;
                flex-shrink: 0;
                background: var(--brand);
                color: #fff;
                padding: 26px 14px 20px;
                display: flex;
                flex-direction: column;
}

.brand {
                padding: 0 10px 22px;
                margin-bottom: 18px;
                border-bottom: 1px solid rgba(255, 255, 255, .16);
}
.brand-head { display: flex; align-items: center; gap: 12px; }
.logo-mark { width: 46px; height: 46px; flex-shrink: 0; border-radius: 19%; box-shadow: 0 0 0 2px rgba(255, 255, 255, .85); }
.logo-mark-sm { width: 28px; height: 28px; box-shadow: none; }
.topbar-title { display: inline-flex; align-items: center; gap: 8px; }
.brand-name {
                font-size: 26px;
                font-weight: 700;
                letter-spacing: .02em;
                line-height: 1.1;
}
.brand-desc {

                font-size: 12.5px;
                line-height: 1.5;
                color: rgba(255, 255, 255, .72);
}

.nav { display: flex; flex-direction: column; gap: 3px; }
.nav button {
                position: relative;
                display: flex;
                align-items: center;
                gap: 12px;
                width: 100%;
                padding: 11px 12px;
                border: 0;
                border-radius: 8px;
                background: transparent;
                color: rgba(255, 255, 255, .86);
                font-size: 14px;
                font-weight: 500;
                text-align: left;
                transition: background .15s;
}
.nav button:hover { background: rgba(255, 255, 255, .09); color: #fff; }
.nav button.active,
.nav .menu-parent.has-active {

                color: #fff;
}
.nav button.active::before {
                content: '';

                left: 0; top: 9px; bottom: 9px;
                width: 3px;
                border-radius: 2px;
                background: var(--gold);

.nav button:focus-visible { outline-color: #fff; outline-offset: -2px; }
.menu-parent .chev { margin-left: auto; transition: transform .2s; }
.menu-parent[aria-expanded="true"] .chev { transform: rotate(180deg); }

.submenu {

                gap: 2px;
                margin: 2px 0 4px 22px;
                padding-left: 10px;
                border-left: 1px solid rgba(255, 255, 255, .18);
}
.submenu.open { display: flex; }
.submenu button { padding: 9px 12px; font-size: 13.5px; }

.main {
                flex: 1;
                min-width: 0;
                display: flex;
                flex-direction: column;
}
#content {

                width: 100%;
                max-width: 1180px;

}
.footer {

                color: var(--muted);
}

.topbar { display: none; }
.scrim { display: none; }

/* =====================================================
                        KOMPONEN DASAR
===================================================== */
.page-head { margin-bottom: 26px; }
.page-head h1 {
                font-size: 28px;
                line-height: 1.25;
                font-weight: 700;
                letter-spacing: -.01em;
}
.page-head p { margin-top: 6px; color: var(--muted); max-width: 70ch; }

.panel {
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: 12px;
}
.panel + .panel,
.block + .block { margin-top: 22px; }
.panel-pad { padding: 22px; }
.panel-title {
                font-size: 17px;
                font-weight: 700;
                line-height: 1.3;
}
.panel-sub { margin-top: 3px; font-size: 13.5px; color: var(--muted); }

.block { margin-top: 30px; }
.block-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                margin-bottom: 14px;
}
.block-head h2 { font-size: 19px; font-weight: 700; }

.btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                padding: 10px 16px;
                border: 1px solid var(--brand);
                border-radius: 8px;
                background: var(--brand);
                color: #fff;
                font-size: 13.5px;
                font-weight: 600;
                line-height: 1.2;
                text-decoration: none;
                white-space: nowrap;
                transition: background .15s, border-color .15s;
}
.btn:hover { background: var(--brand-deep); border-color: var(--brand-deep); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-ghost {
                background: transparent;
                color: var(--brand);
                border-color: #c4d0da;
}
.btn-ghost:hover { background: var(--brand-soft); border-color: #aebdca; }
.btn-sm { padding: 7px 12px; font-size: 12.5px; }
.btn-text {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                padding: 6px 2px;
                border: 0;
                background: none;
                color: var(--brand);
                font-size: 13.5px;
                font-weight: 600;
}
.btn-text:hover { text-decoration: underline; }

.badge {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                padding: 3px 10px;
                border-radius: 999px;
                font-size: 12px;
                font-weight: 600;
                white-space: nowrap;
}
.badge-sudah { background: var(--ok-bg); color: var(--ok); }
.badge-proses { background: var(--warn-bg); color: var(--warn); }
.badge-belum { background: var(--idle-bg); color: var(--idle); }

.cert { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.cert-ada { color: var(--ok); }
.cert-tidak { color: var(--muted); font-weight: 500; }

.state {
                padding: 34px 22px;
                text-align: center;
                color: var(--muted);
                background: var(--surface);
                border: 1px dashed #c9d3dc;
                border-radius: 12px;
}
.state strong { display: block; margin-bottom: 4px; color: var(--ink); font-size: 15px; }
.state-error { border-color: #f0b8b2; background: var(--danger-bg); }
.state-error strong { color: var(--danger); }

.skeleton {
                border-radius: 12px;
                background: linear-gradient(90deg, #e8edf1 25%, #f3f6f8 50%, #e8edf1 75%);
                background-size: 200% 100%;
                animation: shimmer 1.4s linear infinite;
}
@keyframes shimmer { to { background-position: -200% 0; } }
.sk-card { height: 150px; }
.sk-row { height: 64px; margin-bottom: 10px; }

.field-label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.input, .select {
                width: 100%;
                padding: 11px 14px;
                border: 1px solid #ccd5dd;
                border-radius: 8px;
                background: #fff;
                font-size: 14px;
}
.input:focus, .select:focus { outline: 0; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(18, 59, 93, .14); }
.select { cursor: pointer; }

.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 14px; }
.toolbar .grow { flex: 1; min-width: 220px; }
.toolbar .fixed { width: 190px; }
.search-wrap { position: relative; }
.search-wrap .ic { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search-wrap .input { padding-left: 38px; }
.result-info { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
.result-info a { color: var(--brand); font-weight: 600; }

/* =====================================================
                        TABEL
===================================================== */
.table-wrap { width: 100%; overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.table { width: 100%; min-width: 640px; border-collapse: collapse; font-size: 13.5px; }
.table th {
                padding: 12px 14px;
                background: #f1f5f8;
                border-bottom: 1px solid var(--line);
                text-align: left;
                font-size: 13px;
                font-weight: 600;
                color: #33475a;
                white-space: nowrap;
}
.table td { padding: 12px 14px; border-bottom: 1px solid #eaeef2; vertical-align: top; }
.table tbody tr:last-child td { border-bottom: 0; }
.table tbody tr:hover { background: #f8fafc; }
.table .c { text-align: center; }
.table .num { width: 52px; text-align: center; color: var(--muted); }
.table .strong { font-weight: 600; color: var(--brand); }
.table .nowrap { white-space: nowrap; }
.table tr.total td { background: #f1f5f8; font-weight: 700; color: var(--brand); border-top: 2px solid var(--brand); }
.table-wide { min-width: 900px; }

/* =====================================================
                        BERANDA
===================================================== */
.metrics {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                overflow: hidden;
}
.metric {
                display: flex;
                align-items: center;
                gap: 14px;
                padding: 20px 22px;
                border: 0;
                border-right: 1px solid var(--line);
                background: transparent;
                text-align: left;
                transition: background .15s;
}
.metric:last-child { border-right: 0; }
.metric:hover { background: #f7f9fb; }
.metric-icon {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 44px; height: 44px;
                flex-shrink: 0;
                border-radius: 10px;
                background: var(--brand-soft);
                color: var(--brand);
                font-size: 22px;
}
.metric-num { display: block; font-size: 28px; font-weight: 700; line-height: 1.1; }
.metric-label { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); }

.summary { display: flex; flex-wrap: wrap; gap: 10px 34px; margin-top: 16px; }
.summary-item { display: flex; align-items: baseline; gap: 8px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.dot-sudah { background: #2a9d5c; }
.dot-proses { background: #e0a030; }
.dot-belum { background: #94a3b8; }
.dot-sertifikat { background: var(--brand); }
.summary-num { font-size: 22px; font-weight: 700; line-height: 1; }
.summary-label { font-size: 13px; color: var(--muted); }

.year-list { margin-top: 18px; border-top: 1px solid var(--line); }
.year-row {
                display: grid;
                grid-template-columns: 110px minmax(0, 1fr) auto auto;
                align-items: center;
                gap: 18px;
                padding: 14px 0;
                border-bottom: 1px solid #edf0f3;
}
.year-row:last-child { border-bottom: 0; padding-bottom: 0; }
.year-label strong { display: block; font-size: 18px; line-height: 1.2; }
.year-label span { font-size: 12.5px; color: var(--muted); }
.year-track { height: 14px; border-radius: 7px; background: #eef1f4; overflow: hidden; }
.year-fill { display: flex; height: 100%; border-radius: 7px; overflow: hidden; }
.seg { display: block; min-width: 4px; }
.seg-sudah { background: #2a9d5c; }
.seg-proses { background: #e0a030; }
.seg-belum { background: #94a3b8; }
.year-counts { display: flex; gap: 12px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.year-counts span { display: inline-flex; align-items: center; gap: 5px; }
.year-counts b { color: var(--ink); }

.event-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
.event {
                display: flex;
                flex-direction: column;
                gap: 12px;
                padding: 18px;
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: 12px;
}
.event h3 { font-size: 16px; line-height: 1.4; font-weight: 700; color: var(--brand); }
.event-meta { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; color: var(--muted); }
.event-meta div { display: flex; gap: 9px; align-items: flex-start; }
.event-meta .ic { margin-top: 2px; color: #7d8d9c; }
.event-meta .date { color: var(--ink); font-weight: 600; }
.event-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid #edf0f3; }

.quick { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.quick button {
                display: flex;
                flex-direction: column;
                gap: 4px;
                padding: 16px 18px;
                text-align: left;
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: 10px;
                transition: border-color .15s, background .15s;
}
.quick button:hover { border-color: var(--brand); background: #f9fbfc; }
.quick .ic { font-size: 22px; color: var(--brand); margin-bottom: 6px; }
.quick strong { font-size: 15px; color: var(--brand); }
.quick span { font-size: 13px; color: var(--muted); }

/* =====================================================
                        DAFTAR KEGIATAN, ARSIP, FOTO
===================================================== */
.detail-card { padding: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 16px; }
.detail-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; margin-bottom: 16px; }
.detail-year { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
.detail-top h2 { font-size: 19px; line-height: 1.4; color: var(--brand); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; padding-top: 16px; border-top: 1px solid #edf0f3; }
.facts dt { font-size: 12.5px; color: var(--muted); margin-bottom: 2px; }
.facts dd { margin: 0; font-weight: 600; }

.resource {
                display: flex;
                align-items: center;
                gap: 16px;
                padding: 16px 20px;
                margin-bottom: 12px;
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: 12px;
}
.resource-icon {
                display: flex; align-items: center; justify-content: center;
                width: 46px; height: 46px; flex-shrink: 0;
                border-radius: 10px;
                background: var(--brand-soft);
                color: var(--brand);
                font-size: 22px;
}
.resource-name { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; line-height: 1.4; color: var(--brand); }
.resource-na { font-size: 13px; color: var(--muted); white-space: nowrap; }

/* =====================================================
                        SEKOLAH
===================================================== */
.back { margin-bottom: 18px; }
.id-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px 28px; margin: 0; }
.id-grid dt { font-size: 12.5px; color: var(--muted); margin-bottom: 2px; }
.id-grid dd { margin: 0; font-weight: 600; }
.mini-stats { display: flex; flex-wrap: wrap; gap: 12px 36px; margin-bottom: 16px; }
.mini-stats div { display: flex; align-items: baseline; gap: 8px; }
.mini-stats b { font-size: 22px; }
.mini-stats span { font-size: 13px; color: var(--muted); }

/* =====================================================
                        SERBA INFORMASI
===================================================== */
.acc { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
.acc-head {
                display: flex; align-items: center; gap: 16px;
                width: 100%;
                padding: 18px 20px;
                border: 0;
                background: var(--surface);
                text-align: left;
}
.acc-head:hover { background: #f8fafc; }
.acc-icon { display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; flex-shrink: 0; border-radius: 10px; background: var(--brand-soft); color: var(--brand); font-size: 24px; }
.acc-text { flex: 1; min-width: 0; }
.acc-text strong { display: block; font-size: 17px; }
.acc-text span { font-size: 13.5px; color: var(--muted); }
.acc-arrow { color: var(--muted); font-size: 20px; transition: transform .2s; }
.acc.open .acc-arrow { transform: rotate(90deg); }
.acc-body { display: none; padding: 4px 20px 22px; border-top: 1px solid #edf0f3; }
.acc.open .acc-body { display: block; padding-top: 20px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.tile { padding: 18px; border: 1px solid var(--line); border-radius: 10px; background: #fafbfc; }
.tile-label { font-size: 14px; font-weight: 600; color: var(--muted); }
.tile-value { margin: 4px 0 8px; font-size: 32px; line-height: 1.1; font-weight: 700; color: var(--brand); }
.tile p { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; color: var(--muted); padding: 3px 0; }
.tile p b { color: var(--ink); font-weight: 600; }
.dp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.dp-card { padding: 16px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.dp-card .dp-no { display: inline-block; font-size: 12.5px; font-weight: 700; color: var(--brand); background: var(--brand-soft); border-radius: 999px; padding: 2px 9px; }
.dp-card h3 { margin: 8px 0 12px; font-size: 14.5px; line-height: 1.35; color: var(--ink); }
.dp-total { font-size: 28px; font-weight: 700; color: var(--brand); line-height: 1.1; }
.dp-total small { display: block; font-size: 12.5px; font-weight: 500; color: var(--muted); margin-bottom: 2px; }
.dp-total.dp-tunggu { font-size: 16px; font-weight: 500; font-style: italic; color: var(--muted); }
.dp-split { display: flex; gap: 8px; margin-top: 12px; }
.dp-split div { flex: 1; padding: 8px 10px; border-radius: 8px; background: var(--paper); }
.dp-split span { display: block; font-size: 12.5px; color: var(--muted); }
.dp-split b { font-size: 15px; color: var(--ink); }
.dp-split b.dp-tunggu { font-size: 12.5px; font-weight: 500; font-style: italic; color: var(--muted); }

/* =====================================================
                        SERTIFIKAT & TENTANG
===================================================== */
.narrow { max-width: 760px; }
.cert-result { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
.cert-name { font-size: 18px; font-weight: 700; color: var(--brand); }
.cert-count { margin-bottom: 14px; font-size: 13.5px; color: var(--muted); }
.admin-box { margin-top: 22px; padding: 20px 22px; background: #f8fafb; border: 1px solid var(--line); border-radius: 12px; }
.admin-box h3 { display: flex; align-items: center; gap: 8px; font-size: 16px; color: var(--brand); }
.admin-box p { margin: 6px 0 14px; font-size: 13.5px; color: var(--muted); }

.about-lead { padding: 24px; margin-bottom: 18px; background: var(--brand); color: #fff; border-radius: 12px; }
.about-lead h2 { font-size: 20px; margin-bottom: 8px; line-height: 1.4; }
.about-lead p { color: rgba(255, 255, 255, .85); max-width: 70ch; }
.about-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.about-card { padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.about-card h3 { font-size: 16px; color: var(--brand); margin-bottom: 8px; }
.about-card p, .about-card li { font-size: 14px; color: var(--muted); }
.about-card ul { margin: 0; padding-left: 18px; }
.about-credit { margin-top: 20px; text-align: center; color: var(--muted); font-size: 13.5px; }

/* =====================================================
                        REKAP ATS
===================================================== */
.sub-title { margin: 26px 0 12px; font-size: 15.5px; font-weight: 700; color: var(--brand); }
.note-box { margin-top: 18px; padding: 14px 16px; border-radius: 10px; background: var(--brand-soft); font-size: 13.5px; color: #33475a; }
.note-box p { margin: 0; }
.note-box p + p { margin-top: 4px; }
.note-box b { color: var(--brand); }
.bar-row { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr) 96px; gap: 14px; align-items: center; padding: 7px 0; font-size: 13.5px; }
.bar-label { line-height: 1.4; }
.bar-label small { color: var(--muted); }
.bar-track { height: 10px; border-radius: 5px; background: #eef1f4; overflow: hidden; }
.bar-fill { display: block; height: 100%; border-radius: 5px; background: var(--brand); }
.bar-num { text-align: right; font-weight: 700; white-space: nowrap; }
.bar-num span { font-weight: 500; color: var(--muted); }
.two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 0 36px; }
@media (max-width: 640px) {
                .bar-row { grid-template-columns: minmax(0, 1fr) 96px; gap: 4px 12px; }
                .bar-row .bar-track { grid-column: 1 / -1; grid-row: 2; }
}

.jurusan-count { font-size: 13px; font-weight: 600; color: var(--brand); background: var(--brand-soft); padding: 3px 12px; border-radius: 999px; }
.jurusan-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px; margin: 0; padding: 0; list-style: none; }
.jurusan-list li { padding: 11px 14px; border: 1px solid var(--line); border-left: 3px solid var(--brand); border-radius: 8px; background: #fafbfc; font-weight: 500; line-height: 1.45; }

.formasi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.formasi-card { padding: 16px 18px; border: 1px solid var(--line); border-radius: 10px; background: #fafbfc; }
.formasi-card header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
.formasi-card h3 { font-size: 14.5px; line-height: 1.4; color: var(--brand); font-weight: 700; }
.formasi-row { padding: 9px 0; border-top: 1px solid #edf0f3; }
.formasi-top { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13.5px; }
.formasi-meta { margin-top: 5px; font-size: 12.5px; color: var(--muted); }
.bar-fill.full { background: var(--warn); }

/* =====================================================
                        TOAST
===================================================== */
.toast {
                position: fixed;
                left: 50%; bottom: 24px;
                transform: translate(-50%, 20px);
                max-width: calc(100vw - 32px);
                padding: 12px 18px;
                border-radius: 8px;
                background: var(--ink);
                color: #fff;
                font-size: 14px;
                opacity: 0;
                pointer-events: none;
                transition: opacity .2s, transform .2s;
                z-index: 60;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* =====================================================
                        RESPONSIF
===================================================== */
@media (max-width: 1100px) {
                .metrics { grid-template-columns: repeat(2, 1fr); }
                .metric:nth-child(2) { border-right: 0; }
                .metric:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
}

@media (max-width: 900px) {
                .topbar {
                                position: sticky; top: 0; z-index: 30;
                                display: flex; align-items: center; gap: 12px;
                                padding: 10px 14px;
                                background: var(--brand);
                                color: #fff;
                }
                .topbar button {
                                display: flex; align-items: center; justify-content: center;
                                width: 40px; height: 40px;
                                border: 0; border-radius: 8px;
                                background: rgba(255, 255, 255, .12);
                                color: #fff; font-size: 22px;
                }
                .topbar strong { font-size: 17px; letter-spacing: .02em; }

                .app { display: block; }
                .sidebar {
                                position: fixed;
                                z-index: 50;
                                top: 0; left: 0; bottom: 0;
                                height: 100%;
                                transform: translateX(-100%);
                                transition: transform .22s ease;
                                box-shadow: 0 0 40px rgba(0, 0, 0, .25);
                }
                .sidebar.open { transform: translateX(0); }
                .scrim.show { display: block; position: fixed; inset: 0; z-index: 40; background: rgba(10, 25, 40, .5); }

                #content { padding: 24px 18px 16px; }
                .footer { padding: 14px 18px 22px; }
                .page-head h1 { font-size: 23px; }

                .year-row { grid-template-columns: 1fr auto; gap: 10px 14px; }
                .year-label { grid-column: 1; }
                .year-row .btn { grid-column: 2; grid-row: 1; }
                .year-track { grid-column: 1 / -1; }
                .year-counts { grid-column: 1 / -1; flex-wrap: wrap; }
}

@media (max-width: 560px) {
                .metric { padding: 16px 14px; gap: 10px; }
                .metric-icon { width: 38px; height: 38px; font-size: 19px; }
                .metric-num { font-size: 23px; }
                .panel-pad { padding: 18px 16px; }
                .detail-top { flex-direction: column; }
                .resource { flex-wrap: wrap; padding: 14px; }
                .resource-name { flex-basis: calc(100% - 64px); }
                .resource .btn, .resource .resource-na { margin-left: 62px; }
                .toolbar .fixed { width: 100%; }
                .acc-head { padding: 14px; gap: 12px; }
                .acc-body { padding-left: 14px; padding-right: 14px; }
}

@media (prefers-reduced-motion: reduce) {
                * { transition: none !important; animation: none !important; }
}

/* =====================================================
                        PETA SEBARAN SEKOLAH
===================================================== */
.map-box { height: 520px; border: 1px solid var(--line); border-radius: 10px; position: relative; z-index: 0; isolation: isolate; background: #eef1f4; }
.leaflet-container { font-family: var(--font); }
.map-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin: 0 0 12px; font-size: 13px; color: var(--muted); }
.map-legend i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; border-radius: 50%; vertical-align: -1px; border: 1.5px solid #fff; box-shadow: 0 0 0 1px #9aa8b5; }
.map-pop strong { display: block; margin-bottom: 4px; font-size: 14px; color: var(--ink); }
.map-pop p { margin: 0 0 3px; font-size: 12.5px; color: var(--muted); }
.map-pop .btn { margin-top: 8px; }
@media (max-width: 560px) { .map-box { height: 380px; } }

/* =====================================================
                        UNDUH REKAP (Excel) DAN CETAK (PDF)
===================================================== */
.list-meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin: 0 0 12px; }
.list-meta .result-info { margin: 0; }
.list-meta .dl-bar { margin: 0; }
.dl-bar { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin: 14px 0 6px; }
.dl-bar .btn { display: inline-flex; align-items: center; gap: 6px; }
#areaCetak { display: none; }
@media print {
                body.mencetak > *:not(#areaCetak):not(svg) { display: none !important; }
                body.mencetak #areaCetak { display: block !important; }
                body.mencetak { background: #fff !important; }
                #areaCetak, #areaCetak * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
                #areaCetak .cetak-judul { margin: 0 0 4px; font-size: 22px; }
                #areaCetak .cetak-sub { margin: 0 0 18px; font-size: 12px; color: #555; }
                #areaCetak .tiles { grid-template-columns: repeat(3, 1fr); }
                #areaCetak .table-wrap { overflow: visible !important; max-height: none !important; }
                #areaCetak .tile, #areaCetak tr { break-inside: avoid; }
                #areaCetak thead { display: table-header-group; }
}
.panitia-role { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.chip-nama { display: inline-flex; align-items: center; gap: 6px; background: #eef2f6; border-radius: 999px; padding: 4px 12px; margin: 0 6px 6px 0; font-weight: 600; font-size: 13.5px; }
.chip-nama button { border: 0; background: #d4dce4; border-radius: 50%; width: 20px; height: 20px; padding: 0; line-height: 1; cursor: pointer; margin-right: -6px; }
.tabel-informasi { min-width: 0; font-size: 13px; }
.tabel-informasi th, .tabel-informasi td { padding: 10px 8px; }
.tabel-informasi th { white-space: normal; line-height: 1.3; }
.tabel-informasi .num { width: 34px; }
.anggota-detail { margin: 0 0 8px; }
.anggota-detail small { display: block; color: var(--muted); font-size: 12.5px; }
.tl-form-item { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; align-items: end; padding: 14px; margin-bottom: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.ns-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.tl-aksi { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.tl { border-left: 2px solid var(--line); margin-left: 6px; padding-left: 20px; }
.tl-item { position: relative; margin-bottom: 16px; }
.tl-item::before { content: ''; position: absolute; left: -27px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 3px var(--surface); }
.tl-item div { color: var(--muted); }
.tl-cek { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.tl-cek input { width: 20px; height: 20px; accent-color: #1a7f4b; cursor: pointer; flex: none; }
.tl-done::before { background: #1a7f4b; }
.tl-done .tl-cek b { color: var(--muted); text-decoration: line-through; }
.tl-waktu { color: #1a7f4b; }
.tl-ringkas { margin: 0 0 18px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.tl-ringkas small { display: block; margin-top: 8px; color: var(--muted); }
.tl-bar { height: 8px; margin-top: 8px; background: #e6ebf0; border-radius: 999px; overflow: hidden; }
.tl-bar span { display: block; height: 100%; background: #1a7f4b; border-radius: 999px; transition: width .3s; }
.panitia-role h3 { margin: 0 0 8px; font-size: 15px; }
textarea.input { min-height: 110px; resize: vertical; font: inherit; }

/* =====================================================
   TEMA BARU: lebih ringan, modern, elegan
   Hanya mengubah tampilan. Struktur HTML dan JavaScript tidak disentuh.
===================================================== */
:root {
  --ink: #0f2133;
  --muted: #62748a;
  --line: #e3e9f0;
  --paper: #f5f7fa;
  --surface: #ffffff;
  --brand: #14436e;
  --brand-deep: #0b2a47;
  --brand-soft: #e8f0f8;
  --gold: #e8b24a;
  --ok: #17784a;
  --ok-bg: #e4f4ec;
  --warn: #94590a;
  --warn-bg: #fdf1dc;
  --idle: #4b5b70;
  --idle-bg: #eaeff5;
  --danger: #b3261e;
  --danger-bg: #fdeceb;
  --sidebar-w: 276px;
  --r-lg: 18px;
  --r-md: 12px;
  --r-sm: 10px;
  --shadow-1: 0 1px 2px rgba(11, 42, 71, .05), 0 10px 28px -14px rgba(11, 42, 71, .16);
  --shadow-2: 0 2px 4px rgba(11, 42, 71, .06), 0 18px 36px -16px rgba(11, 42, 71, .24);
  --font: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --display: 'Bricolage Grotesque', 'Figtree', system-ui, sans-serif;
}

body { font-size: 15px; line-height: 1.6; background: var(--paper); -webkit-font-smoothing: antialiased; }
::selection { background: rgba(232, 178, 74, .35); }
:focus-visible { outline: 2px solid #3b8be0; outline-offset: 3px; }

/* ---------- Sidebar ---------- */
.sidebar {
  background: linear-gradient(180deg, #0e3354 0%, #0a2540 55%, #081d33 100%);
  padding: 28px 16px 22px;
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, .22) transparent;
}
.brand { padding: 0 8px 24px; margin-bottom: 20px; border-bottom: 1px solid rgba(255, 255, 255, .10); }
.logo-mark { width: 48px; height: 48px; border-radius: 22%; box-shadow: 0 0 0 2px rgba(255, 255, 255, .9), 0 8px 18px -6px rgba(0, 0, 0, .5); }
.logo-mark-sm { box-shadow: none; }
.brand-name { font-family: var(--display); font-size: 28px; font-weight: 700; letter-spacing: .01em; }
.brand-desc { margin-top: 10px; font-size: 12.5px; line-height: 1.55; color: rgba(255, 255, 255, .62); }
.nav { gap: 4px; }
.nav button {
  padding: 11px 14px;
  border-radius: var(--r-sm);
  color: rgba(255, 255, 255, .78);
  font-size: 14.5px;
  font-weight: 500;
  transition: background .18s, color .18s;
}
.nav button:hover { background: rgba(255, 255, 255, .08); color: #fff; }
.nav button.active,
.nav .menu-parent.has-active {
  background: linear-gradient(90deg, rgba(255, 255, 255, .17), rgba(255, 255, 255, .07));
  color: #fff;
  font-weight: 600;
}
.nav button.active::before { left: 5px; top: 11px; bottom: 11px; width: 3px; background: var(--gold); }
.nav .ic { opacity: .9; }
.submenu { margin: 2px 0 6px 24px; padding-left: 8px; border-left: 1px solid rgba(255, 255, 255, .14); }
.submenu button { padding: 9px 12px; font-size: 13.5px; }

/* ---------- Kerangka ---------- */
#content { max-width: 1200px; padding: 44px 44px 28px; }
.footer { font-size: 12.5px; color: #8796a8; padding: 20px 36px 30px; }

/* ---------- Judul halaman ---------- */
.page-head { margin-bottom: 30px; }
.page-head h1 { font-family: var(--display); font-size: 32px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; color: var(--brand-deep); }
.page-head p { margin-top: 8px; font-size: 15px; color: var(--muted); }
.block-head h2 { font-family: var(--display); font-size: 21px; font-weight: 600; letter-spacing: -.01em; color: var(--brand-deep); }
.panel-title { font-family: var(--display); font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.sub-title { color: var(--brand-deep); font-weight: 700; }

/* ---------- Panel dan kartu ---------- */
.panel, .table-wrap, .detail-card, .resource, .event, .acc, .about-card, .panitia-role, .tl-ringkas {
  border-color: var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-1);
}
.panel-pad { padding: 26px; }
.tile, .formasi-card, .admin-box { border-radius: var(--r-md); border-color: var(--line); background: #f9fbfd; }
.jurusan-list li { border-radius: var(--r-sm); background: #f9fbfd; border-left-color: var(--gold); }
.state { border-radius: var(--r-lg); border-color: #cdd8e4; background: #fbfcfe; }
.note-box { border-radius: var(--r-md); background: var(--brand-soft); }

/* ---------- Tombol ---------- */
.btn {
  padding: 10px 18px;
  border-radius: var(--r-sm);
  background: var(--brand);
  border-color: var(--brand);
  font-weight: 600;
  box-shadow: 0 1px 2px rgba(11, 42, 71, .2), 0 6px 14px -8px rgba(11, 42, 71, .55);
  transition: background .16s, border-color .16s, box-shadow .16s, transform .12s;
}
.btn:hover { background: var(--brand-deep); border-color: var(--brand-deep); box-shadow: 0 2px 4px rgba(11, 42, 71, .22), 0 10px 20px -10px rgba(11, 42, 71, .6); }
.btn:active { transform: translateY(1px); }
.btn-ghost { background: #fff; color: var(--brand); border-color: #cbd7e3; box-shadow: none; }
.btn-ghost:hover { background: var(--brand-soft); border-color: #b3c4d6; box-shadow: none; }
.btn-sm { padding: 7px 13px; }
.btn-text { color: var(--brand); }

/* ---------- Isian ---------- */
.field-label { font-size: 13px; font-weight: 600; color: #4a5c72; }
.input, .select {
  padding: 11px 14px;
  border: 1px solid #d3dce6;
  border-radius: var(--r-sm);
  background: #fff;
  transition: border-color .15s, box-shadow .15s;
}
.input:hover, .select:hover { border-color: #b9c7d6; }
.input:focus, .select:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(20, 67, 110, .13); }
.search-wrap .input { padding-left: 40px; }

/* ---------- Lencana ---------- */
.badge { padding: 4px 11px; font-size: 12px; letter-spacing: .005em; }
.jurusan-count { background: var(--brand-soft); }

/* ---------- Tabel ---------- */
.table-wrap { overflow-x: auto; }
.table th {
  padding: 13px 16px;
  background: #f4f7fb;
  border-bottom: 1px solid var(--line);
  font-size: 12.5px;
  font-weight: 700;
  color: #4a5c72;
}
.table td { padding: 13px 16px; border-bottom: 1px solid #edf1f6; }
.table tbody tr { transition: background .12s; }
.table tbody tr:hover { background: #f6f9fd; }
.table .strong { color: var(--brand-deep); }
.table tr.total td { background: #f4f7fb; color: var(--brand-deep); border-top: 2px solid var(--brand); }

/* ---------- Beranda ---------- */
.metrics { border-radius: var(--r-lg); }
.metric { padding: 24px 26px; gap: 16px; transition: background .16s; }
.metric:hover { background: #f6f9fd; }
.metric-icon {
  width: 48px; height: 48px;
  border-radius: 14px;
  background: linear-gradient(145deg, #e8f0f8, #d7e5f3);
  color: var(--brand);
}
.metric-num { font-family: var(--display); font-size: 34px; font-weight: 700; letter-spacing: -.02em; color: var(--brand-deep); }
.metric-label { font-size: 13.5px; }
.summary-num { font-family: var(--display); font-size: 24px; font-weight: 700; }
.year-list { border-top-color: var(--line); }
.year-row { padding: 16px 0; border-bottom-color: #edf1f6; }
.year-label strong { font-family: var(--display); font-size: 20px; color: var(--brand-deep); }
.year-track { height: 12px; border-radius: 999px; background: #edf1f6; }
.year-fill, .seg:first-child { border-radius: 999px; }
.seg-sudah, .dot-sudah { background: #1f9d63; }
.seg-proses, .dot-proses { background: #e4a53a; }
.seg-belum, .dot-belum { background: #9fb0c4; }
.event { padding: 22px; gap: 14px; }
.event h3 { font-family: var(--display); font-size: 17px; font-weight: 600; letter-spacing: -.01em; color: var(--brand-deep); }
.event-foot { border-top-color: #edf1f6; }
.quick button { padding: 18px 20px; border-radius: var(--r-md); border-color: var(--line); box-shadow: var(--shadow-1); transition: border-color .16s, box-shadow .16s, transform .16s; }
.quick button:hover { border-color: #b3c4d6; background: #fff; box-shadow: var(--shadow-2); transform: translateY(-2px); }
.quick strong { font-family: var(--display); font-size: 16px; color: var(--brand-deep); }

/* ---------- Detail, arsip, sekolah ---------- */
.detail-card { padding: 26px; }
.detail-top h2 { font-family: var(--display); font-size: 21px; font-weight: 600; letter-spacing: -.01em; color: var(--brand-deep); }
.facts { border-top-color: #edf1f6; }
.resource { padding: 18px 22px; transition: border-color .16s, box-shadow .16s; }
.resource:hover { border-color: #b3c4d6; box-shadow: var(--shadow-2); }
.resource-icon, .acc-icon { border-radius: 14px; background: linear-gradient(145deg, #e8f0f8, #d7e5f3); }
.resource-name { color: var(--brand-deep); }

/* ---------- Serba informasi ---------- */
.acc { margin-bottom: 16px; }
.acc-head { padding: 20px 24px; background: #fff; transition: background .15s; }
.acc-head:hover { background: #f8fafd; }
.acc-text strong { font-family: var(--display); font-size: 18px; font-weight: 600; color: var(--brand-deep); }
.acc-body { border-top-color: #edf1f6; padding: 4px 24px 26px; }
.tile { padding: 20px; }
.tile-value { font-family: var(--display); font-size: 34px; font-weight: 700; letter-spacing: -.02em; color: var(--brand); }

/* ---------- Bagan batang ---------- */
.bar-track { height: 10px; border-radius: 999px; background: #edf1f6; }
.bar-fill { border-radius: 999px; background: linear-gradient(90deg, #1b5a91, var(--brand)); }
.bar-fill.full { background: var(--warn); }
.bar-num { font-family: var(--display); font-weight: 700; }

/* ---------- Tentang ---------- */
.about-lead { padding: 30px; border-radius: var(--r-lg); background: linear-gradient(135deg, #0e3354, #0a2540); box-shadow: var(--shadow-2); }
.about-lead h2 { font-family: var(--display); font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.about-card h3 { font-family: var(--display); color: var(--brand-deep); }

/* ---------- Peta ---------- */
.map-box { border-radius: var(--r-lg); border-color: var(--line); box-shadow: var(--shadow-1); }

/* ---------- Timeline dan isian panitia ---------- */
.tl { border-left-color: #d3dce6; }
.tl-item::before { background: var(--brand); box-shadow: 0 0 0 4px #fff; }
.tl-done::before { background: #1f9d63; }
.tl-bar { height: 8px; background: #e6ecf3; }
.tl-bar span { background: linear-gradient(90deg, #1f9d63, #2fb878); }
.chip-nama { background: var(--brand-soft); color: var(--brand-deep); }
.panitia-role { padding: 20px; }
.panitia-role h3 { font-family: var(--display); font-size: 16px; color: var(--brand-deep); }

/* ---------- Toast ---------- */
.toast { border-radius: var(--r-md); background: var(--brand-deep); padding: 13px 20px; box-shadow: var(--shadow-2); }

/* ---------- Layar kecil ---------- */
@media (max-width: 900px) {
  .topbar { background: linear-gradient(90deg, #0e3354, #0a2540); box-shadow: 0 4px 16px -8px rgba(0, 0, 0, .5); }
  .topbar button { border-radius: var(--r-sm); }
  .topbar strong { font-family: var(--display); }
  #content { padding: 26px 18px 18px; }
  .page-head h1 { font-size: 25px; }
  .metric:nth-child(-n+2) { border-bottom-color: var(--line); }
}
@media (max-width: 560px) {
  .metric { padding: 18px 16px; }
  .metric-num { font-size: 27px; }
  .panel-pad { padding: 20px 18px; }
  .acc-head { padding: 16px; }
}

/* ---------- Update database per triwulan ---------- */
.badge-galat { background: var(--danger-bg); color: var(--danger); }
.utq-step { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 18px; padding: 22px 0; border-top: 1px solid var(--line); }
.utq-step:first-child { border-top: 0; padding-top: 4px; }
.utq-step:last-child { padding-bottom: 4px; }
.utq-no { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-family: var(--display); font-weight: 700; }
.utq-step h3 { margin: 0 0 4px; font-family: var(--display); font-size: 17px; font-weight: 600; color: var(--brand-deep); }
.utq-step p { margin: 0 0 14px; max-width: 68ch; color: var(--muted); }
.utq-nama { margin-left: 12px; font-size: 13.5px; color: var(--muted); word-break: break-all; }
.utq-laporan { margin-top: 18px; }
.utq-catatan { margin: 8px 0 0; padding-left: 18px; font-size: 13px; }
.utq-catatan li + li { margin-top: 3px; }
.utq-galat { color: var(--danger); }
.utq-peringatan { color: var(--warn); }
.utq-info { color: var(--muted); }
.utq-grup { margin: 22px 0 8px; font-family: var(--display); font-size: 16px; font-weight: 600; color: var(--brand-deep); }
.utq-periode { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0 0 14px; font-size: 13.5px; }
.utq-periode input { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; min-width: 230px; }
.utq-periode select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; min-width: 230px; }
.pbd-cepat { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
.acc-text .acc-update { display: block; margin-top: 3px; font-size: 12.5px; color: var(--brand); }
.update-terbaru { margin: 0 0 14px; font-size: 13.5px; color: var(--muted); }
.update-terbaru b { color: var(--brand); }
.utq-ket { margin: 6px 0 0; padding-left: 18px; }
.utq-aksi { margin-top: 18px; }
.utq-konfirmasi { padding: 16px 18px; border: 1px solid #f0d9a8; background: var(--warn-bg); border-radius: var(--r-md); }
.utq-konfirmasi p { margin: 0 0 12px; color: var(--ink); }
.utq-pilih { width: 18px; height: 18px; accent-color: var(--brand); cursor: pointer; }
.utq-sheet { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.utq-sheet h3 { margin: 0 0 2px; font-family: var(--display); font-size: 16px; color: var(--brand-deep); }
.utq-sheet p { margin: 0; max-width: 60ch; color: var(--muted); font-size: 14px; }
@media (max-width: 560px) { .utq-step { grid-template-columns: 32px minmax(0, 1fr); gap: 12px; } .utq-no { width: 32px; height: 32px; } }

/* ---- Perbandingan Data ---- */
.delta { font-weight: 700; white-space: nowrap; }
.delta.naik { color: var(--brand); }
.delta.turun { color: var(--warn); }
.delta.tetap { color: var(--muted); font-weight: 500; }
.pbd-legenda { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 6px 0 10px; }
.pbd-legenda i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.pbd-row { display: grid; grid-template-columns: 120px minmax(0, 1fr) 150px; gap: 14px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line, #e5e9ee); font-size: 13.5px; }
.pbd-bars { display: grid; gap: 4px; }
.pbd-bar { height: 18px; border-radius: 4px; min-width: 2px; position: relative; }
.pbd-bar.lama { background: #b8c4d0; }
.pbd-bar.baru { background: var(--brand); }
.pbd-bar span { position: absolute; left: calc(100% + 6px); top: 0; line-height: 18px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.pbd-bars { padding-right: 70px; }
@media (max-width: 640px) { .pbd-row { grid-template-columns: minmax(0, 1fr); gap: 6px; } }

/* =====================================================
                        TEMA GLASS (Glass SaaS Dashboard)
                        Ditaruh paling akhir agar menimpa gaya sebelumnya.
                        Untuk kembali ke tampilan lama, hapus blok ini.
===================================================== */
:root {
  --paper: #eef2fb;
  --line: rgba(255, 255, 255, .7);
  --brand: #2f4fd8;
  --brand-deep: #2340b8;
  --brand-soft: rgba(47, 79, 216, .09);
  --glass: rgba(255, 255, 255, .58);
  --glass-strong: rgba(255, 255, 255, .78);
  --glass-edge: rgba(255, 255, 255, .85);
  --glass-shadow: 0 10px 34px rgba(47, 79, 216, .10), 0 2px 8px rgba(20, 38, 58, .05);
  --glass-blur: blur(18px) saturate(160%);
  --r-glass: 18px;
}
body {
  background:
    radial-gradient(820px 560px at 6% -4%, #bfd0ff 0%, transparent 62%),
    radial-gradient(760px 560px at 98% 6%, #dcc9ff 0%, transparent 58%),
    radial-gradient(900px 640px at 72% 104%, #b9ecf6 0%, transparent 62%),
    #eef2fb;
  background-attachment: fixed;
}

/* Sidebar */
.sidebar {
  background: var(--glass);
  -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  border-right: 1px solid var(--glass-edge);
  color: var(--ink);
  box-shadow: 8px 0 32px rgba(47, 79, 216, .07);
}
.brand { border-bottom: 1px solid rgba(20, 38, 58, .10); }
.brand-name { color: var(--brand-deep); }
.brand-desc { color: var(--muted); }
.logo-mark { box-shadow: 0 6px 16px rgba(47, 79, 216, .28); }
.nav button { color: #3a4d63; border-radius: 12px; }
.nav button:hover { background: rgba(47, 79, 216, .08); color: var(--brand-deep); }
.nav button.active, .nav .menu-parent.has-active {
  background: var(--glass-strong); color: var(--brand-deep); font-weight: 600;
  box-shadow: 0 4px 14px rgba(47, 79, 216, .14), inset 0 0 0 1px var(--glass-edge);
}
.nav button.active::before { display: none; }
.nav button:focus-visible { outline-color: var(--brand); }
.submenu { border-left: 1px solid rgba(20, 38, 58, .12); }

/* Kartu / panel */
.panel, .acc, .event, .tile, .table-wrap, .detail-card, .resource, .about-card, .panitia-role, .tl-ringkas,
.metrics, .dp-card, .state {
  background: var(--glass);
  -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-edge);
  border-radius: var(--r-glass);
  box-shadow: var(--glass-shadow);
}
.state { border-style: solid; }
.state-error { background: rgba(253, 236, 234, .75); border-color: rgba(240, 184, 178, .9); }
.acc-head { background: transparent; }
.acc-head:hover { background: rgba(255, 255, 255, .45); }
.acc-body { border-top: 1px solid rgba(20, 38, 58, .08); }
.acc-icon { background: var(--brand-soft); border-radius: 14px; }
.event, .dp-card, .tile { transition: transform .18s ease, box-shadow .18s ease; }
.event:hover, .dp-card:hover, .tile:hover { transform: translateY(-2px); box-shadow: 0 16px 40px rgba(47, 79, 216, .16), 0 2px 8px rgba(20, 38, 58, .06); }
.note-box { background: rgba(255, 255, 255, .5); border: 1px solid var(--glass-edge); border-radius: 14px; }
.page-head h1 { color: #14263a; letter-spacing: -.01em; }

/* Tabel */
.table th { background: rgba(47, 79, 216, .07); color: #2c3e57; }
.table td { border-bottom: 1px solid rgba(20, 38, 58, .07); }
.table tbody tr:hover { background: rgba(255, 255, 255, .55); }
.table tr.total td { background: rgba(47, 79, 216, .08); border-top: 2px solid var(--brand); }

/* Input & tombol */
.input, .select {
  background: rgba(255, 255, 255, .7); border: 1px solid var(--glass-edge); border-radius: 12px;
  box-shadow: inset 0 1px 2px rgba(20, 38, 58, .05);
}
.input:focus, .select:focus { background: #fff; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(47, 79, 216, .18); }
.btn {
  background: linear-gradient(135deg, #4a68ee, #2f4fd8); border-color: transparent; border-radius: 12px;
  box-shadow: 0 6px 16px rgba(47, 79, 216, .30);
}
.btn:hover { background: linear-gradient(135deg, #3f5ce6, #2340b8); border-color: transparent; }
.btn-ghost {
  background: var(--glass-strong); color: var(--brand-deep); border: 1px solid var(--glass-edge); box-shadow: none;
}
.btn-ghost:hover { background: #fff; border-color: rgba(47, 79, 216, .35); }

/* Kartu indikator Dopadu */
.dp-card .dp-no { background: var(--brand-soft); }
.dp-total { color: var(--brand-deep); }
.dp-split div { background: rgba(255, 255, 255, .6); border: 1px solid var(--glass-edge); border-radius: 12px; }

/* Topbar HP */
@media (max-width: 900px) {
  .topbar { background: var(--glass); color: var(--ink); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); border-bottom: 1px solid var(--glass-edge); }
  .topbar button { background: var(--glass-strong); color: var(--brand-deep); }
  .sidebar { background: rgba(255, 255, 255, .88); }
  .scrim.show { background: rgba(20, 38, 90, .35); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
}

/* Cadangan: browser tanpa backdrop-filter atau pengguna meminta transparansi dikurangi */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  :root { --glass: rgba(255, 255, 255, .92); --glass-strong: #fff; }
}
@media (prefers-reduced-transparency: reduce) {
  :root { --glass: rgba(255, 255, 255, .96); --glass-strong: #fff; }
}
@media print {
  body { background: #fff; }
  .panel, .acc, .tile, .table-wrap, .dp-card { box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; background: #fff; }
}

/* Sentuhan di HP: tombol cukup tinggi untuk jari */
@media (max-width: 900px) {
  .btn, .btn-sm, .btn-text { min-height: 40px; }
  .btn-text { display: inline-flex; align-items: center; }
}

/* =====================================================
                        TEMA GELAP (dipilih lewat pemilih tema di sidebar)
===================================================== */
html[data-tema="gelap"] { color-scheme: dark; }
html[data-tema="gelap"] {
  --ink: #e8edf7;
  --muted: #9aa8c0;
  --paper: #0d1224;
  --line: rgba(255, 255, 255, .10);
  --surface: #151c33;
  --brand: #8ea6ff;
  --brand-deep: #b7c6ff;
  --brand-soft: rgba(142, 166, 255, .14);
  --glass: rgba(26, 34, 64, .58);
  --glass-strong: rgba(44, 56, 100, .72);
  --glass-edge: rgba(255, 255, 255, .11);
  --glass-shadow: 0 12px 36px rgba(0, 0, 0, .38), 0 2px 8px rgba(0, 0, 0, .25);
  --ok: #5fd39a; --ok-bg: rgba(95, 211, 154, .14);
  --warn: #f0b95a; --warn-bg: rgba(240, 185, 90, .14);
  --danger: #ff8d82; --danger-bg: rgba(255, 141, 130, .14);
  --idle: #b3bfd4; --idle-bg: rgba(255, 255, 255, .08);
}
html[data-tema="gelap"] body {
  background:
    radial-gradient(820px 560px at 6% -4%, #1f2f73 0%, transparent 62%),
    radial-gradient(760px 560px at 98% 6%, #3a2373 0%, transparent 58%),
    radial-gradient(900px 640px at 72% 104%, #0f4a5a 0%, transparent 62%),
    #0d1224;
  background-attachment: fixed;
}
html[data-tema="gelap"] .sidebar { box-shadow: 8px 0 32px rgba(0, 0, 0, .35); }
html[data-tema="gelap"] .brand { border-bottom-color: rgba(255, 255, 255, .10); }
html[data-tema="gelap"] .nav button { color: #b9c5dc; }
html[data-tema="gelap"] .nav button:hover { background: rgba(142, 166, 255, .12); color: #fff; }
html[data-tema="gelap"] .nav button.active, html[data-tema="gelap"] .nav .menu-parent.has-active { color: #fff; }
html[data-tema="gelap"] .submenu { border-left-color: rgba(255, 255, 255, .14); }
html[data-tema="gelap"] .page-head h1 { color: #f1f4fb; }
html[data-tema="gelap"] .acc-head:hover { background: rgba(255, 255, 255, .06); }
html[data-tema="gelap"] .acc-body { border-top-color: rgba(255, 255, 255, .08); }
html[data-tema="gelap"] .note-box { background: rgba(255, 255, 255, .06); color: #c3cee2; }
html[data-tema="gelap"] .note-box b { color: var(--brand-deep); }
html[data-tema="gelap"] .state-error { background: rgba(255, 141, 130, .12); border-color: rgba(255, 141, 130, .35); }
html[data-tema="gelap"] .table th { background: rgba(142, 166, 255, .12); color: #c9d4ea; }
html[data-tema="gelap"] .table td { border-bottom-color: rgba(255, 255, 255, .07); }
html[data-tema="gelap"] .table tbody tr:hover { background: rgba(255, 255, 255, .05); }
html[data-tema="gelap"] .table tr.total td { background: rgba(142, 166, 255, .14); }
html[data-tema="gelap"] .jurusan-list li { background: rgba(255, 255, 255, .06); color: var(--ink); border-color: rgba(255, 255, 255, .10); border-left-color: var(--gold); }
html[data-tema="gelap"] .input, html[data-tema="gelap"] .select {
  background: rgba(255, 255, 255, .07); color: var(--ink); border-color: rgba(255, 255, 255, .14); box-shadow: none;
}
html[data-tema="gelap"] .input:focus, html[data-tema="gelap"] .select:focus { background: rgba(255, 255, 255, .11); box-shadow: 0 0 0 3px rgba(142, 166, 255, .28); }
html[data-tema="gelap"] .select option { background: #1a2240; color: #e8edf7; }
html[data-tema="gelap"] .btn-ghost { color: var(--brand-deep); }
html[data-tema="gelap"] .btn-ghost:hover { background: rgba(255, 255, 255, .14); border-color: rgba(142, 166, 255, .5); }
html[data-tema="gelap"] .dp-split div { background: rgba(255, 255, 255, .06); }
html[data-tema="gelap"] .event:hover, html[data-tema="gelap"] .dp-card:hover, html[data-tema="gelap"] .tile:hover { box-shadow: 0 16px 40px rgba(0, 0, 0, .5); }
html[data-tema="gelap"] .bar-track { background: rgba(255, 255, 255, .10); }
html[data-tema="gelap"] .pbd-bar.lama { background: #5d6b87; }
html[data-tema="gelap"] .toast { background: #26315a; color: #fff; }
@media (max-width: 900px) {
  html[data-tema="gelap"] .sidebar { background: rgba(18, 24, 48, .94); }
  html[data-tema="gelap"] .topbar { color: var(--ink); }
}

html[data-tema="gelap"] .field-label { color: #b3bfd4; }
html[data-tema="gelap"] .metric-icon { background: rgba(142, 166, 255, .16); color: var(--brand-deep); }

/* Pemilih tema */
.tema-switch { margin-top: auto; padding: 18px 6px 4px; }
.tema-switch .tema-judul { padding: 0 6px 8px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.tema-opsi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 14px; background: rgba(20, 38, 58, .07); border: 1px solid var(--glass-edge); }
.tema-opsi button {
  display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; padding: 8px 4px;
  border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 600;
}
.tema-opsi button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tema-opsi button:hover { color: var(--brand-deep); }
.tema-opsi button[aria-pressed="true"] { background: var(--glass-strong); color: var(--brand-deep); box-shadow: 0 3px 10px rgba(47, 79, 216, .16), inset 0 0 0 1px var(--glass-edge); }
html[data-tema="gelap"] .tema-opsi { background: rgba(255, 255, 255, .06); }


/* =====================================================
   SIDEBAR GAYA DASBOR (panel indigo melayang, menu aktif berupa pil putih)
   Selektor diawali "html:root .app .sidebar" agar menang atas aturan tema lama.
===================================================== */
:root {
  --sb-bg: linear-gradient(180deg, #3d36bd 0%, #2c2799 100%);
  --sb-shadow: 0 22px 44px -16px rgba(44, 39, 153, .55);
  --sb-pill: #ffffff;
  --sb-pill-ink: #2c2799;
}
html[data-tema="gelap"] {
  --sb-bg: linear-gradient(180deg, #292c78 0%, #171a4a 100%);
  --sb-shadow: 0 22px 44px -16px rgba(0, 0, 0, .65);
  --sb-pill: #eef1ff;
  --sb-pill-ink: #1d2160;
}
html:root .app .sidebar {
  background: var(--sb-bg);
  color: #fff;
  border: 0;
  -webkit-backdrop-filter: none; backdrop-filter: none;
  box-shadow: var(--sb-shadow);
  padding: 24px 14px 18px;
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, .25) transparent;
}
@media (min-width: 901px) {
  html:root .app .sidebar { top: 16px; margin: 16px 0 16px 16px; height: calc(100vh - 32px); border-radius: 30px; }
}
@media (max-width: 900px) {
  html:root .app .sidebar { border-radius: 0 28px 28px 0; }
}

/* Logo dan nama */
html:root .app .sidebar .brand { border-bottom: 0; padding: 0 6px; margin-bottom: 26px; }
html:root .app .sidebar .brand-name { color: #fff; }
html:root .app .sidebar .brand-desc { color: rgba(255, 255, 255, .66); }
html:root .app .sidebar .logo-mark { box-shadow: 0 0 0 2px rgba(255, 255, 255, .35), 0 8px 18px -6px rgba(0, 0, 0, .45); }

/* Menu */
html:root .app .sidebar .nav { gap: 6px; }
html:root .app .sidebar .nav button {
  padding: 11px 14px; border-radius: 16px; background: transparent; box-shadow: none;
  color: rgba(255, 255, 255, .8); font-size: 14px; font-weight: 500;
}
html:root .app .sidebar .nav button:hover { background: rgba(255, 255, 255, .11); color: #fff; }
html:root .app .sidebar .nav button.active {
  background: var(--sb-pill); color: var(--sb-pill-ink); font-weight: 700;
  box-shadow: 0 10px 20px -10px rgba(0, 0, 0, .45);
}
html:root .app .sidebar .nav button.active::before { display: none; }
html:root .app .sidebar .nav .menu-parent.has-active { background: rgba(255, 255, 255, .15); color: #fff; box-shadow: none; font-weight: 600; }
html:root .app .sidebar .nav .ic { opacity: 1; }
html:root .app .sidebar .nav button:focus-visible { outline-color: #fff; outline-offset: -2px; }
html:root .app .sidebar .submenu { border-left: 1px solid rgba(255, 255, 255, .2); margin: 2px 0 6px 22px; padding-left: 8px; }
html:root .app .sidebar .submenu button { font-size: 13.5px; padding: 9px 12px; border-radius: 14px; }

/* Pemilih tema di dasar sidebar */
html:root .app .sidebar .tema-switch .tema-judul { color: rgba(255, 255, 255, .6); }
html:root .app .sidebar .tema-opsi { background: rgba(255, 255, 255, .10); border: 1px solid rgba(255, 255, 255, .14); }
html:root .app .sidebar .tema-opsi button { color: rgba(255, 255, 255, .72); }
html:root .app .sidebar .tema-opsi button:hover { color: #fff; }

/* =====================================================
   APP LAINNYA (daftar aplikasi, 3 kolom)
===================================================== */
.al-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 1200px) { .al-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 720px) { .al-grid { grid-template-columns: 1fr; } }
.al-card {
  --k-s: 80%; --k-bg: 93%; --k-bd: 70%; --k-hv: 88%; --k-tile: 86%; --k-fg: 26%; --m-s: 50%; --m-bg: 90%; --m-fg: 28%;
  display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 12px; min-width: 0; color: inherit; text-decoration: none;
  background: hsl(var(--h) var(--k-s) var(--k-bg));
  border: 1px solid hsl(var(--h) 45% var(--k-bd)); border-left: 5px solid hsl(var(--h) 65% 48%); border-radius: 10px;
  box-shadow: 0 1px 2px rgba(15, 27, 45, .10), 0 4px 10px -6px rgba(15, 27, 45, .28);
  transition: background .15s, border-color .15s, box-shadow .15s;
}
html[data-tema="gelap"] .al-card { --k-s: 48%; --k-bg: 17%; --k-bd: 30%; --k-hv: 22%; --k-tile: 27%; --k-fg: 82%; --m-s: 42%; --m-bg: 22%; --m-fg: 84%; }
.al-card:hover { background: hsl(var(--h) var(--k-s) var(--k-hv)); border-color: hsl(var(--h) 65% 52%); box-shadow: 0 6px 16px -10px rgba(15, 27, 45, .35); }
.al-card:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.al-ico { position: relative; overflow: hidden; flex: none; width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 16px; background: hsl(var(--h) var(--m-s) var(--m-bg)); color: hsl(var(--h) var(--m-s) var(--m-fg)); }
.al-ico.sv { background: hsl(var(--h) var(--k-s) var(--k-tile)); color: hsl(var(--h) 62% var(--k-fg)); }
.al-ico svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.al-fv { position: absolute; inset: 0; width: 100%; height: 100%; padding: 6px; object-fit: contain; background: #fff; border-radius: inherit; }
.al-txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
.al-card b { font-size: 14.5px; line-height: 1.3; color: var(--ink); overflow-wrap: anywhere; }
.al-card small { font-size: 12px; line-height: 1.4; color: var(--muted); overflow-wrap: anywhere; }
.al-url { font-weight: 500; font-size: 11.5px; line-height: 1.4; color: hsl(var(--h) 62% var(--k-fg)); overflow-wrap: anywhere; word-break: break-all; }
.al-tag { flex: none; align-self: flex-start; padding: 2px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 600; color: hsl(var(--h) 55% var(--k-fg)); background: hsl(var(--h) var(--k-s) var(--k-tile)); }
.al-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
.al-chip { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 6px 14px; min-height: 34px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.al-chip b { opacity: .7; margin-left: 4px; font-weight: 600; }
.al-chip:hover { color: var(--ink); }
.al-chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
html[data-tema="gelap"] .al-chip[aria-pressed="true"] { color: #0d1224; }
@media (prefers-reduced-motion: reduce) { .al-card { transition: none; } }

/* =====================================================
   SKIN v51 — Arc (kerangka) · beUI (gerak) · Bencho (interaksi)
   Lapisan tambahan; hapus blok ini untuk kembali ke tampilan v50.
===================================================== */
:root {
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --out: cubic-bezier(.22, 1, .36, 1);
}

/* ---- Arc: sidebar melayang + lembar konten membulat ---- */
@media (min-width: 901px) {
  html:root .app { padding-right: 16px; }
  html:root .app .main {
    margin: 16px 0 16px 12px;
    min-height: calc(100vh - 32px);
    border-radius: 28px;
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-1);
  }
}
.nav { position: relative; }
.nav-pill {
  position: absolute; left: 0; top: 0;
  border-radius: 14px;
  background: rgba(255, 255, 255, .17);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14);
  pointer-events: none; opacity: 0;
  transition: transform .42s var(--spring), width .3s var(--out), height .3s var(--out), opacity .2s;
}
.nav.has-pill .nav-pill { opacity: 1; }
.nav.has-pill button.active,
.nav.has-pill .menu-parent.has-active { background: transparent; }
.nav.has-pill button.active::before { display: none; }
.nav button {
  position: relative; z-index: 1; border-radius: 14px;
  transition: color .18s, background .18s, transform .25s var(--spring);
}
.nav button:active { transform: scale(.97); }

/* ---- beUI: gerak berpegas pada tombol, kartu, toast ---- */
.btn, .btn-ghost, .btn-sm {
  transition: background .15s, border-color .15s, box-shadow .25s var(--out), transform .25s var(--spring);
}
.btn:active, .btn-ghost:active, .btn-sm:active { transform: scale(.96); }
.metric { transition: background .15s, transform .25s var(--spring); }
.metric:active { transform: scale(.985); }
.table tbody tr { transition: background .15s; }
.table tbody tr:hover { background: var(--brand-soft); }
@media (hover: hover) {
  .btn:not(:disabled):hover { transform: translateY(-1px); }
  .event, .al-card, .resource, .dp-card, .formasi-card {
    transition: transform .3s var(--spring), box-shadow .3s var(--out), border-color .2s;
  }
  .event:hover, .al-card:hover, .resource:hover, .dp-card:hover, .formasi-card:hover {
    transform: translateY(-3px); box-shadow: var(--shadow-2);
  }
}
.toast {
  position: fixed; border-radius: 999px; padding: 12px 20px 12px 40px;
  box-shadow: var(--shadow-2);
  transform: translate(-50%, 24px) scale(.94);
  transition: opacity .25s var(--out), transform .45s var(--spring);
}
.toast.show { transform: translate(-50%, 0) scale(1); }
.toast::before {
  content: ""; position: absolute; left: 18px; top: 50%;
  width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: var(--gold);
}
@media (prefers-reduced-motion: no-preference) {
  #content.swap { animation: simakSwap .28s var(--out); }
  @keyframes simakSwap { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}

/* ---- Bencho: saklar suara klik ---- */
.snd-toggle {
  width: 100%; margin-top: 8px; padding: 9px 12px;
  border-radius: 12px; border: 1px solid rgba(255, 255, 255, .18);
  background: transparent; color: rgba(255, 255, 255, .8);
  font-size: 13px; text-align: left;
  transition: background .2s, color .2s, transform .25s var(--spring);
}
.snd-toggle:hover { background: rgba(255, 255, 255, .08); }
.snd-toggle:active { transform: scale(.97); }
.snd-toggle[aria-pressed="true"] { background: rgba(255, 255, 255, .17); color: #fff; }
@media (prefers-reduced-motion: reduce) {
  .nav-pill, .nav button, .btn, .toast, .snd-toggle { transition: none; }
}

/* =====================================================
   ISLAND v52 — kapsul notifikasi dan status proses (pengganti toast)
===================================================== */
.toast { display: none !important; }
.island {
  position: fixed; left: 50%; top: max(12px, env(safe-area-inset-top)); z-index: 80;
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px;
  min-width: 48px; max-width: min(92vw, 420px);
  padding: 10px 18px 10px 12px;
  background: #0b0f14; color: #fff;
  border: 1px solid rgba(255, 255, 255, .14); border-radius: 999px;
  box-shadow: 0 14px 34px -10px rgba(0, 0, 0, .55);
  font-size: 14px; line-height: 1.35;
  opacity: 0; pointer-events: none;
  transform: translate(-50%, -150%) scale(.85);
  transition: transform .5s var(--spring), opacity .2s, border-radius .3s var(--out), padding .3s var(--out), min-width .3s var(--out);
}
.island.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
.island.work { border-radius: 22px; padding: 12px 18px 14px 12px; min-width: min(86vw, 300px); }
.isl-ic {
  flex: none; width: 22px; height: 22px; border-radius: 50%;
  display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #0b0f14;
  background: var(--gold);
}
.island.ok .isl-ic { background: #5fd39a; }
.island.ok .isl-ic::before { content: "\2713"; }
.island.err .isl-ic { background: #ff8d82; }
.island.err .isl-ic::before { content: "!"; }
.island.work .isl-ic { background: transparent; border: 2.5px solid rgba(255, 255, 255, .25); border-top-color: #fff; animation: islSpin .8s linear infinite; }
.isl-tx { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.isl-bar { display: none; flex-basis: 100%; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .16); overflow: hidden; }
.island.work .isl-bar { display: block; }
.isl-bar i { display: block; width: 38%; height: 100%; border-radius: 4px; background: var(--gold); animation: islSlide 1.1s var(--out) infinite; }
@keyframes islSpin { to { transform: rotate(360deg); } }
@keyframes islSlide { from { transform: translateX(-100%); } to { transform: translateX(270%); } }
@media (prefers-reduced-motion: reduce) {
  .island { transition: opacity .2s; transform: translate(-50%, 0); }
  .island.work .isl-ic, .isl-bar i { animation: none; }
}

/* ---- Penanda loading: jam pasir di tengah halaman, kotak memuat, dan spinner kecil ---- */
@keyframes simakPutar { to { transform: rotate(360deg); } }
@keyframes simakDenyut { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
@keyframes jpPutar { 0%, 84% { transform: rotate(0deg); } 100% { transform: rotate(180deg); } }
@keyframes jpAtas { 0% { transform: scaleY(1); } 80%, 100% { transform: scaleY(0); } }
@keyframes jpBawah { 0% { transform: scaleY(0); } 80%, 100% { transform: scaleY(1); } }
@keyframes jpAlir { 0%, 3% { opacity: 0; } 8%, 78% { opacity: 1; } 84%, 100% { opacity: 0; } }
@keyframes jpTetes { to { stroke-dashoffset: -6; } }
.jp { display: block; flex: none; color: var(--brand); }
html[data-tema="gelap"] .jp { color: #dbe7f3; }
.jp g, .jp path, .jp line { transform-box: fill-box; }
.jp .jp-rot { transform-box: view-box; transform-origin: 50% 50%; animation: jpPutar 2.6s cubic-bezier(.65, 0, .35, 1) infinite; }
.jp .jp-kaca { fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.jp .jp-pasir { fill: var(--gold); }
.jp .jp-atas { transform-origin: 50% 100%; animation: jpAtas 2.6s linear infinite; }
.jp .jp-bawah { transform-origin: 50% 100%; animation: jpBawah 2.6s linear infinite; }
.jp .jp-alir { stroke: var(--gold); stroke-width: 1.8; stroke-linecap: round; stroke-dasharray: 2 4; animation: jpAlir 2.6s linear infinite, jpTetes .35s linear infinite; }
.simak-muat { position: fixed; left: 50%; top: 50%; z-index: 90; display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 150px; padding: 22px 30px 18px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); box-shadow: 0 14px 44px rgba(10, 25, 40, .2); color: var(--muted); font-size: 13.5px; font-weight: 600; pointer-events: none; opacity: 0; visibility: hidden; transform: translate(-50%, -46%); transition: opacity .22s, transform .22s, visibility .22s; }
.simak-muat.on { opacity: 1; visibility: visible; transform: translate(-50%, -50%); }
.loading-box { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border: 1px dashed var(--line); border-radius: 12px; background: var(--surface); color: var(--muted); font-size: 14px; }
.spin { display: inline-block; flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--line); border-top-color: var(--brand); animation: simakPutar .8s linear infinite; vertical-align: -4px; }
.spin-sm { width: 13px; height: 13px; border-width: 2px; vertical-align: -2px; }
html[data-tema="gelap"] .spin, html[data-tema="gelap"] .dok-muat::before { border-top-color: var(--gold); }
.dok-muat::before { content: ""; display: inline-block; width: 13px; height: 13px; margin-right: 8px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--brand); animation: simakPutar .8s linear infinite; vertical-align: -2px; }
@media (prefers-reduced-motion: reduce) {
  .jp .jp-rot, .jp .jp-atas, .jp .jp-bawah, .jp .jp-alir { animation: none; }
  .jp .jp-atas { transform: scaleY(.5); } .jp .jp-bawah { transform: scaleY(.5); }
  .simak-muat { animation: simakDenyut 1.6s ease-in-out infinite; transition: opacity .2s; }
  .spin, .dok-muat::before { animation-duration: 2.4s; }
}

/* ---- Arsip & Foto Kegiatan: daftar tiga baris ---- */
.dok-list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); overflow: hidden; }
.dok-row { display: flex; align-items: center; gap: 16px; padding: 18px 22px; border-top: 1px solid var(--line); }
.dok-row:first-child { border-top: 0; }
.dok-ico { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 13px; background: var(--brand-soft); color: var(--brand); font-size: 21px; }
.dok-teks { flex: 1; min-width: 0; }
.dok-judul { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; font-size: 16px; font-weight: 700; line-height: 1.4; color: var(--brand); }
.dok-ket { margin: 2px 0 0; font-size: 13.5px; color: var(--muted); }
.dok-badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); font-size: 12px; font-weight: 600; }
.dok-aksi { flex: none; display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 10px; max-width: 100%; }
.dok-masuk { display: flex; gap: 8px; }
.dok-masuk .input { width: 210px; min-width: 0; }
.dok-pesan { flex-basis: 100%; margin: 0; min-height: 0; text-align: right; font-size: 13px; }
.dok-pesan:empty { display: none; }
.dok-galat { color: var(--danger); }
.dok-muat { color: var(--muted); font-size: 14px; }
@media (max-width: 680px) {
  .dok-row { flex-wrap: wrap; padding: 16px 16px; }
  .dok-teks { flex-basis: calc(100% - 60px); }
  .dok-aksi { flex-basis: 100%; justify-content: flex-start; }
  .dok-masuk { flex: 1; }
  .dok-masuk .input { flex: 1; width: auto; }
  .dok-pesan { text-align: left; }
}
@media (min-width: 1101px) { .metrics { grid-template-columns: repeat(2, 1fr); } }
